比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "21362282", "author": "京城Z先生", "date": "2024-05-24", "title": "简析中国海洋石油的优缺点", "chars": 402, "read": true, "has_note": true, "themes": ["成本优势", "海外项目", "尾部风险", "600938", "80883", "883"], "source": "https://longbridge.cn/zh-CN/topics/21362282", "path": "library/21362282.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "短文把中海油优势概括为海洋勘探资源、国内低成本建造能力及较新油田，认为这些支撑每桶利润；又引用海外项目和圭亚那增长，以及莫桑比克区块合同，作为复制优势的路径。作者同时承认海外核心资源可能遭遇难以控制的地缘风险，损失可能巨大；但最终仍倾向相信这种极端情况不会发生，结合低估值、分红与管理层沟通，认为持有体验和投资价值较好。", "lesson": "可学把优势落到每桶成本与可复制产量，但新油田不一定天然成本低，海外合同也未必形成盈利。把缺点压缩成一个地缘尾部项会遗漏油价、开发成本、资源税等变量；相信极端事件不会来，不是估计其概率与损失的替代。"}, {"id": "21268454", "author": "京城Z先生", "date": "2024-05-22", "title": "机翻：巴西石油公司解雇了 20 名与前首席执行官关系密切的员工", "chars": 1583, "read": true, "has_note": true, "themes": ["PBR", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/21268454", "path": "library/21268454.html", "classification": "平台长文；原创性未逐篇认证", "core": "$巴西石油公司(PBR.US) $Petroleo Brasileiro(PBR.A.US) 路透社：2024 年 5 月 18 日上午 1:52 GMT+8 更新于 4 天前 2024 年 5 月 15 日，巴西国有石油公司 巴西石油公司 前首席执行官 Je­an-Pa­ul Pr­a­te 在离开位于巴西里约热内卢的 巴西石油 公司总部时接受记者采访。", "lesson": "低倍数可能对应周期高点；供需、资本开支和利润持续时间要一起估。"}, {"id": "21219018", "author": "SpaceM", "date": "2024-05-20", "title": "如何在长桥给 Elon 投支持票", "chars": 808, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/21219018", "path": "library/21219018.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "6 月份的股东大会，因为涉及到 Elon 的期权奖励能不能重新被股东们批准，大家都很关注。 那如何在长桥给 Elon 投支持票呢。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "21196867", "author": "京城Z先生", "date": "2024-05-18", "title": "本周实盘-20240518（美股篇）：重仓股爆雷，没影响净值新高", "chars": 2711, "read": true, "has_note": true, "themes": ["PBR.A", "PBR", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/21196867", "path": "library/21196867.html", "classification": "平台长文；原创性未逐篇认证", "core": "此外，随着降息预期转向，谷歌的广告业务也可能进一步回暖，看好下一季度财报数据，接下来可能会进一步加仓，但要先看看下周英伟达的财报。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "21090465", "author": "价值&投资", "date": "2024-05-15", "title": "阿里财报电话会议的一些记录", "chars": 1573, "read": true, "has_note": true, "themes": ["9988", "BABA", "89988"], "source": "https://longbridge.cn/zh-CN/topics/21090465", "path": "library/21090465.html", "classification": "平台长文；原创性未逐篇认证", "core": "我个人整体看好，阿里重新回归正轨，现在投入期利润不是重点，路走对了就不怕远！", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "21103814", "author": "京城Z先生", "date": "2024-05-15", "title": "巴西石油 2024Q1 财报&利空解读", "chars": 1953, "read": true, "has_note": true, "themes": ["PBR", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/21103814", "path": "library/21103814.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者将Q1经营数据略低预期与盘后CEO被解雇分开，认为前者多由季节性、销量、汇率等影响，后者关系公司现金是否返还股东。对于新CEO会执行何种派息政策，明确信息不足，先观望，再据后续方案判断，而非只因估值低立即加仓。", "lesson": "最值得学的是将“公司能赚钱”与“股东能分到钱”拆开。政策折价本已存在，不等于任何新损害都已计价；宏观因素也能永久影响经营。本文雷亚尔税费换算不可靠，不沿用；仓位约束比断言利空可忽略更稳妥。"}, {"id": "21032778", "author": "京城Z先生", "date": "2024-05-12", "title": "本周实盘-20240512：降不降，就看下周了", "chars": 1615, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG", "PBR.A", "PBR", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/21032778", "path": "library/21032778.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 16.4%，微软 16.3%，巴西石油 24.9%，谷歌 4.8%，TLT 21.7%，大饼 ETF 14.6%，爱马仕 adr 1.4%，现金/其他 0%。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "20955199", "author": "京城Z先生", "date": "2024-05-08", "title": "巴西石油凭什么分红那么多？", "chars": 843, "read": true, "has_note": true, "themes": ["PBR.A", "PBR"], "source": "https://longbridge.cn/zh-CN/topics/20955199", "path": "library/20955199.html", "classification": "平台长文；原创性未逐篇认证", "core": "综上，券商里的数据没错，就是这么霸气侧漏的高息🤩 同时，这么高息一方面是巴西国债利率就高，另一方面这是巴西石油本身质地很好，二者叠加，就有了这么一只同时具备高成长➕高股息的梦幻股票。", "lesson": "低倍数可能对应周期高点；供需、资本开支和利润持续时间要一起估。"}, {"id": "20905747", "author": "京城Z先生", "date": "2024-05-05", "title": "本周实盘-20240505：超级回购与特别分红", "chars": 1767, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG", "AAPL", "PBR.A", "PBR"], "source": "https://longbridge.cn/zh-CN/topics/20905747", "path": "library/20905747.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 16.5%，微软 16.1%，巴西石油 24.4%，谷歌 4.8%，TLT 21.8%，大饼 ETF 15.1%，爱马仕 adr 1.4%，现金/其他 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "20876598", "author": "京城Z先生", "date": "2024-05-03", "title": "苹果 Q2 财报解读：超预期，只因预期设太低，估值即将修复", "chars": 1968, "read": true, "has_note": true, "themes": ["AAPL"], "source": "https://longbridge.cn/zh-CN/topics/20876598", "path": "library/20876598.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 苹果遇到的主要问题： 1、手机销量低迷 这个问题有 3 个子问题：（1）手机消费市场整体低迷；（2）苹果手机自身缺乏创新；（3）中国市场宏观经济低迷 苹果无法解决（1）和（3），属于不可抗力，熬过周期即可，但是作为曾经引领行业前沿的灯塔，第（2）部分这些年一直在吃老本，除了更昂贵的价格，后面几代新机毫无新意，甚至部分功能已被高端安卓机击败，这绝对是库克的责任。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "20867054", "author": "輸棟樓的韭菜", "date": "2024-05-03", "title": "恒指到底怎么了？又将会去哪儿？", "chars": 1448, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/20867054", "path": "library/20867054.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "（這條線，我也認為是所有長期投資者最值得看的抄底線，以 SPY 舉例，只要不是大的危機，這條線 spy 只會靠近觸碰，不會跌穿） 以 850 日線為例，850 個交易日即接近 3.5 年的時間，恰好是 7 年大經濟周期的一半。", "lesson": "低估值需同时检查治理、现金分配和需求恢复，不用宏观资金流替代公司证据。"}, {"id": "20791944", "author": "京城Z先生", "date": "2024-04-28", "title": "本周实盘-20240428：财报季信息量很大，又调仓了", "chars": 3365, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG", "MSFT", "PBR.A", "PBR"], "source": "https://longbridge.cn/zh-CN/topics/20791944", "path": "library/20791944.html", "classification": "平台长文；原创性未逐篇认证", "core": "具体来看，特斯拉第一季度总营收为 213.01 亿美元，同比下降 9%，其中汽车业务的营收为 173.78 亿美元，同比下滑 13%；毛利润为 36.96 亿美元，同比下滑 18%；毛利率为 17.4%，低于去年第四季度（17.6%）和去年同期（19.3%）。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "20764168", "author": "京城Z先生", "date": "2024-04-26", "title": "谷歌 2024Q1 财报解读：背水一战，大获全胜", "chars": 1076, "read": true, "has_note": true, "themes": ["困境修复", "分部利润", "资本回报", "GOOGL", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/20764168", "path": "library/20764168.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "作者用2024Q1谷歌收入约805.39亿美元、净利润约236.62亿美元，及云收入约95.7亿美元、云营业利润约9亿美元，说明市场担忧的业务有恢复迹象。他将微软AI视为增量、苹果视为优化、谷歌视为存亡问题，因此认为谷歌改善更能撤销悲观。公司同时启动每股0.20美元季度股息、授权700亿美元回购，给成长修复叠加股东回报。全文没有新增成交，属于对持有逻辑的强化。", "lesson": "把收入、利润和现金返还分开验证，比只看模型演示更有投资信息。但一季云利润改善不证明AI已完全追上，也不能把模型竞争简化为买够芯片；回购授权不等于实际注销。应继续追踪云增长、搜索经济性及再投资回报。"}, {"id": "20752558", "author": "晓风 morning_wind", "date": "2024-04-26", "title": "半导体的调仓思路&兼谈 AI 芯片景气度的一些想法", "chars": 2102, "read": true, "has_note": true, "themes": ["TSM", "META", "TSLA", "AMD", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/20752558", "path": "library/20752558.html", "classification": "平台长文；原创性未逐篇认证", "core": "减了一半的 $AMD(AMD.US) 的持仓份额，加仓了 $英伟达(NVDA.US) 加仓了 $台积电(TSM.US) 大跌大幅度加仓了 $Meta(META.US) 财报前夕小幅度加仓了 $特斯拉(TSLA.US) 调仓资金来源一部分是 AMD 减持，一部分是 XBI 的减持 调仓买入 META 理由： 首先是 Meta 大跌，很显然是被老板坚决在 AI 上的投入指引给吓坏到了，联想到几年前头铁 allin VR，大幅度支出带不来业务增长的黑历史。", "lesson": "按产品、客户、架构和利润持续时间拆解；多只芯片股仍可能依赖同一资本开支周期。"}, {"id": "20754341", "author": "輸棟樓的韭菜", "date": "2024-04-26", "title": "微软财报与上下游利润归属", "chars": 1002, "read": true, "has_note": true, "themes": ["MSFT", "NVDA", "002594", "1211", "81211", "BYDDF", "BYDDY", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/20754341", "path": "library/20754341.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "作者认为微软云和PC表现稳定，AI资本支出超预期使NVDA成为更直接赢家；苹果虽然当季处周期低位，却控制大量终端安装基础，有机会后来居上。他不认为微软会永久霸占市值第一。", "lesson": "可学习从公司财报推导上下游收入，但Capex不能自动等同全部AI开支，更不能直接映射供应商净利润。库存安装基础应与活跃设备、可升级比例、付费转化一起验证，不能只看手机出货。"}, {"id": "20720409", "author": "京城Z先生", "date": "2024-04-24", "title": "特斯拉 Q1 财报解读：马斯克新画的饼，到底能不能吃？", "chars": 1918, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/20720409", "path": "library/20720409.html", "classification": "平台长文；原创性未逐篇认证", "core": "具体来看，特斯拉第一季度总营收为 213.01 亿美元，同比下降 9%，其中汽车业务的营收为 173.78 亿美元，同比下滑 13%；毛利润为 36.96 亿美元，同比下滑 18%； 毛利率 为 17.4%，低于去年第四季度（17.6%）和去年同期（19.3%）。", "lesson": "将产品里程碑、监管、商业化与估值分别核验，避免用远景替代当前兑现。"}, {"id": "20705100", "author": "SpaceM", "date": "2024-04-24", "title": "特斯拉 2024 年第一季度财报电话问答记录", "chars": 55307, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/20705100", "path": "library/20705100.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "就此而言，我们确实认为我们将在自然工厂本身进行有限的生产，在今年年底之前完成有用的任务。 然后我认为我们可能会在明年年底之前将其出售给外部。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "20646234", "author": "京城Z先生", "date": "2024-04-21", "title": "本周实盘-20240421：纳指与大饼，崩盘还是倒车接人？", "chars": 2765, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/20646234", "path": "library/20646234.html", "classification": "平台长文；原创性未逐篇认证", "core": "持仓： 苹果 15.2%，微软 13.8%，巴西石油 24.8%，谷歌 4.5%，TLT 22.0%，TMF 2.4%，大饼 ETF 15.9%，爱马仕 adr 1.4%，现金/其他 0%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "20641968", "author": "SpaceM", "date": "2024-04-21", "title": "特斯拉最大力度的战略调整（from Chris zheng）", "chars": 2093, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/20641968", "path": "library/20641968.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "这就是那个著名会议，在 2021 年 8 月第一次召开，特斯拉核心管理层都在，当时 Elon 的态度是不想再做一个低于 Model 3 的智能电动车（暂且称之为 Model 2，但特斯拉已经声明过不会叫这个名字），要做 Robotaxi。 因为 Robotaxi 是一个 To B 的产品，Model 2 是一个 To C 的产品，这里有本质的不同。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "20617544", "author": "輸棟樓的韭菜", "date": "2024-04-19", "title": "拥抱风险，把玩风险：微软与特斯拉", "chars": 2526, "read": true, "has_note": true, "themes": ["TSLA", "MSFT"], "source": "https://longbridge.cn/zh-CN/topics/20617544", "path": "library/20617544.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "细想原因，应该是特斯拉的成功，在 10 年前更有不确定性，投资特斯拉风险远大于 10 年前的微软，体感上也动不动就是 3 倍机会，5 倍机会。", "lesson": "合并同因子暴露并记录风险预算；单股计划可能被组合流动性和回撤迫使改变。"}, {"id": "20590607", "author": "晓风 morning_wind", "date": "2024-04-18", "title": "写在理想汽车 L6 发布前", "chars": 1300, "read": true, "has_note": true, "themes": ["2015", "LI"], "source": "https://longbridge.cn/zh-CN/topics/20590607", "path": "library/20590607.html", "classification": "平台长文；原创性未逐篇认证", "core": "对于行业来说：集中度可能不及预期；持续的差异化很难；品牌建设时间长； 车子的多元化需求是客观存在的；一款车，一个类型的产品定位车，力有不逮； 理想说家庭用车做深了，可以堪比苹果的营收，这背后假设了集中度在品牌上的集中。", "lesson": "把实际结果、市场预期和估值分别记录；好财报并不自动等于好买点。"}, {"id": "20575597", "author": "晓风 morning_wind", "date": "2024-04-17", "title": "来 AI 下游尝试淘点金", "chars": 664, "read": true, "has_note": true, "themes": ["TSLA", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/20575597", "path": "library/20575597.html", "classification": "平台长文；原创性未逐篇认证", "core": "其他还涉及一些费率，头部持仓之类的调研，细节不表，总的来说我个人比较偏好第一个和第三个，准备买一点观察下。", "lesson": "区分研究结论与仓位决定，记录加减仓的新证据、预算和失效条件。"}, {"id": "20518274", "author": "京城Z先生", "date": "2024-04-14", "title": "本周实盘-20240414：伊朗开大，能源和黄金行情会凉吗？", "chars": 2353, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/20518274", "path": "library/20518274.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 16.1%，微软 14.4%，巴西石油 24.0%，谷歌 4.5%，TLT 22.1%，TMF 2.4%，大饼 ETF 16.4%，现金/其他 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "20403405", "author": "京城Z先生", "date": "2024-04-07", "title": "本周实盘-20240407（美股篇）：非农超预期，6 月降息也不稳了？", "chars": 2840, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG", "AAPL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/20403405", "path": "library/20403405.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 卖出 8.4% 的 TLT，买入等量的大饼 ETF（BITB） 持仓： 苹果 15.5%，微软 14.6%，巴西石油 23.9%，谷歌 4.4%，TLT 22.5%，TMF 2.5%，大饼 ETF 16.6%，现金/其他 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "20348185", "author": "輸棟樓的韭菜", "date": "2024-04-03", "title": "重新评价微软：管理层策略变化与叙事过度", "chars": 2235, "read": true, "has_note": true, "themes": ["MSFT", "GOOGL", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/20348185", "path": "library/20348185.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "作者回顾2020因旧微软印象而不看好，后来认识到纳德拉从排他硬件转向跨平台服务、订阅和云。他将认输合作能力作为企业质量判断，认为比单季财报更重要，主要风险在反垄断及接班。", "lesson": "有价值的是识别公司行为变化，克服过期标签；薄弱处是把组织能力集中归功个人，并因信任管理层淡化价格与季度证据。帖中将2019年10亿美元投资写为取得OpenAI49%，还包含盖茨反对等故事，公开官方资料不足以支持这些细节。"}, {"id": "20130908", "author": "輸棟樓的韭菜", "date": "2024-03-25", "title": "特斯拉不到170仍不急买：估值与趋势两套条件", "chars": 822, "read": true, "featured": true, "featured_reason": "估值与时机｜认为特斯拉跌至较低价格值得研究，却区分长期分批和趋势交易的不同入场条件。", "has_note": true, "themes": ["TSLA", "LI", "2015"], "source": "https://longbridge.cn/zh-CN/topics/20130908", "path": "library/20130908.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "2024-03认为TSLA低于170偏低估，软件/机器人提供高于汽车公司的潜力，但订单、产量、财报和价格趋势仍弱。长线可分注，趋势交易者宜等财报前后；借别人持仓不能推断该当下大买。", "lesson": "价值便宜是必要研究条件，未必是入场触发。要为长期分批和趋势交易分别设置资金期限与止损逻辑。文章对自动驾驶/机器人成功概率和TSLA汽车业务70上限没有完整估值模型；所谓裴洛西3%持仓未核实，不能跟单。"}, {"id": "20112191", "author": "京城Z先生", "date": "2024-03-24", "title": "本周实盘-20240324（美股篇）：买入大饼 ETF，加仓 TLT", "chars": 2171, "read": true, "has_note": true, "themes": ["AAPL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/20112191", "path": "library/20112191.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 以均价 161.53 买入大饼 ETF（BITB），占总仓位的 7.8% 以均价 92.95 加仓 TLT，占总仓位的 8.4% 以均价 14.72 加仓 巴西石油，占总仓位的 5.3% 持仓： 苹果 15.8%，微软 14.7%，巴西石油 22.9%，谷歌 4.3%，TLT 31.7%，TMF 2.8%，大饼 ETF 7.8%，现金/其他 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "20072641", "author": "京城Z先生", "date": "2024-03-22", "title": "中国海洋石油 2023 年报：短线看空，长线看多（更新买卖点）", "chars": 1362, "read": true, "has_note": true, "themes": ["股息预期", "资源估值", "继续持有不等于加仓", "模型口径", "80883", "883", "600938", "CEO"], "source": "https://longbridge.cn/zh-CN/topics/20072641", "path": "library/20072641.html", "classification": "原创财报分析，含公告及媒体信息转述", "core": "作者认为年报经营积极，市场短线却可能因分红低于收息者预期而跌；自己更看海油资源、增储上产和油价。引用市值8466.88亿港元与所谓现金流贴现值9582亿港元比0.88，判断已持可拿、新钱性价比一般；将0.5与1.2分别对应约10.1和24.2港元个人买卖点。", "lesson": "可学把不同投资者的回报来源分开：有人为派息买，有人为储量和未来产量买。比较价值时要把价格、储量、成本、开发时间及折现假设重算，不能因公司经营稳健就否定股息预期变化对股价的作用。"}, {"id": "20044495", "author": "京城Z先生", "date": "2024-03-21", "title": "腾讯财报 2023Q4：惊喜不够，回购来凑", "chars": 2594, "read": true, "has_note": true, "themes": ["TCEHY", "700", "80700", "TCTZF"], "source": "https://longbridge.cn/zh-CN/topics/20044495", "path": "library/20044495.html", "classification": "平台长文；原创性未逐篇认证", "core": "至于股价一直震荡横盘，更多的是其他原因所致： 1、港股熊市，交易量过低 2、元梦之星（暂时）没打过蛋仔派对 3、业务增速下滑，影响资本对其的估值 4、混元大模型（暂时）拿不出手 1 属于不可抗力，无法评估；2 属于起步晚，明年再看，有弯道超车的可能；3 主要得靠出海，今年有增长明年有希望；4 我认为基于我国法律法规，国内版本的 AI 大模型都有困难，除非学字节开发个中国人禁止访问版本。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "12040131", "author": "京城Z先生", "date": "2024-03-11", "title": "巴西石油 2023Q4 财报简析（附：更新 2024 年买点/卖点）", "chars": 1257, "read": true, "has_note": true, "themes": ["PBR.A", "PBR", "80883", "883", "600938", "CEO"], "source": "https://longbridge.cn/zh-CN/topics/12040131", "path": "library/12040131.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者认为股价大跌源于特别分红变化和新能源投资，而非当季经营明显恶化；仍接受治理折价。他估算储量贴现值1463.1、市值942.3，比值0.64，相较上年反而更贵。按个人0.5/1.2倍规则推11.3/27美元买卖区间，14.3时低仓可配、高仓不追。", "lesson": "重要思想是股价跌不等于更便宜：价值分母下调可能超过价格下调。这里贴现指标口径、币种折算及债务处理不完整；不能把11.3/27当经验证估值，也不能把特别股息减少简单说成原来低估已充分覆盖。"}, {"id": "12028811", "author": "京城Z先生", "date": "2024-03-10", "title": "本周实盘-20240310：这几只股票跌出了机会，但你敢下手吗？", "chars": 2786, "read": true, "has_note": true, "themes": ["NVDA", "AAPL", "TSLA", "GOOGL", "DGE", "DEO", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/12028811", "path": "library/12028811.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 以均价 169.52 买入约 2.9% 的苹果 持仓： 苹果 15.6%，微软 13.9%，巴西石油 17.8%，帝亚吉欧 11.9%，强生 9.1%，谷歌 3.9%，TLT 23.6%，TMF 3.0%，现金/其他 1.0%。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "11868730", "author": "晓风 morning_wind", "date": "2024-03-02", "title": "2024 美股持仓复盘（20240301）", "chars": 465, "read": true, "has_note": true, "themes": ["LI", "2015", "TSLA", "AMD", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/11868730", "path": "library/11868730.html", "classification": "平台长文；原创性未逐篇认证", "core": "XBI 比较神，上蹿下跳幅度很厉害，但是重心缓慢上升的，完全不 care 加息放缓，有点出乎预料。", "lesson": "比较产品进展、云与广告兑现、资本开支和估值，明确什么新证据会改变排序。"}, {"id": "11872722", "author": "京城Z先生", "date": "2024-03-02", "title": "本周实盘-20240302：恐高不跟，反被精准狙击", "chars": 1775, "read": true, "has_note": true, "themes": ["替代风险", "安全边际", "路径依赖", "MSFT", "NVDA", "GOOGL", "GOOG", "DGE", "DEO", "600662", "JNJ"], "source": "https://longbridge.cn/zh-CN/topics/11872722", "path": "library/11872722.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "3月初作者未交易，自述当年收益0.87%，落后标普7.7%。仓位中TLT约22.93%、TMF2.8%、巴油19.7%，因认为科技贵而等待；实际却同时遇到降息预期下调、巴油新能源投资担忧和谷歌AI产品争议。谷歌约4%是错过NVDA大涨后的较便宜替代，但因潜在掉队风险暂不加仓。文章以安全边际接受巴油变化，却也暴露对自己熟悉的便宜资产更愿意宽容。", "lesson": "不买高估科技可以合理，替代仓却仍需单独压力测试；利率、治理和技术落后都不是便宜自动覆盖的风险。与过去一年随后翻盘的经历类比不产生本年胜率。TLT和TMF应合并久期暴露，后者杠杆不能按普通股票比例理解。"}, {"id": "11748035", "author": "京城Z先生", "date": "2024-02-25", "title": "本周实盘-20240225：你不在餐桌上 就会在菜单上", "chars": 2202, "read": true, "has_note": true, "themes": ["NVDA", "MSFT", "GOOG", "GOOGL", "HD", "DGE", "DEO"], "source": "https://longbridge.cn/zh-CN/topics/11748035", "path": "library/11748035.html", "classification": "平台长文；原创性未逐篇认证", "core": "暂时只加了 4% 的仓位，只有其竞品微软 14% 的零头，可见我对谷歌的信心并不那么足，但 Gemini 能后起追上的概率并不低，且目前谷歌在我估值表里是为数不多涨了一年还处于低位的，索性先买上，后面看情况是慢慢加仓，还是哪天英伟达来一波超跌，直接等量替换过去。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "11716411", "author": "輸棟樓的韭菜", "date": "2024-02-23", "title": "我是如何做空特斯拉的", "chars": 912, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/11716411", "path": "library/11716411.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "只是因为爱之深比较熟悉，所以现阶段（至少半年内）深切了解到特斯拉不具备向上冲的业绩能力； 2. 我不是美股空头，我主仓是微软，但是近期人工智能不确定的情况下，我要找一个跟人工智能搭得上关系，但基本面又偏弱的标的对冲来缓解微软的风险，特斯拉无疑是最好的选择； 3. 我主要是日内做空来对冲，因为特斯拉的不确定性，除非有预先的判断的隔夜利淡，不然任何一条推特都可能成为这个教徒云集股票的狂欢爆点，风险过大了。", "lesson": "将产品、监管、商业化、销量和估值分别验证，远景不能替代当前兑现。"}, {"id": "11695305", "author": "京城Z先生", "date": "2024-02-22", "title": "交出满分答卷的英伟达，现在还能买吗？", "chars": 1385, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/11695305", "path": "library/11695305.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者把上一季221亿美元收入、122.85亿净利润对应净利率代入下一季240亿指引，再按四季不增长年化，得531亿利润，以1.69万亿市值除得约31.8倍，解释历史高PE可由增长消化。他主张可分批参与但NVDA不超20%，并预期未来增速下降。", "lesson": "可学习逐步写出“收入×净利率×季度”的桥梁，让估值可反驳；但指引不是全年承诺，沿用净利率与无增长假设也不自动保守，出口限制、产品转换和CapEx周期都可能破坏它。作者20—30%增速仅为预测。"}, {"id": "11665261", "author": "晓风 morning_wind", "date": "2024-02-21", "title": "谈谈 Groq 与昨晚半导体的波动", "chars": 1404, "read": true, "has_note": true, "themes": ["NVDA", "AMD", "GOOGL", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/11665261", "path": "library/11665261.html", "classification": "平台长文；原创性未逐篇认证", "core": "GP-GPU，一路走过来，先抗 CPU，然后遇到 ASIC、还有一众云厂商定制的芯片，比如最早的 Google TPU，AWS 推理芯片 Inferentia 和训练芯片 Trainium，还有最新 MSFT 甚至 OpenAI 的自研芯片，能做到现在这个程度，产品力是毫无质疑的多边形战士（供货能力、性能、能耗、价格、软件生态、可靠性、灵活性）。", "lesson": "按产品、客户、架构和利润持续时间拆解；多只芯片股仍可能依赖同一资本开支周期。"}, {"id": "11631258", "author": "京城Z先生", "date": "2024-02-19", "title": "爱马仕 2023 年报解读：奢侈品天花板，皮制的黄金", "chars": 3285, "read": true, "has_note": true, "themes": ["定价权", "现金转化", "质量与价格", "不交易", "HESAY", "600519"], "source": "https://longbridge.cn/zh-CN/topics/11631258", "path": "library/11631258.html", "classification": "原创财报分析，含公告及媒体信息转述", "core": "以全球高净值受众、品牌忠诚、分销控制、皮具产能扩张及品类延伸解释爱马仕持续增长；引用2023年收入134.27亿欧元、营业利润率42.1%、净利润43.11亿欧元、经营现金流51.23亿和调整自由现金流31.92亿。结尾自述虽长期关注，但当时PE69、同业LV约25，认为过贵，未买入。", "lesson": "推理链是客户价格敏感度低→品牌/渠道维持议价权→毛利和现金转化支撑质量→再检验买价是否先收走未来增长。研究补足：比较固定与实际汇率、现金流扣除再投资及估值收缩敏感性，而不是只用同业PE机械排名。"}, {"id": "11637118", "author": "晓风 morning_wind", "date": "2024-02-19", "title": "美股持仓复盘（20240219）", "chars": 1373, "read": true, "has_note": true, "themes": ["PDD", "LI", "2015", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/11637118", "path": "library/11637118.html", "classification": "平台长文；原创性未逐篇认证", "core": "医药股 ： $标普生物技术 ETF - SPDR(XBI.US) 略微减持了一些，一方面为了挪仓位，另外一方面既然降息不可避免要到下半年了，那就减持一点，择机搞 Labu 补回来吧。", "lesson": "区分研究结论与仓位决定，记录加减仓的新证据、预算和失效条件。"}, {"id": "11619015", "author": "SpaceM", "date": "2024-02-18", "title": "OpenAI  Confirms TESLA'S Thesis!", "chars": 1473, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/11619015", "path": "library/11619015.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "核心一句话总结，Sora 的技术佐证了 FSD 的方向，且特斯拉领先了一年，特斯拉确实是一家 AI 公司。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "11612679", "author": "京城Z先生", "date": "2024-02-17", "title": "本周实盘-20240217：改变世界的，和世界改变不了的", "chars": 3215, "read": true, "has_note": true, "themes": ["DGE", "DEO", "X", "HD"], "source": "https://longbridge.cn/zh-CN/topics/11612679", "path": "library/11612679.html", "classification": "平台长文；原创性未逐篇认证", "core": "2024-02披露科技仅苹果微软合计约27%，巴西石油20.8%、TLT23.3%、TMF2.7%；卖掉YINN后转TMF，称小仓、无其他好标的、高胜率才用杠杆。对Google虽估值表便宜仍不买，担忧OpenAI竞争；对微软和苹果保持高技术信心。", "lesson": "这是从均衡持有转宏观轮动的早期证据。少科技不自动少风险：长债与TMF共享久期，20%巴油增加商品/政治/分红风险。作者把降息看成必然回归，未给长期收益率或时间路径证伪；而Google“表内便宜仍等”说明主观竞争判断会覆盖估值表，表不是机械指令。Sora商业化容易等内容只能作为当时判断。"}, {"id": "11540703", "author": "京城Z先生", "date": "2024-02-08", "title": "阿里巴巴季报解读：首席财务官与首席执行官的发言，信息量很大", "chars": 3415, "read": true, "has_note": true, "themes": ["89988", "9988", "BABA", "PDD"], "source": "https://longbridge.cn/zh-CN/topics/11540703", "path": "library/11540703.html", "classification": "平台长文；原创性未逐篇认证", "core": "财报开篇，是两段重要发言，和后面的数据相比，我认为这两段对阿里巴巴未来的定调更有意义： 1、阿里巴巴集团首席执行官吴泳铭说：「在战略聚焦之下，我们收获了一个稳健的季度。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "11476149", "author": "京城Z先生", "date": "2024-02-04", "title": "本周实盘-20240204：巨头交答卷，越涨越便宜，越跌越贵，加仓 TLT", "chars": 2282, "read": true, "has_note": true, "themes": ["600662", "JNJ", "HD"], "source": "https://longbridge.cn/zh-CN/topics/11476149", "path": "library/11476149.html", "classification": "平台长文；原创性未逐篇认证", "core": "说完了交易，聊聊近期的明星股财报，先做个增速小结： Me­ta $23andMe(ME.US) ­TA: +25% Mi­c­r­o­s­o­ft $摩根士丹利(MS.US) ­FT: +18% Am­a­z­on $Antero Midstream(AM.US) ­ZN: +14% Go­o­g­le $Grocery Outlet(GO.US) ­O­GL: +13% Ne­t­f­l­ix $NF­LX: +12% AMD $Antero Midstream(AM.US) D: +10% S&P 500 $S", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "11452854", "author": "京城Z先生", "date": "2024-02-02", "title": "苹果 Q1 财报解读：亮点不够创新来凑，中华区显疲态净利润仍大涨", "chars": 2544, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/11452854", "path": "library/11452854.html", "classification": "平台长文；原创性未逐篇认证", "core": "不是说一定会跌，但是确实涨起来费劲，可想象的未来，需要出现至少一项以下利好来继续拉升： 1、不管是自己解决创新还是中华区经济回暖，总之销量进一步上升，带动利润大幅增长； 2、蹭了 AI 概念两年，真的交付出某种比较像样的产品了，而不是只有 Siri 这种非常基础的应用； 3、库克接班人公布，且该人令市场极度振奋，给未来的苹果打满了预期。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "11436193", "author": "晓风 morning_wind", "date": "2024-02-01", "title": "1 月份 AI+ 半导体重要个股回顾", "chars": 1240, "read": true, "has_note": true, "themes": ["AMD", "QCOM", "MSFT", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/11436193", "path": "library/11436193.html", "classification": "平台长文；原创性未逐篇认证", "core": "AI 业务给云业务带来了实质的增速（包括 Google 也是），其中我认为非常关键的一个数据： 微软 AI 的推理收入，对 Azure 贡献了 6 个百分点的增长，作为对比上个 Q 是 3 个百分点的增长，OpenAI 客户 数 53K vs 上 Q18K，三倍的变化 。", "lesson": "比较产品进展、云与广告兑现、资本开支和估值，明确什么新证据会改变排序。"}, {"id": "11375019", "author": "京城Z先生", "date": "2024-01-28", "title": "本周实盘-20240128：特斯拉遭暴击，下周美股迎大考", "chars": 1781, "read": true, "has_note": true, "themes": ["TSLA", "AAPL", "600662", "JNJ", "HD"], "source": "https://longbridge.cn/zh-CN/topics/11375019", "path": "library/11375019.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 14.8%↓，微软 14.4%↑，巴西石油 18.0%↑，帝亚吉欧 12.0%↑，强生 9.5%↓，家得宝 4.2%↓，TLT 17.8%↓，YINN2.0% 上，现金/其他 6.5%↓。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "11366478", "author": "晓风 morning_wind", "date": "2024-01-27", "title": "美股持仓复盘（20240127）", "chars": 831, "read": true, "has_note": true, "themes": ["TSLA", "INTC", "LI", "AMD", "PDD"], "source": "https://longbridge.cn/zh-CN/topics/11366478", "path": "library/11366478.html", "classification": "平台长文；原创性未逐篇认证", "core": "盘前， - LongPort (longportapp.cn) 基本清空了 $标普生物技术 3 倍做多 - Direxion(LABU.US) $半导体 3 倍做多 - Direxion(SOXL.US) 。", "lesson": "区分研究结论与仓位决定，记录加减仓的新证据、预算和失效条件。"}, {"id": "11352367", "author": "SpaceM", "date": "2024-01-26", "title": "特斯拉的 App Store 时刻", "chars": 691, "read": true, "has_note": true, "themes": ["81211", "1211", "002594", "BYDDF", "TSLA", "BYDDY"], "source": "https://longbridge.cn/zh-CN/topics/11352367", "path": "library/11352367.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "4.还有人认为特斯拉在 FSD 方面已不再占优势，这与之前对其电池技术创新的低估相似。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "11343352", "author": "SpaceM", "date": "2024-01-25", "title": "2024 年 AI 元年，特斯拉身处增长浪潮交替之间，还值得投资不？", "chars": 1175, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/11343352", "path": "library/11343352.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "看完财报听完电话会，一个核心结论（特别主观）：特斯拉 2024 年的产销车量预期已经打满了，24 年讲的不是卖车的故事，工厂和人力资源要更多投入到 REDWOOD 项目中更便宜的车型当中。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "11303440", "author": "SpaceM", "date": "2024-01-23", "title": "FSD V12 ，Elon 财报会上要重点吹的", "chars": 1828, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/11303440", "path": "library/11303440.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "以下是视频的关键信息点： 1:36 — 先聊了聊自动速度偏移，FSD 可以根据环境和路况和驾驶员设置自动调节自己认为最自然的速度 2:40 — 语音设置目的地 2:50 — 开了 FSD 但车没动，因为后面有车经过 3:10 — 车还是没走，这时候出现了个行人，但也不知道是不是 FSD 看到的，行人经过后车启动了 3:40 — 在没有红绿的十字路口等对面车辆转弯后完成左转 3:50 — 他觉得 V12 版本改善了很多之前的版本开得很猛、不像人的开法，舒适度更好 4:40 — 左转的同时对方车也左转，他说之前的版本碰到这个情况会停在这里 5:40 — 这里", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "11259127", "author": "京城Z先生", "date": "2024-01-21", "title": "本周实盘-20240121（美股篇）：AI 窜天，电动车坠地，迎接财报季", "chars": 1986, "read": true, "has_note": true, "themes": ["600662", "JNJ", "HD"], "source": "https://longbridge.cn/zh-CN/topics/11259127", "path": "library/11259127.html", "classification": "平台长文；原创性未逐篇认证", "core": "持仓： 苹果 15.0%↑，微软 14.4%↑，巴西石油 17.2%↓，帝亚吉欧 11.7%↓，强生 9.8%↑，家得宝 4.4%↑，TLT 18.2%↓，YINN1.8% 现金/其他 7.5%↓。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "11240294", "author": "晓风 morning_wind", "date": "2024-01-20", "title": "美股持仓复盘（20240120）", "chars": 476, "read": true, "has_note": true, "themes": ["700", "TCEHY", "80700", "TCTZF"], "source": "https://longbridge.cn/zh-CN/topics/11240294", "path": "library/11240294.html", "classification": "平台长文；原创性未逐篇认证", "core": "逻辑也说过： https://longportapp.cn/zh-CN/topics/11220367 券商：主要是富途，情绪上和中概强关联，但是实际上我觉得更多是情绪面 降息预期的时候，市场担心降息影响收入中占比较高的利息部分，对降息的另外一面牛市带来的交易景气度是否属于更大利好不予讨论。", "lesson": "区分研究结论与仓位决定，记录加减仓的新证据、预算和失效条件。"}, {"id": "11222827", "author": "晓风 morning_wind", "date": "2024-01-19", "title": "从台积电 Q4 财报看 AMD 和高通后市表现", "chars": 982, "read": true, "has_note": true, "themes": ["QCOM", "AMD", "TSM"], "source": "https://longbridge.cn/zh-CN/topics/11222827", "path": "library/11222827.html", "classification": "平台长文；原创性未逐篇认证", "core": "台积电财报出来后，昨晚盘前我在微信群里提了一嘴：“ 台积电这个财报要整个送半导体往上一节子了 ” 开盘后，SOXL 直接飙升；具体到个股里面，我同时持有的 AMD 和 QCOM 表现有一些细微的差别： AMD 高开低走，收涨；NVDA 也是类似 相对来做说 QCOM 情绪更为稳定；AAPL 也类似 当然一天的盘中走势不能反映什么，各家股票的 price in 情况、基本面也不完全一样， 单就这个日内走势差异来说，你说 AMD 涨多了，QCOM 之前涨得少所以稍微多涨一点，这个说法完全站得住脚。", "lesson": "按产品、客户、架构和利润持续时间拆解；多只芯片股仍可能依赖同一资本开支周期。"}, {"id": "11166532", "author": "晓风 morning_wind", "date": "2024-01-17", "title": "给理想汽车股东按个摩", "chars": 1966, "read": true, "has_note": true, "themes": ["LI"], "source": "https://longbridge.cn/zh-CN/topics/11166532", "path": "library/11166532.html", "classification": "平台长文；原创性未逐篇认证", "core": "写在最后： 仓位决定心态 ；如果仓位占比不多，下跌带来的不是恐慌而是兴奋；大盘恐慌下，泥沙俱下，搁正常你哪来机会买便宜货来着。", "lesson": "区分研究结论与仓位决定，记录加减仓的新证据、预算和失效条件。"}, {"id": "11112543", "author": "京城Z先生", "date": "2024-01-15", "title": "不敢投拼多多的原因", "chars": 433, "read": true, "has_note": true, "themes": ["PDD"], "source": "https://longbridge.cn/zh-CN/topics/11112543", "path": "library/11112543.html", "classification": "平台长文；原创性未逐篇认证", "core": "目前 Temu 还不够大，什么时候让亚马逊觉得地位受到威胁了，就一定会触发资本主义铁拳，这是一个巨大的潜在风险，所以拼多多目前的策略，只能在海外偷偷打枪，一旦都被搬上明面上，被那边的诉棍直接把商业模式摧毁不是没可能。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "11088844", "author": "京城Z先生", "date": "2024-01-13", "title": "本周实盘-20240113（美股篇）：比特币 ETF 招安，微软反超苹果成美股老大", "chars": 2061, "read": true, "has_note": true, "themes": ["DGE", "DEO", "AAPL", "MSFT"], "source": "https://longbridge.cn/zh-CN/topics/11088844", "path": "library/11088844.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 14.5%↑，微软 14.0%↑，巴西石油 17.6%↓，帝亚吉欧 12.0%↑，强生 9.7%↑，家得宝 4.3%↑，TLT 18.7%↑，现金/其他 8.4%↓。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "10941325", "author": "京城Z先生", "date": "2024-01-06", "title": "本周实盘-20240106（美股篇）：利空！苹果遭降级，降息预期受阻", "chars": 1943, "read": true, "has_note": true, "themes": ["相对估值", "行业内替换", "盈利消化估值", "TSLA", "MSFT", "DEO", "HD", "JNJ", "600938", "OXY", "AAPL", "883"], "source": "https://longbridge.cn/zh-CN/topics/10941325", "path": "library/10941325.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "2024年首周，作者清仓西方石油，以自述均价15.71美元分两次买巴西石油，期末仓位17.8%，同时AH配置中海油。他称比较后巴油性价比高于中海油、再高于西方石油，保留能源方向却替换载体。对苹果和微软，他认为价格已高，先等下季盈利消化估值；对降息交易，则承认TLT短期预期过热、可能进入震荡。股票选择与行业判断在这篇被清楚分成两层。", "lesson": "同一主线可换更便宜载体，但比较不能只有PE和股息，还要计治理、税、币种、投资需求与分红可持续性。后来巴油非主业投资担忧说明高股息并非无条件安全；本文未给完整估值表参数，不能独立验证三家公司排序。"}, {"id": "10880749", "author": "京城Z先生", "date": "2024-01-03", "title": "拿巴菲特 20 年前的答案抄作业：买入巴西石油、中国海油背后的逻辑", "chars": 2494, "read": true, "has_note": true, "themes": ["OXY", "883", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/10880749", "path": "library/10880749.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者借巴菲特中石油投资，比较OXY、PBR和中海油的市值/储量相关贴现现金流、PE、PB，并把油价方向列为另一条件。认为PBR最便宜但治理历史应折价，中海油H比A便宜40%以上；最终买A含未展开的外部约束，说明可投性会影响最优选择。", "lesson": "有价值的是先确定行业，再横比资产、价格、政策约束，不照搬大师股票代码。但储量标准化贴现现金流不等于股权公允价值，不能直接将0.5/1.2当普适买卖线，须调整债务、资本开支、油价和税制。"}, {"id": "10798255", "author": "京城Z先生", "date": "2023-12-30", "title": "2023 年终复盘（美股篇）：价投践行者，选择对了赛道，努力才有意义", "chars": 1709, "read": true, "has_note": true, "themes": ["700", "TSLA", "JNJ", "600662", "HD"], "source": "https://longbridge.cn/zh-CN/topics/10798255", "path": "library/10798255.html", "classification": "平台长文；原创性未逐篇认证", "core": "2023年终作者自述美股净值收益25.89%，解释若按另一方法可算43.14%，因此坚持将现金及出入金纳入净值连续统计。配置5—10股、最大苹果约15%，以DEO不到10%与AH腾讯约40%的冲击对照；执行高估减、低估补，年末现金15%多、TLT18%。", "lesson": "最可学是把闲置现金算进组合收益，并承认低波动分散会跑输热门科技。收益是自述，图片未审计，不能称已验证超额。TLT虽可交易却不等同无损现金，利率上升时抄底资金会缩水。买优质不买贵最多输时间仍过度确定，长期基本面也可能变化。"}, {"id": "10782489", "author": "京城Z先生", "date": "2023-12-29", "title": "2023 年终复盘（AH 篇）：虽然比别人更抗揍，但终归是挨了揍", "chars": 1591, "read": true, "has_note": true, "themes": ["组合相关性", "跨账户", "候选池调整", "700", "002027", "80700", "600519"], "source": "https://longbridge.cn/zh-CN/topics/10782489", "path": "library/10782489.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "作者自述2023年AH合并收益1.46%、年内未入金，原有茅台、分众、腾讯三只一直持有，分红与其他现金主要补分众。腾讯年底受政策消息冲击后，他承认只持三只过于集中，计划调整2024配置：消费候选股间有共同周期，删去部分中端消费；新增中海油；以标普信息科技LOF及纳指ETF扩展美国资产。与此同时，他明确人民币账户不加新钱，而用现有资产动态平衡。", "lesson": "这是明确承认行业相关性并改变研究池的证据，不仅是多买几只。执行时仍须合并美元账户，避免AH买美国ETF后与原美股再次重叠；跨境基金另有汇率、溢价和费用，不能把换上市地自动当作全部风险已分散。"}, {"id": "10679351", "author": "晓风 morning_wind", "date": "2023-12-26", "title": "2024 年投资展望", "chars": 1084, "read": true, "has_note": true, "themes": ["PDD", "BABA", "TSLA", "LI", "QCOM", "AMD", "MSFT", "NVDA", "FUTU", "HOOD", "TAL", "1797"], "source": "https://longbridge.cn/zh-CN/topics/10679351", "path": "library/10679351.html", "classification": "平台长文；原创性未逐篇认证", "core": "$英伟达(NVDA.US) 1%, 观察仓 $半导体 3 倍做多 - Direxion(SOXL.US) 1% 观察仓 AI 今年已经大涨了，24 年预期低一些，期望 20% 医药 $标普生物技术 ETF - SPDR(XBI.US) 10% $标普生物技术 3 倍做多 - Direxion(LABU.US) 1% 3xLABU 随时撤掉， 降息周期即将开启，辉瑞这样专利权益储备不足的大药厂会加紧赶在小公司涨起来之前加速收购，客观上会助推 xbi 小公司跑赢整体医药板块。", "lesson": "行业空间不能替代临床、融资与期限风险；杠杆ETF还需处理每日复位和波动损耗。"}, {"id": "10609167", "author": "京城Z先生", "date": "2023-12-23", "title": "本周实盘-20231223（美股篇）：TLT 触及第一压力位，能源股开花结果", "chars": 2268, "read": true, "has_note": true, "themes": ["OXY", "HD"], "source": "https://longbridge.cn/zh-CN/topics/10609167", "path": "library/10609167.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 15.0%↓，微软 13.4%↑，西方石油 11.6%↑，帝亚吉欧 12.1%↓，强生 4.6%↑，家得宝 12.5%↑，TLT 18.8%↓，现金/其他 11.3%↓。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "10598893", "author": "京城Z先生", "date": "2023-12-22", "title": "铁拳打不倒腾讯，但可以把投资人都打跑", "chars": 924, "read": true, "has_note": true, "themes": ["TCEHY", "700"], "source": "https://longbridge.cn/zh-CN/topics/10598893", "path": "library/10598893.html", "classification": "平台长文；原创性未逐篇认证", "core": "很多人的周末应该不太好过了： “第十八条【限制游戏过度使用和高额消费】网络游戏不得设置每日登录、首次充值、连续充值等诱导性奖励。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "10586630", "author": "京城Z先生", "date": "2023-12-21", "title": "葛兰爆亏基民 234 亿？这个问题的根本原因，芒格早就指出了", "chars": 656, "read": true, "has_note": true, "themes": ["收益口径", "资金加权", "幸存者偏差"], "source": "https://longbridge.cn/zh-CN/topics/10586630", "path": "library/10586630.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "文章借明星基金吸引资金的现象说明：规模小时取得高收益、吸引大量后进资金后遭遇回撤，即使从成立日起展示的收益仍好看，多数投资者未必赚钱。作者要求同时披露考虑入金时间与规模的资金加权结果，不只宣传早期收益，并将葛兰相关亏损与管理费舆论作为例子。文中对单位净值法的称呼前后混杂，但意图是把管理人的产品轨迹与投资者实际投入得到的回报分开。", "lesson": "评价博主也应看全部资金何时进入、现金如何计算和回撤发生在哪个资金规模上。单位净值收益不能直接混称资金加权收益，后者通常需要完整现金流求解；文中转引的损失额及芒格话语未经本轮独立核验，不作事实背书。"}, {"id": "10571747", "author": "京城Z先生", "date": "2023-12-16", "title": "本周实盘-20231216（美股篇）：加仓西方石油，现金仓位降至 11.3%！", "chars": 2056, "read": true, "has_note": true, "themes": ["OXY", "JNJ", "600662", "HD", "DEO", "DGE"], "source": "https://longbridge.cn/zh-CN/topics/10571747", "path": "library/10571747.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 以均价 58.12 元加仓约 4.4% 的西方石油， $西方石油(OXY.US) 总仓位升至 11.2% 持仓： 苹果 15.3%↓，微软 13.3%↓，西方石油 11.2%↑，帝亚吉欧 12.1%↓，强生 4.6%↓，家得宝 12.7%↑，TLT 19.0%↑，现金/其他 11.3%↓。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10560740", "author": "京城Z先生", "date": "2023-12-13", "title": "段永平抄底=阿里巴巴稳了？抛开剂量谈毒性都是耍流氓", "chars": 605, "read": true, "has_note": true, "themes": ["BABA", "700", "AAPL", "89988", "TCEHY", "9988"], "source": "https://longbridge.cn/zh-CN/topics/10560740", "path": "library/10560740.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者借段永平交易说明：看到买入截图，却不知道总资产中的仓位、之后换仓时机和交易究竟是长持、博反弹还是行业再平衡，就无法复制策略。即便一位投资者分批只买总仓1%，跟随者几次就满仓，也已是完全不同的风险选择。", "lesson": "研究他人必须同时记录理由、比例和退出条件，不能把方向一致当作同一笔投资。文内段永平具体仓位及后续收益属于作者转述，未在本文提供完整记录；可学习缺失信息清单，不把故事当审计事实。"}, {"id": "10550531", "author": "京城Z先生", "date": "2023-12-09", "title": "本周实盘-20231202：高位美股无从下手，继续加仓 TLT", "chars": 1697, "read": true, "has_note": true, "themes": ["OXY"], "source": "https://longbridge.cn/zh-CN/topics/10550531", "path": "library/10550531.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 以均价 94.53 加仓 7.5% 的 TLT， $20 年期以上美国国债 ETF - iShares(TLT.US) 总仓位升至 18.6% 持仓： 苹果 15.6%↑，微软 13.8%↓，西方石油 6.2%↓，帝亚吉欧 12.2%↓，强生 4.7%↓，家得宝 12.0%↑，TLT 18.6%↑，现金/其他 15.7%↓。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "10541718", "author": "京城Z先生", "date": "2023-12-06", "title": "这 2 条重磅利空，到底对中国股市有多大影响？", "chars": 1298, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10541718", "path": "library/10541718.html", "classification": "平台长文；原创性未逐篇认证", "core": "简单分析上述新闻，可以得出如下结论： 第 1 条，是港股的达摩克里斯之剑，真利空。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "10533646", "author": "京城Z先生", "date": "2023-12-02", "title": "本周实盘-20231202（美股篇）：晒晒美股前 11 个月的收益，选择对了努力才有意义", "chars": 2158, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10533646", "path": "library/10533646.html", "classification": "平台长文；原创性未逐篇认证", "core": "2、openAI 宫斗剧大结局，原 CEO 王者归来 此事利好微软，拿到了一个类似 “观察者” 的权限，能有效实时掌控公司动态了，AI 是未来的主要斗兽场，openAI 要是被整黄了，微软的股价将会被去掉 “AI 附加值”，那可是蛮吓人的。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10531646", "author": "京城Z先生", "date": "2023-12-01", "title": "【晒单】2023 年还剩 1 个月，复盘下我的 AH 实盘前 11 个月的业绩", "chars": 1085, "read": true, "has_note": true, "themes": ["600519", "002027", "700", "83690", "80700", "MPNGY", "3690"], "source": "https://longbridge.cn/zh-CN/topics/10531646", "path": "library/10531646.html", "classification": "平台长文；原创性未逐篇认证", "core": "本年度我在 A 股 入金为 0 ，为数不多的几次交易，均为分红和新股卖出所得，具体交易如下： 3 月 27 日卖出美团 3 月 29 日卖出新股苏能股份 4 月 21 日卖出新股中船 4 月 21 日买入分众传媒 5 月 19 日买入分众传媒 5 月 25 日买入分众传媒 7 月 03 日买入分众传媒 茅台 12 月的特别分红不知道什么时候到账，不出意外还是继续买入分众传媒。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10522141", "author": "京城Z先生", "date": "2023-11-28", "title": "美团 2023 年 Q3 财报：数据不错为什么也跌？别忽视了 “场外因素”", "chars": 1728, "read": true, "has_note": true, "themes": ["利润归属", "监管成本", "商业模式", "3690", "MPNGY", "83690"], "source": "https://longbridge.cn/zh-CN/topics/10522141", "path": "library/10522141.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "作者列美团2023Q3营收约764.7亿元、净利润约35.9亿元，均高于文中所引市场预期，却认为股价仍可能承压。他回顾因腾讯分红收到美团股票后，于2023年3月27日按136.2港元全部卖出；理由不是预知后续跌幅，而是骑手福利、消费者费用及监管要求可能吞掉平台利润。他将这些称为场外因素，主张利润增速之外还要判断企业可保留的经济利益，因而不愿持有。", "lesson": "把劳动保障、佣金和竞争成本纳入长期利润率值得学，但认为公司不许赚太多、上限被锁死仍是作者推断。应建立福利支出和提价能力的情景测算，不能把所有下跌归结为政策，也不能由一次卖后下跌证明因果完整。"}, {"id": "10512673", "author": "京城Z先生", "date": "2023-11-25", "title": "本周实盘-20231125（美股篇）：清仓特斯拉，openAI 宫斗，巴菲特遗嘱", "chars": 3166, "read": true, "has_note": true, "themes": ["TSLA", "MSFT", "AAPL", "DGE", "BRK.A", "BRK.B", "603020", "DEO", "HD", "GOOG", "OpenAI", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/10512673", "path": "library/10512673.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 本周一开盘， 以均价 233.66 清仓特斯拉，总仓位从 5.9% 降至 0 卖出后，立刻进行如下调仓： 以均价 141.16 买入约 4% 的帝亚吉欧，总仓位升至 12.4% 以均价 307.01 买入约 1.8% 的家得宝，总仓位升至 11.5% 持仓： 特斯拉 0%↓，苹果 15.5%↓，微软 14.1%↑，西方石油 6.8%↓，帝亚吉欧 12.5% 上，强生 4.8%↑，家得宝 11.6%↑，TLT 10.6%↓，现金/其他 23.9%↓。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10506903", "author": "京城Z先生", "date": "2023-11-23", "title": "巴菲特安排遗嘱，伯克希尔还值得买吗？", "chars": 846, "read": true, "has_note": true, "themes": ["关键人物", "穿透持仓", "退出条件", "BRK.B", "BRK.A"], "source": "https://longbridge.cn/zh-CN/topics/10506903", "path": "library/10506903.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "作者回顾2023年8月清仓伯克希尔，给出三个理由：达到事前目标价、与自己重仓苹果重叠，以及巴菲特和芒格的健康与接班风险。他通常分段减仓，此次却全部退出，反映对关键人物的信任曾进入仓位大小。看到巴菲特安排捐赠和遗嘱后，他认为未来其他管理者交易会增加，因此仍认可企业，但不再愿意无压力重仓；若价格超跌，仍可分批买回。其重估对象既有价格，也有原先愿付的管理者溢价。", "lesson": "可学把基金或控股公司穿透到真实资产，避免表面不同代码的重复敞口。接班问题应检查制度与资本配置，而不能把安排遗嘱推断为突发健康问题；文中台积电交易出自弟子的猜测也未证实，卖出正确与否不能靠人物动机猜想证明。"}, {"id": "10499398", "author": "京城Z先生", "date": "2023-11-21", "title": "调仓！躲避风险，特斯拉 out，加码这两只低估股票", "chars": 934, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/10499398", "path": "library/10499398.html", "classification": "平台长文；原创性未逐篇认证", "core": "1、帝亚吉欧，已经买足仓位上限，暂时不会再加仓 2、爱马仕，设置条件单后快速反弹，又回到高估区域了 3、特斯拉，设置条件单后快速反弹，距离买点较远且有场外风险，弃 4、谷歌，唯一还有希望的，耐心等待 两周前我还以为，今年可能就这样了，提前收摊，没想到 11 月的尾巴，却突然迎来了一波交易小高潮，股市的乐趣，可能就源于此吧。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10493048", "author": "京城Z先生", "date": "2023-11-18", "title": "本周实盘-20231118（美股篇）：调仓，tlt 再加 5%！下周预计清仓特斯拉", "chars": 1599, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/10493048", "path": "library/10493048.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 以均价 88.8 买入 TLT，约占总仓位的 5% 持仓： 特斯拉 5.9% 上，苹果 15.6%↑，微软 13.9%↓，西方石油 6.9%↓，帝亚吉欧 8.9%↓，强生 4.7%↑，家得宝 9.7%↑，TLT 10.8%↑，现金/其他 23.6%↓。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10487637", "author": "京城Z先生", "date": "2023-11-16", "title": "永远不要爱上你的持仓股，爱情会使人亏钱", "chars": 795, "read": true, "has_note": true, "themes": ["MSFT", "BRK.A", "BRK.B"], "source": "https://longbridge.cn/zh-CN/topics/10487637", "path": "library/10487637.html", "classification": "平台长文；原创性未逐篇认证", "core": "像谈恋爱一样做投资，常见的结局就是自己越吹越信，越信越吹，然后到处找其他又吹又信的加强共识，最终走向 “饭圈”，将上市公司当作不容置疑的 “真主”，最终因无视风险盲目加仓，在某个时间套牢，然后自我洗脑说在价值投资。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10485336", "author": "京城Z先生", "date": "2023-11-15", "title": "腾讯 2023 年 Q3 解读：数据超预期，但惊喜不够足", "chars": 2518, "read": true, "has_note": true, "themes": ["700", "80700", "OpenAI", "TCEHY"], "source": "https://longbridge.cn/zh-CN/topics/10485336", "path": "library/10485336.html", "classification": "平台长文；原创性未逐篇认证", "core": "4、混元大模型：中性 在此时期的混元大模型，是给腾讯的未来做准备的，很像前两年 openAI 之余微软，能为企业带来额外的 “加分”，直到下一年的兑现期验收，如果和当初 openAI 一样赔本赚吆喝，怎么给的溢价就会怎么打回去。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "10469771", "author": "京城Z先生", "date": "2023-11-11", "title": "本周实盘-20231111（美股篇）：抄底帝亚吉欧，10 天前被嘲笑不可能的交易", "chars": 2315, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10469771", "path": "library/10469771.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 以均价 136.05 买入帝亚吉欧 ，占比约为当下总市值的 1.7% 持仓： 特斯拉 5.5%↓，苹果 15.5%↑，微软 14.2%↑，西方石油 7.1%↓，帝亚吉欧 9.1%↑，强生 4.7%↓，家得宝 9.3%↓，TLT 5.1%↑，现金/其他 26.7%↓。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10461947", "author": "京城Z先生", "date": "2023-11-09", "title": "长桥夜盘初体验：所有的尝试，都是为了让自己有得选", "chars": 1178, "read": true, "has_note": true, "themes": ["LI", "DGE", "HD", "JNJ", "DEO", "600662"], "source": "https://longbridge.cn/zh-CN/topics/10461947", "path": "library/10461947.html", "classification": "平台长文；原创性未逐篇认证", "core": "夜盘交易时段为美东时间晚上 20:00 至次日凌晨 3:50，也就是北京时间的早上 8:00 到 15:50，和 A 股、港股的交易时间基本重叠，不再需要为了美股额外花费精力。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10458930", "author": "京城Z先生", "date": "2023-11-07", "title": "明星股苹果、微软、特斯拉们都不便宜，下不去手怎么办？", "chars": 1388, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10458930", "path": "library/10458930.html", "classification": "平台长文；原创性未逐篇认证", "core": "11 月 1 日，我发布了文章《 4 个条件单已挂好，特斯拉/谷歌/帝亚吉欧/爱马仕，4 选 3 》，作为一个低频交易者，罕见的同时开了 4 个买单，详细展示了每一个标的的买入点位和仓位占比。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "10452620", "author": "京城Z先生", "date": "2023-11-04", "title": "京城 Z 先生的本周实盘-20231104（美股篇）：美联储 “用嘴加息”，长期国债从废纸变黄金", "chars": 2053, "read": true, "has_note": true, "themes": ["TSLA", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/10452620", "path": "library/10452620.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 特斯拉 5.7%↑，苹果 14.8%↑，微软 13.4%↑，西方石油 7.3%↓，帝亚吉欧 8.3%↑，强生 4.9%↑，家得宝 9.6%↑，TLT 5.1%↑，现金/其他 30.7%↓。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "10449595", "author": "京城Z先生", "date": "2023-11-03", "title": "苹果财报解读：减收增利，优等生没能拿到 “优” 怎么办？", "chars": 2149, "read": true, "has_note": true, "themes": ["持有与加仓", "估值分档", "组合权重", "财报拆分", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/10449595", "path": "library/10449595.html", "classification": "原创财报分析，含公告及媒体信息转述", "core": "2023年苹果Q4减收增利：作者拆硬件疲弱和服务增长，认为服务生态仍有价值，整体财报中性，不调整其185—249美元合理估值区间。自述已有近15%苹果仓位，不加不卖；认为126附近才特别诱人，但无持仓者在当时价也可开始配置。", "lesson": "已有仓位不是继续持有的充分理由，但若公司未变、估值未透支且组合不超限，持有门槛可不同于投入下一笔新钱。研究补足：用现价未来回报与替代机会决定，而不是因为成本低就降低要求。"}, {"id": "10446663", "author": "京城Z先生", "date": "2023-11-02", "title": "靠 “感觉” 能到赚钱吗？从昨天文章的留言，聊几个错误的投资逻辑", "chars": 1195, "read": true, "has_note": true, "themes": ["TSLA", "GOOGL", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/10446663", "path": "library/10446663.html", "classification": "平台长文；原创性未逐篇认证", "core": "昨天，我发布了文章《4 个条件单已挂好，特斯拉/谷歌/帝亚吉欧/爱马仕，4 选 3》。", "lesson": "将产品里程碑、监管、商业化与估值分别核验，避免用远景替代当前兑现。"}, {"id": "10442633", "author": "京城Z先生", "date": "2023-11-01", "title": "4 个条件单已挂好，特斯拉/谷歌/帝亚吉欧/爱马仕，4 选 3", "chars": 1070, "read": true, "has_note": true, "themes": ["GOOGL", "TSLA", "DEO", "HESAY", "GOOG", "DGE"], "source": "https://longbridge.cn/zh-CN/topics/10442633", "path": "library/10442633.html", "classification": "平台长文；原创性未逐篇认证", "core": "3、特斯拉/爱马仕 ，二选一 合理估值下限之下（特斯拉 155-186/爱马仕 152-172），我都将直接买入不超过 5% 的仓位，并在任意短期大幅反弹后卖出，如无明显反弹，则耐心持有，直至买点 1（特斯拉 124/爱马仕 101）之下，再加仓 5%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10441889", "author": "京城Z先生", "date": "2023-11-01", "title": "茅台为什么此时宣布提价？消费品涨价一定是利好吗？", "chars": 1502, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10441889", "path": "library/10441889.html", "classification": "平台长文；原创性未逐篇认证", "core": "“i 茅台” 可以粗暴理解为茅台的线上直营店 app，里面也卖飞天茅台等明星产品，价格和尺寸都与市面上常规款式不一致，但毫升数这算成市面上的瓶装飞天茅台，会比出厂价贵，比经销商那里便宜，这中间的利润，全部是茅台厂自己的增量。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "10429749", "author": "京城Z先生", "date": "2023-10-28", "title": "京城 Z 先生的本周实盘-20231028：准备接这三把 “飞刀”，给不给我机会？", "chars": 2014, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10429749", "path": "library/10429749.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 特斯拉 5.6%，苹果 14.7%，微软 13.3%，西方石油 7.5%，帝亚吉欧 7.9%，强生 4.9%，家得宝 9.3%，现金/其他 36.6%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10378908", "author": "京城Z先生", "date": "2023-10-25", "title": "微软” 留后手 “，用 AI 打开存量业务的天花板", "chars": 1441, "read": true, "has_note": true, "themes": ["AI商业化", "存量业务", "经营杠杆", "原始资料校验", "MSFT", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/10378908", "path": "library/10378908.html", "classification": "原创财报分析，含公告及媒体信息转述", "core": "作者将微软与其他AI公司对比：不必等AI自身找到独立商业模式，先让它推动Azure需求，并提高Office、LinkedIn、Dynamics等存量业务的变现能力。原帖引用Azure收入同比增29%、Microsoft Cloud收入318亿美元，把既有客户和业务下限视为AI探索的缓冲。", "lesson": "可迁移规则：新技术先问客户分销与付费路径，再问能否增加用量、单价或留存，最后扣除算力和资本投入。不应把Azure整体增长都归为AI或认为AI无成本；微软官方电话会称AI约贡献Azure增速3个百分点。"}, {"id": "10322856", "author": "京城Z先生", "date": "2023-10-21", "title": "京城 Z 先生的本周实盘-20231021（美股篇）：机会要跌出来了，子弹准备好了没？", "chars": 2877, "read": true, "has_note": true, "themes": ["TSLA", "JNJ", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/10322856", "path": "library/10322856.html", "classification": "平台长文；原创性未逐篇认证", "core": "本周开始，美股进入财报季，我关注股票池内，有以下几个： 特斯拉：10.18 苹果：11.02 微软：10.24 家得宝：11.14 西方石油：11.07 强生：10.17 谷歌：10.24 目前，强生和特斯拉已经出了，就先聊聊这俩吧。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "10314568", "author": "京城Z先生", "date": "2023-10-20", "title": "季报如预期一样不好，特斯拉现在能不能抄底？", "chars": 1354, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/10314568", "path": "library/10314568.html", "classification": "平台长文；原创性未逐篇认证", "core": "特斯拉第三季度总收入约 234 亿美元（约 1712 亿元人民币），同比增长 9%，是三年多来最慢的增速；净利润约 19 亿美元（约 139 亿元人民币）；市场最关注的 毛利率 下降至 17.9%，略低于华尔街预期的 18%。", "lesson": "将产品里程碑、监管、商业化与估值分别核验，避免用远景替代当前兑现。"}, {"id": "10258891", "author": "京城Z先生", "date": "2023-10-18", "title": "调仓 5%！十年不遇的好机会，确定性极高", "chars": 1284, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10258891", "path": "library/10258891.html", "classification": "平台长文；原创性未逐篇认证", "core": "先上图： 昨夜美股开盘， 我以均价 91.64 卖出 部分美国国债 1-3 月（BIL），占比约为总持仓的 5%，然后以均价 84.79 买入 等额 20 年以上美国国债（TLT）。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "10205748", "author": "京城Z先生", "date": "2023-10-14", "title": "京城 Z 先生的本周实盘-20231014（美股篇）：不可抗力，不做什么比做什么更重要", "chars": 1685, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10205748", "path": "library/10205748.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 特斯拉 6.7%，苹果 15.4%，微软 13.1%，西方石油 7.7%，帝亚吉欧 8.0%，强生 5.3%，家得宝 9.7%，现金/其他 32.9%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "10192013", "author": "京城Z先生", "date": "2023-10-13", "title": "没想到海外的明星基金，也一样是高位割韭菜式的发行", "chars": 940, "read": true, "has_note": true, "themes": ["HESAY"], "source": "https://longbridge.cn/zh-CN/topics/10192013", "path": "library/10192013.html", "classification": "平台长文；原创性未逐篇认证", "core": "上述截图出自我 2 个月前的文章：《京城 Z 先生的本周实盘-20230819（美股篇）》 可是人家明星基金不这么看，9 月 7 日该基金上市，也就是募资期间，应该就是爱马仕国际本年最高点附近，此行为像不像前 2 年前茅台 2000 多块/腾讯 700 块，喊着还能更高，更远，飞向外太空的价值投资大 V 们？", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "10173292", "author": "京城Z先生", "date": "2023-10-12", "title": "国家队下场，就是真的到底了吗？", "chars": 1568, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/10173292", "path": "library/10173292.html", "classification": "平台长文；原创性未逐篇认证", "core": "此阶段机会远大于风险，只要不是用杠杆资金买入的，不是指望市场立刻反弹的，只需耐心等待一个导火索（比如美联储宣布降息），明年回看，成绩肯定不会差。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "10113218", "author": "京城Z先生", "date": "2023- ById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('q').value.toLowerCase().trim(),a=$('author').value,f=$('form').value;let rows=data.filter(x=>(!a||x.author===a)&&(!q||[x.title,x.core,x.lesson,x.author,...(x.themes||[])].join(' ').toLowerCase().includes(q))&&(!f||(f==='featured'?x.featured:f==='note'?x.has_note:f==='read'?x.read:!x.has_note)));let pages=Math.max(1,Math.ceil(rows.length/size));pageNo=Math.min(pageNo,pages-1);$('count').textContent=`找到 ${rows.length} 条 · 第 ${pageNo+1}/${pages} 页`;$('results').innerHTML=rows.slice(pageNo*size,(pageNo+1)*size).map(x=>`<article class="post ${x.featured?'featured-post':''}">${x.featured?'<span class="tag featured-tag">重点研读</span>':''}<div class="muted">${esc(x.author)} · ${esc(x.date)} ${x.chars?'· '+x.chars+' 字符':''}</div><h3>${esc(x.title)}</h3>${x.featured_reason?'<p class="featured-reason">'+esc(x.featured_reason)+'</p>':''}<div>${(x.themes||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}<span class="tag">${x.has_note?'有分析笔记':'正文已存 · 待研读'}</span></div>${x.core?'<p><b>核心内容：</b>'+esc(x.core)+'</p><p><b>思想与教训：</b>'+esc(x.lesson)+'</p>':''}<div class="back">${x.path?'<a href="'+esc(x.path)+'">阅读本地正文 →</a>':''}<a href="${esc(x.source)}" target="_blank" rel="noopener">原帖 ↗</a></div></article>`).join('')||'<div class="empty">没有匹配的文章，请更换关键词。</div>';$('prev').disabled=pageNo===0;$('next').disabled=pageNo===pages-1}for(let id of ['q','author','form'])$(id).addEventListener(id==='q'?'input':'change',()=>{pageNo=0;render()});$('prev').onclick=()=>{pageNo--;render()};$('next').onclick=()=>{pageNo++;render();$('count').scrollIntoView({block:'start'})};render();</script></section></main><script>addEventListener("scroll",()=>{let d=document.documentElement;document.getElementById("progress").style.width=(100*d.scrollTop/(d.scrollHeight-d.clientHeight))+"%"})</script></body></html>
