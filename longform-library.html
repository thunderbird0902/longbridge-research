l", "classification": "补充对照长文；原创性未逐篇认证", "core": "⚡ 对比：CMX 与 HBF 的差异 两者定义了中间层的不同实现路径，关键对比如下： · 定位与标准：CMX 是英伟达推出的自有标准；HBF 是闪迪与海力士主导的下一代标准 · 技术基础：CMX 由 BlueField-4 DPU + NVMe SSD 构成；HBF 采用 TSV 3D 堆叠 NAND · 性能与时间：CMX 是现成的成熟组件方案，2026 年下半年随 Rubin 同步出货；HBF 是革命性突破方案，计划 2027 年实现商业化 CMX 与 HBF 并非简单的替代关系，而是反映了英伟达为抢占市场先机，采取的 “两步走” 战略：先用成熟技术（CMX）填补市场空白，再为未来升级预留", "lesson": "把技术路线、采用节点、出货、收入和利润逐层验证，AI需求不能自动等于股东回报。"}, {"id": "40720829", "author": "股神小顾", "date": "2026-05-13", "title": "股票实盘 P201:其实我是有定力的", "chars": 649, "read": true, "has_note": true, "themes": ["AMD", "WDC", "ALB", "MU", "RKLB", "ALB-A"], "source": "https://longbridge.cn/zh-CN/topics/40720829", "path": "library/40720829.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "AMD 我是它大跌到 150 的时候去接的，结果它最后跌到 80 多，持续阴跌了四五个月吧，感觉太磨时间，我无可奈何出掉了，去买别的赚钱的票。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "40693430", "author": "股神小顾", "date": "2026-05-13", "title": "股票实盘 P200:五小时工作制", "chars": 836, "read": true, "has_note": true, "themes": ["AMD", "NVDA", "META", "MSFT"], "source": "https://longbridge.cn/zh-CN/topics/40693430", "path": "library/40693430.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "那么我也应该多一点自信，比如脸书破新高我才会卖掉或者减仓，微软至少破 500 我才会卖掉它。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "40663766", "author": "lyhalfway", "date": "2026-05-12", "title": "BMNR 极值推演 5.12", "chars": 839, "read": true, "has_note": true, "themes": ["BTC", "BMNR", "BMNRD"], "source": "https://longbridge.cn/zh-CN/topics/40663766", "path": "library/40663766.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "从结果上看，本周一 BMNR 更新持币至 520 万 ，新增 2.6 万，现金仓位微增至 7.75 亿。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "40601866", "author": "京城Z先生", "date": "2026-05-10", "title": "美股实盘：硅基生命的房地产牛市（20260510）", "chars": 2125, "read": true, "featured": true, "featured_reason": "仓位管理｜闪迪接近组合四成时卖出部分转向康宁；单股集中下降，但AI基建的共同风险仍在。", "has_note": true, "themes": ["GOOG", "GOOGL", "SBSW", "MU", "TTMI", "NVDA", "GLW", "IREN", "SNDK", "SSNGY", "LITE"], "source": "https://longbridge.cn/zh-CN/topics/40601866", "path": "library/40601866.html", "classification": "平台长文；原创性未逐篇认证", "core": "5月10日自述卖出SNDK持股的20%换等额GLW，SNDK此前涨至约40%组合，交易后32.3%，GLW7.4%。触发包括第一结账目标达到及康宁与NVDA合作扩产；他认为光纤、玻璃基板有新增需求。虽有现金，仍选择从最大赢家削减，而非继续扩大整体股票敞口。", "lesson": "该动作有可学的主动降单股集中，但换入同为AI基建的GLW并未等量降低行业风险。原文“本金提走剩利润”会弱化风险感觉；此时剩余SNDK仍是现有资产32.3%，并非免费的筹码。"}, {"id": "40601235", "author": "股神小顾", "date": "2026-05-10", "title": "股票实盘 P199:赌徒神话", "chars": 919, "read": true, "has_note": true, "themes": ["NDAQ"], "source": "https://longbridge.cn/zh-CN/topics/40601235", "path": "library/40601235.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "说个极端的例子，昨天的小火箭我们都不用去博财报，只需要在它 85 块钱的时候买入当天 100 到期的期权，就能翻 200 倍，也就几个小时，几百倍。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "40509348", "author": "股神小顾", "date": "2026-05-07", "title": "股票实盘 P197:不再论股", "chars": 781, "read": true, "has_note": true, "themes": ["AMZN", "NDAQ", "688256", "MSFT", "META"], "source": "https://longbridge.cn/zh-CN/topics/40509348", "path": "library/40509348.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "何况美股大盘新高，脸书和微软是七姐妹里面垫底的，它们不同于那些垃圾股，后期必然会有一个补涨，这个时候正是加仓的好机会，于是就买入了脸书和微软。", "lesson": "比较业务增量、资本开支、利润率和估值，热门公司仍需买价。"}, {"id": "40461203", "author": "股神小顾", "date": "2026-05-06", "title": "股票实盘 P196: 存储的疯涨，是全人类的悲哀", "chars": 810, "read": true, "has_note": true, "themes": ["SNDK", "PDD", "MU", "688256", "000858", "UBER", "002384"], "source": "https://longbridge.cn/zh-CN/topics/40461203", "path": "library/40461203.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "如果所有人都选择卖出，靠着宏大叙事飞向星辰大海的科技股，可以瞬间归零；而拥有护城河、现金流充沛的红利股，跌不到哪里去，跌了就是捡钱的机会。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "40415497", "author": "AngerBird", "date": "2026-05-05", "title": "别用你的认知局限，随意定义别人的人生", "chars": 830, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/40415497", "path": "library/40415497.html", "classification": "平台长文；原创性未逐篇认证", "core": "这两天，一直有人把投资加密货币的人一概而论为 “赌徒”，可细问之下，这类人连一份项目白皮书都未曾翻开过，不懂什么是分布式记账，不明白点对点交易的核心逻辑，更从未深入了解过这个领域的底层逻辑与技术框架，仅凭道听途说的片面信息，就轻易给所有参与者扣上帽子。", "lesson": "同时检查币价、每股持币、稀释、负债与净资产溢价，质押收益不是无风险增长。"}, {"id": "40423296", "author": "熊猫校长Ming", "date": "2026-05-05", "title": "闪迪暴跌 6% 那天，我决定研究 NAND 周期", "chars": 3062, "read": true, "has_note": true, "themes": ["SNDK", "MU", "SSNGY"], "source": "https://longbridge.cn/zh-CN/topics/40423296", "path": "library/40423296.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "在SNDK财报大幅增长却下跌后，作者未建仓，先研究NAND供给纪律、客户认证和企业SSD需求，观察晶圆价格、云资本开支和毛利率，拟用DRAM ETF分散单股。", "lesson": "方法价值在把周期持续性置于低PE之前；但下跌原因只是其解释，不能证明所有利好已定价。尤其拟卖put却附“可能损失全部权利金”的买方式说明，低估了卖方接货损失。"}, {"id": "40413505", "author": "SpaceM", "date": "2026-05-05", "title": "美股最稳的 14%：QQQI ", "chars": 3006, "read": true, "has_note": true, "themes": ["MSFT", "META", "TSLA", "AVGO", "AMZN", "GOOG", "GOOGL", "AAPL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/40413505", "path": "library/40413505.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "一、核心数据 截至 2026 年 5 月 4 日收盘，QQQI 报 54.51 美元 。 它的底层敞口是 Nasdaq-100，核心资产仍然是苹果、英伟达、微软、亚马逊、Meta、博通、谷歌、特斯拉这些大型科技股。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "40376535", "author": "京城Z先生", "date": "2026-05-03", "title": "美股实盘：接盘惊奇队长（20260503）", "chars": 2133, "read": true, "has_note": true, "themes": ["ORCL", "NVDA", "MU", "POET", "GOOG", "LITE", "MRVL", "SBSW", "NEM", "BE", "SNDK", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/40376535", "path": "library/40376535.html", "classification": "平台长文；原创性未逐篇认证", "core": "本周 WSJ 发了一篇关于 OpenAI 的鬼故事，造成板块普跌；同时 MRVL 和一个合作方 POET 因离奇原因解约了，两个消息面的利空造成了股价回调，趁着这个时机我就勉强冲了点仓位，但仓位并不大，价格不算诱人。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "40374745", "author": "昆仑山岩石", "date": "2026-05-03", "title": "闪迪未来的股价还能上涨多少？", "chars": 760, "read": true, "has_note": true, "themes": ["MU", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/40374745", "path": "library/40374745.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "现在闪迪的日换手率超高就是短线客太多，股价频繁波动就是割韭菜的过程，短线追涨杀跌妄想一夜暴富的心态需要调整一下，对闪迪来说频繁操作跑不赢持股不动，当然闪迪短期股价波动在市场里是正常的交易行为，不会改变中期上涨趋势，好了，希望过一年半载后不要再悔不当初！", "lesson": "把技术路线、采用节点、出货、收入和利润逐层验证，AI需求不能自动等于股东回报。"}, {"id": "40306601", "author": "老板的老板 AI Exec", "date": "2026-04-30", "title": "700.HK 港美股多智能体分析报告", "chars": 26245, "read": true, "has_note": true, "themes": ["700", "TCTZF", "80700", "TCEHY", "HTCD"], "source": "https://longbridge.cn/zh-CN/topics/40306601", "path": "library/40306601.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "📊 关键发现总结表 指标 数值/状态 情绪解读 市场温度 81（Warm & Gradually Rising） 港股整体情绪偏暖，资金风险偏好回升 估值水位 91 处于高分位区间，价格已透支部分利好，上行空间受估值压制 情绪指数 7.5/10 乐观但非狂热，AI商业化落地提供坚实支撑 资金流向 数据缺口（Longbridge未返回） 需依赖券商Level-2或盘口数据辅助确认主力动向 新闻倾向 高度正面（AI模型/云提价/Agent） 强化科技成长逻辑，短期情绪催化明确 反身性风险 中高 利好密集期易现“买预期卖事实”，需警惕获利回吐 1-5日波动预期 ±3.5% ~ ±5.0% 震荡偏强格", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "40260009", "author": "老板的老板 AI Exec", "date": "2026-04-28", "title": "BABA.US 港美股多智能体分析报告", "chars": 11173, "read": true, "has_note": true, "themes": ["9988", "89988", "BABA", "HBBD"], "source": "https://longbridge.cn/zh-CN/topics/40260009", "path": "library/40260009.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "📊 关键发现总结 维度 关键指标/发现 市场含义与交易指引 市场温度 68 (舒适且温和上升) 宏观环境友好，风险偏好稳步回升 估值分位 84 预期已部分定价，需业绩兑现支撑估值 情绪指数 53 (原始) / 7.0/10 (综合) 资金承接有力，短期存在技术性分歧 资金流向 盘中V型反转，全口径净买入 抛压被有效消化，中小资金主导活跃度 新闻催化 AI龙头认可+618启动+云涨价 基本面逻辑强化，短期价格反应滞后 反身性风险 估值偏高+利好钝化(-2%) 下跌释放压力，下行空间受限 预期波动(1-5日) ±3.8% ~ 5.2% 高换手震荡，方向选择待催化确认 交易建议 逢低布局，持有待涨 ", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "40259315", "author": "老板的老板 AI Exec", "date": "2026-04-28", "title": "RKLB.US 港美股多智能体分析报告", "chars": 13152, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/40259315", "path": "library/40259315.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$Rocket Lab(RKLB.US) 港美股多智能体分析报告 分析日期: 2026-04-28 分析师: market, fundamentals, news, social LLM Provider: custom_openai Quick Model: qwen3.6-plus Deep Model: qwen3.6 ation": "补充对照长文；原创性未逐篇认证", "core": "而 AI 时代对存储的需求是指数级增长，除了 HBM、HBF 外，当下企业级 SSD 的需求剧增，现在原厂的扩产速度远远跟不上 AI 需求增长，美光科技上个财报给出产能只能满足主要客户 50% 到三分之二的需求，周四闪迪的财报和展望也会表明对 NAND 的需求增长程度，“永远缺存储” 虽然到不了地老天荒，三五年紧缺是看得见的。", "lesson": "把技术路线、采用节点、出货、收入和利润逐层验证，AI需求不能自动等于股东回报。"}, {"id": "40164489", "author": "股神小顾", "date": "2026-04-24", "title": "股票实盘 P188:聪明误", "chars": 641, "read": true, "has_note": true, "themes": ["BA", "BA-A"], "source": "https://longbridge.cn/zh-CN/topics/40164489", "path": "library/40164489.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "这样一看我真的像个小丑，因为洛克马丁它本身幅度是特别小的，每天的波幅，但是这几天都是几个点几个点的跌，如果买看跌期权的话真的有百倍以上的收益了。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "40119430", "author": "SpaceM", "date": "2026-04-23", "title": "特斯拉财报确认 AI 主线，但马斯克亲手递来了一张 250 亿美元的账单", "chars": 4872, "read": true, "has_note": true, "themes": ["TSLA", "INTC", "AMZN", "4335"], "source": "https://longbridge.cn/zh-CN/topics/40119430", "path": "library/40119430.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Q1 2026 财报核心数字： 指标 Q1 2026 Q1 2025 同比 共识 对比 总营收 $223.8 亿 $193 亿 +16% $214 亿 超 Non-GAAP EPS $0.41 — — $0.37 超 11% GAAP EPS $0.13 $0.12 +8% $0.25 低于 净利润 $4.77 亿 $4.09 亿 +17% — — 毛利率 21.1% 16.3% +4.8pp — 大超 汽车毛利率（不含积分） 19.2% — — — 近年最高 自由现金流 $14.4 亿 — — — 超预期转正 汽车业务营收 $162 亿 $140 亿  但他也说\"volume will be quite slow at first，有 10,000+ 个独特零件要逐一解决\"——这句警告很重要，意味着 2026 年 Optimus 的实际交付数量可能远低于此前他自己画的\"年内 1 万台\"的饼。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "40054178", "author": "lyhalfway", "date": "2026-04-21", "title": "BMNR 极值推演 4.21", "chars": 1047, "read": true, "has_note": true, "themes": ["STRC", "BMNR", "BMNRD", "MSTR", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/40054178", "path": "library/40054178.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "但另一方面，管理层通过激进融资，提高了囤币进度和现金仓位，现在距离 5% 的囤币目标还差 100 万 ETH，按 2.5k 的 ETH 测算还需要 25 亿，目前 BMNR 已经有现金 11.2 亿，也就是说再融资 14 亿就能实现目标了，同时如果维持每周 10 万 + 的囤币进度，再过 2 个多月就能到 5%。", "lesson": "同时检查币价、每股持  新增购入的 4 万 ETH 是使用现金，并未进行 ATM 融资，这也体现出管理层的运营纪律。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "38120510", "author": "股神小顾", "date": "2026-01-27", "title": "股票实盘 P128:又交了学费", "chars": 704, "read": true, "has_note": true, "themes": ["9988", "NDAQ", "BABA", "89988", "HBBD"], "source": "https://longbridge.cn/zh-CN/topics/38120510", "path": "library/38120510.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "其实还有第三个错误，就是垂直空阿里，我差不多在 171.9 的时候空的，0.89 的权利金，扣去开仓平仓的手续费只能拿到 0.85，也就是我要在 0.75 平才能赚 10 美金，结果一晚上都没平掉，拿到现在，阿里巴巴又暴涨了，本来想赚 10，现在要亏 250 了，还是三个 250，心态真的炸裂 搞来搞去，搞一大堆策略，还不如单边期权赚的多，亏的少，这是何苦", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "38089961", "author": "lyhalfway", "date": "2026-01-26", "title": "稳定币和代币化的长周期叙事", "chars": 1012, "read": true, "has_note": true, "themes": ["BLK", "CRCL"], "source": "https://longbridge.cn/zh-CN/topics/38089961", "path": "library/38089961.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "现有的国际体系是基于美国主导规则下的，但如今美国进无法维持冷战后的全球霸权模式（靠军事托底全球秩序，但花钱太多），退也无法完美抽身回到传统门罗主义的地缘收缩（靠关税产业政策地缘博弈，但代价是全球影响力）。", "lesson": "把技术、采用、合同、收入、利润和融资里程碑分层核验。"}, {"id": "38078838", "author": "京城Z先生", "date": "2026-01-25", "title": "美股实盘-20260125：大风红色预警", "chars": 1718, "read": true, "has_note": true, "themes": ["财报前计划", "相对配置", "确认偏差", "NVDA", "BE", "GOOG", "NEM", "SNDK", "LITE", "ATI", "MU", "SSNGY", "TSM", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/38078838", "path": "library/38078838.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "1月25日作者连续两周无交易，自述年内22.69%，持仓SNDK18.5%、NEM24.2%、GLD21.4%、NVDA15.6%，现金零。他认为部分仓位短线过热，研究的是锁利润而非加仓；对SNDK则称仍低于个人合理区间，等海力士、三星和闪迪财报超过已经很高的市场预期，否则可能减仓。BE已由低估进入合理、赔率下降但尚不贵；NVDA相对涨得少，若仍低位可考虑补。", "lesson": "这篇把持仓价值、市场预期和短期热度分开，是有用的前置财报规则。问题是用上涨证明估值正确、用黄金只能再创新高加强信心，容易形成确认偏差；应在财报前明确超预期变量，避免任何结果都被重新解释为可持有。"}, {"id": "38073898", "author": "股神小顾", "date": "2026-01-24", "title": "股票实盘 P127:伯克，公民，拼多多", "chars": 1521, "read": true, "has_note": true, "themes": ["INTC", "9618", "89618", "JD", "9888", "NFLX", "9999", "9899", "2015", "PDD", "KO", "9988"], "source": "https://longbridge.cn/zh-CN/topics/38073898", "path": "library/38073898.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "但是我看下周拼多多期权的 IV 很高，如果不是做市商又要横盘杀一周期权的话，下周拼多多应该有大波动了，但是我也没买，因为这周双买拼多多已经归零了。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "38050454", "author": "lyhalfway", "date": "2026-01-23", "title": "如果黄金不轮动，支撑 BTC 的增量资金在哪里", "chars": 885, "read": true, "has_note": true, "themes": ["SBET", "PHUN", "DJT", "DJTWW", "CRCL", "BTC", "ABTC", "GBTC"], "source": "https://longbridge.cn/zh-CN/topics/38050454", "path": "library/38050454.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "正好这两天在看 ARK 的 26 年报告，木头姐依然是 AI 和加密的大多头，她从 BTC 的估值模型回答了 BTC 的增量资金来自哪里      全球市场组合的 “再平衡”（Institutional Investment）  全球约 200 万亿美元 的机构资产池（不含黄金），包括养老基金、保险金和捐赠基金。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "38046420", "author": "股神小顾", "date": "2026-01-23", "title": "股票实盘 p126:错过的赌局", "chars": 798, "read": true, "has_note": true, "themes": ["FIG", "MAT", "PDD", "PATH", "UNH", "INTC", "MSFT", "MA", "NFLX", "9988", "BABA", "89988"], "source": "https://longbridge.cn/zh-CN/topics/38046420", "path": "library/38046420.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "但是很可惜，这些老登骨都没到我的 long call 价位，就像 mate，我的价格一直是 580，微软，我的价格是 435，就微软前天最低价 438 嘛，差了一点，Mate, 最低价 600 嘛，差的多一点，那其实就是失之交臂了。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "38030904", "author": "股神小顾", "date": "2026-01-23", "title": "上周赌拼多多输了 这周赌阿里会赢吗", "chars": 1887, "read": true, "has_note": true, "themes": ["PDD", "9988", "89988", "BABA", "HBBD"], "source": "https://longbridge.cn/zh-CN/topics/38030904", "path": "library/38030904.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "” “对的三层，一是看透了拼多多的底子——彼时 PE 十之数，现金充裕，Temu 虽烧钱却有海外市场，这是价值的底；二是看透了中概股的棋局——龙头倒则板块倾，监管之刀不会轻易落下，这是人心的局；三是看透了市场的恐慌——利空漫天时，正是估值洼地，这是时机的势。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "38017299", "author": "AngerBird", "date": "2026-01-22", "title": "赴一场投资智慧之约——东方港湾投资大会参会感悟", -19", "title": "（个人分析 不构成投资建议）纯大白话聊 BMNR", "chars": 1089, "read": true, "has_note": true, "themes": ["BMNR", "BMNRD", "MSTR", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/37915533", "path": "library/37915533.html", "classification": "平台长文；原创性未逐篇认证", "core": "汇总一下核心逻辑： 未来只要 ETH 价格能一路创新高，BMNR 的股价大概率也会跟着飙升，它也会继续对外融资，一边加仓买 ETH，一边完善去中心化智能合约站点的布局，对应的公司股本也会一路扩容，目前看股本扩容是没上限的。", "lesson": "同时检查币价、每股持币、稀释、负债与净资产溢价，质押收益不是无风险增长。"}, {"id": "37915160", "author": "lyhalfway", "date": "2026-01-19", "title": "川普关税 Taco 应对手册🌮", "chars": 1353, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/37915160", "path": "library/37915160.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "以下是我们一直以来运用的具体应对策略：   应对特朗普贸易战的全面分步指南：    Step1 周五：  特朗普总统发布一条隐晦的信息，预示将对特定国家或行业征收关税。", "lesson": "宏观只用于情景与风险预算，不构成单一路径保证。"}, {"id": "37906805", "author": "京城Z先生", "date": "2026-01-18", "title": "美股实盘-20260118：热辣滚烫，强的可怕", "chars": 2368, "read": true, "has_note": true, "themes": ["NVDA", "SNDK", "MU", "TSM", "GOOG", "BE", "ATI", "NEM", "LITE", "SSNGY", "AEP", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/37906805", "path": "library/37906805.html", "classification": "平台长文；原创性未逐篇认证", "core": "高盛分析师直言 “任何希望回调的人都会失望”，华尔街共识认为，台积电通过远超预期的资本开支与利润率指引，彻底打破了其作为 AI 产能瓶颈的保守形象，展现出对行业长期需求的绝对信心。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "37900710", "author": "老板的老板 AI Exec", "date": "2026-01-17", "title": "Robinhood (HOOD) 周报：2026 年 1 月 8 日至 1 月 14 日动态复盘", "chars": 2147, "read": true, "has_note": true, "themes": ["IBKR", "AB", "GOLD", "COIN", "SCHW", "HOOD", "D05", "DBSDY", "SCHW-D", "SCHW-J"], "source": "https://longbridge.cn/zh-CN/topics/37900710", "path": "library/37900710.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "日均交易量（DARTs）方面，11 月股权 DARTs 为 270 万（同比 +8%），期权 130 万（+30%），加密 60 万（-40%），显示加密交易疲软但传统资产稳定。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "37900690", "author": "老板的老板 AI Exec", "date": "2026-01-17", " ://longbridge.cn/zh-CN/topics/37713841", "path": "library/37713841.html", "classification": "平台长文；原创性未逐篇认证", "core": "MAGA 7 阵营多数全线飘红，成为市场中坚力量，特斯拉与谷歌表现尤为亮眼，谷歌盘中更是突破 4 万亿市值，创下历史新高，尽显科技巨头的估值韧性；仅英伟达略显分化，盘中一度飘红，最终微跌收官，整体仍保持相对强势。", "lesson": "宏观只用于情景和风险预算，不作为单一路径保证。"}, {"id": "37715552", "author": "老板的老板 AI Exec", "date": "2026-01-10", "title": "HOOD 2026 年第一周（2026 年 1 月 4 日 - 1 月 10 日）的深度复盘与投资洞察", "chars": 1669, "read": true, "has_note": true, "themes": ["HOOD", "SCHW", "AAPL", "SCHW-D", "SCHW-J"], "source": "https://longbridge.cn/zh-CN/topics/37715552", "path": "library/37715552.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "如果 2 月 10 日的财报中 DARTs 数据出现大幅下滑，短期股价会有剧烈波动的风险。", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "37711555", "author": "股神小顾", "date": "2026-01-10", "title": "股票实盘 P118:大盘暴涨，期权雪崩，策略补天", "chars": 851, "read": true, "has_note": true, "themes": ["UBER", "AMD", "SBET", "PDD", "COIN", "NVO", "FIG", "PATH", "SNPS", "AMZN", "BMNR", "BMNRD"], "source": "https://longbridge.cn/zh-CN/topics/37711555", "path": "library/37711555.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "今年是红的，昨天也是红的，主要还是得益于我压对了诺和诺德和拼多多，诺和诺德上 60 这句话，我至少说了 20 次（虽然我自己在 54 块钱清掉了所有期权，15 张，少赚了 9000 刀）新思科技我也一直说会上 500（虽然我 455 把 2 张期权卖掉了，少赚 13000 刀）拼多多我一直唱多，虽然没有吃到大肉（被套利➕强趋势害了，我个人的策略适合震荡行情）以及亚马逊的暴力反弹（废纸都回本了）还有准确抄底优步（78 块钱精准判断底部，买了一张期权，盈利 300 刀卖掉） 我买诺和诺德，新思科技，拼多多，优步的时候，没有任何人唱多，所有交易逻辑都是自己千锤百炼来的，最终也确实盈利了，虽然不完美 ", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "37681451", "author": "AngerBird", "date": "2026-01-09", "title": "2026 年 1 月 8 日美股盘后核心分析", "chars": 1378, "read": true, "has_note": true, "themes": ["BMNR", "SBET"], "source": "https://longbridge.cn/zh-CN/topics/37681451", "path": "library/37681451.html", "classification": "作者原创的市场盘后分析长文", "core": "长文回顾三大指数分化，把芯片存储回调归于高估值担忧和降息预期降温，把军工上涨归于特朗普提高2027年国防预算的提议，把贵金属下跌归于指数权重调整、美元与获利盘，把加密波动置于政策利好和流动性收紧之间。作者还把82亿美元RRP解释为银行流动性维稳而非股市增量资金，并关注次日关税裁决和非农，最终主张折价、护城河与现金流配置。", "lesson": "正文是作者的盘后归因和前瞻，不等于因果已被证实。尤其RRP操作性质、指数权重调整、政策提议和裁决日期需要原始来源核验；操作部分是未来思路，不是已执行交易。"}, {"id": "37678899", "author": "股神小顾", "date": "2026-01-09", "title": "股票实盘 P117:最牛的预言家，也赚不到钱", "chars": 854, "read": true, "has_note": true, "themes": ["9888", "89888", "BIDU", "ORCL", "1810", "81810", "XIACY", "9988", "TSLA", "KO", "BABA", "89988"], "source": "https://longbridge.cn/zh-CN/topics/37678899", "path": "library/37678899.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "问题的根源不在于我不会炒股，而在于我过去一直迷失，不相信自己，不遵守自己的交易体系，去抄作业，去碰加密中概网红票。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "37646340", "author": "京城Z先生", "date": "2026-01-08", "title": "2026 年开盘梭哈躺平组合 (港股篇)", "chars": 488, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/37646340", "path": "library/37646340.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 组合配置如下： 1、25% $景顺 QQQ(03455.HK) 2、20% $三星彭博环球半导体ETF(03132.HK) 3、20% $南方创业板(03147.HK) 4、20% $GX恒生股息(03110.HK) 5、15% $SPDR金(02840.HK) --- 两岸三地，每个市场我都选了 5 个 ETF，和另外两篇的标准一样，就以 2026 年 1 月 2 日开盘价作为入场价，我们今年年底再看。", "lesson": "低倍数可能对应周期高点；供需、资本开支和利润持续时间要一起估。"}, {"id": "37598727", "author": "京城Z先生", "date": "2026-01-07", "title": "2026 年开盘梭哈躺平组合 (美股篇)", "chars": 592, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/37598727", "path": "library/37598727.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 组合配置如下： 1、25% QQQ 纳指 100etf 2、25% SPY 标普 500etf 3、20% RING 全球黄金矿股 ETF 4、20% COPX 全球铜矿股 ETF 5、10% BITB 大饼 ETF --- 和 A 股篇一样，就以 2026 年 1 月 2 日开盘价作为入场价吧，我们今年年底再看，老实说我自己也不是很有信心打赢这个组合。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "37562592", "author": "lyhalfway", "date": "2026-01-06", "title": "BMNR 极值推演 0106", "chars": 793, "read": true, "has_note": true, "themes": ["BMNR", "BMNRD"], "source": "https://longbridge.cn/zh-CN/topics/37562592", "path": "library/37562592.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "这体现了管理层的运营纪律，即不会无节制的融资，所有操作都是为了提升 eth per share  新增质押 25 万，总质押 65.9 万，占比 16%，按此进度在 Q1 应该能够完成 400 万 + 持有量的完全质押，也即 3.7 亿的年净利润收入，这将使 BMNR 实现中型蓝筹股的盈利水平。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "37540986", "author": "lyhalfway", "date": "2026-01-05", "title": "预言家 Zoltan Pozsar", "chars": 1587, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/37540986", "path": "library/37540986.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Zoltan 的框架师承 Perry Mehrling 的 “货币视角”，但他结合了自己在美联储和瑞信一线的实操经验，将其应用到了地缘政治和战争融资的层面。", "lesson": "宏观只用于情景与风险预算，不构成单一路径保证。"}, {"id": "37523382", "author": "京城Z先生", "date": "2026-01-04", "title": "美股实盘-2025 年终总结：倒反天罡，我抄自己的 A 股作业", "chars": 2899, "read": true, "has_note": true, "themes": ["NVDA", "600111", "300308", "LITE", "2899", "1787", "300394", "BE", "NEM", "2600", "AA", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/37523382", "path": "library/37523382.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 加密结束后陷入了第二个尴尬，众所周知，今年很多人对美股科技恐慌，不是说英伟达们基本面不行了，而是以 OpenAI 为首的一众 “画饼仙人”，不断拉帮结派搞 期货订单 ，直接让众多科技公司因暴增 “潜在利润” 而股价大涨，涨了就可以搞更多期货订单，左脚踩右脚螺旋飞升，我在美股对此感到陌生，但我在 A 股遇到见过太多次这玩意，所以有很长一段时间选择了先回避科技巨头。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "37494169", "author": "老板的老板 AI Exec", "date": "2026-01-02", "title": "Ondas“反无人机与自主系统” 市场的深度投资备忘录", "chars": 1559, "read": true, "has_note": true, "themes": ["ONDS", "O"], "source": "https://longbridge.cn/zh-CN/topics/37494169", "path": "library/37494169.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "标的 : Ondas Holdings Inc. $Realty Income MD(O.US) ndas(ONDS.US) 当前股价 : $9.76 (年初至今上涨 +725%) 2026 年营收目标 : $1.1 亿美金 (同比增长 205%) 现金储备 : 约 $8 亿美金 (得益于 2025 年的大额融资) 市场评级 : 强力买入 (8 位分析师一致推荐) 2. 核心投资逻辑 (The Bull Case) 报告认为 ONDS 正在经历从 “工业无线网” 向 “国防科技” 的各种关键转型。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "37490873", "author": "老板的老板 AI Exec", "date": "2026-01-02", "title": "ONDS 股价预测细节 By Grok", "chars": 2094, "read": true, "has_note": true, "themes": ["ONDS", "PLTR", "ASTS", "RKLB"], "source": "https://longbridge.cn/zh-CN/topics/37490873", "path": "library/37490873.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Seeking Alpha 文章强调 2026 年收入目标 1.1 亿美元，毛利率趋向 70%，支持更高估值，但未给出具体股价。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "37470234", "author": "价值&投资", "date": "2025-12-31", "title": "2025 年投资总结-- AI 贯穿始终", "chars": 1518, "read": true, "featured": true, "featured_reason": "年度复盘｜把正股、期权、恐慌买入和减少倍数产品串起来，看工具收益与执行精力怎样改变做法。", "has_note": true, "themes": ["NVDA", "AMD", "RKLB", "S", "ISRG", "TSM", "9988", "LLY", "TSLA", "AMZN", "RXRX", "INTC"], "source": "https://longbridge.cn/zh-CN/topics/37470234", "path": "library/37470234.html", "classification": "作者年度复盘长文", "core": "年度复盘覆盖AI芯片、模型与应用，以4月关税恐慌时分批买正股加long call为主线。称苹果是当年收益最高的标的，因为走势较稳、期权能拿更久；同时承认错过NVDA。将TSM与GOOG视作非卖品，继续观察Robotaxi、苹果产品；因波动损耗与精力消耗逐步减少2—3倍ETF，希望正股长持、期权阶段参与，把时间留给生活。", "lesson": "新增可学之处是退出节奏要结合标的价格路径和工具期限，并把执行精力算入策略成本。年度总收益与苹果贡献均属自述；“非卖品”是当时信念，仍须企业证伪。减少倍数ETF不证明long call天然低风险。"}, {"id": "37468412", "author": "周树人的交易员", "date": "2025-12-31", "title": "联合健康 2025 年第四季度复盘 · 展望 · 交易计划", "chars": 619, "read": true, "has_note": true, "themes": ["UNH", "预期差", "长短仓"], "source": "https://longbridge.cn/zh-CN/topics/37468412", "path": "library/37468412.html", "classification": "作者原创分析或复盘", "core": "称已持UNH37周，四季度减仓一次且在财报前一日，理由是技术面和情绪过热；长期仍期待2026恢复、2027增长，再以技术企稳增加波段参与。文中同时跟踪监管、业务退出、AI成本效率及管理层变化。", "lesson": "新增具体证明其长短策略分账：长期经营看法未变，也可为过热预期减仓。减仓属于事后自述，缺当日帖和完整流水，不称成功预测；13F未增持与价格回调的因果也只是解释。应比较持仓预期与市场热度，而非用看好决定永远不卖。"}, {"id": "37434886", "author": "lyhalfway", "date": "2025-12-30", "title": "BMNR 极值推演 12.30 新年快乐", "chars": 873, "read": true, "has_note": true, "themes": ["BMNR", "BMNRD", "BTC", "LEE", "MSCI"], "source": "https://longbridge.cn/zh-CN/topics/37434886", "path": "library/37434886.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "对于质押收益的预期，BMNR 使用的是 CESR 2.81%，CESR 是最接近 ETH“无风险” 利率的指标。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "37435441", "author": "股神小顾", "date": "2025-12-30", "title": "股票实盘 P110:远离末日", "chars": 588, "read": true, "has_note": true, "themes": ["NVO", "ORCL", "CRWV", "AMZN", "PDD"], "source": "https://longbridge.cn/zh-CN/topics/37435441", "path": "library/37435441.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "哪怕我挂卖单早早睡觉，起来就是数钱了 末日 Qqq 是很考验心性的事： 1.这是纯赌 不是投资 2.要么做止损，要么有归零的觉悟 3.不仅要看对趋势，心态还要拿的好，才能拿得住（客观来说，大趋势我是看对了，但是最终做反了） 4.纳指 0.1 个点的波动，对期权的价格都是天翻地覆，这里没有价值的说法，哪怕纳指跌 5 块钱也不一定是底部，何况纳指 1-3 块钱的波动呢，想靠末日赚钱很难，至少不是我能赚的 然后昨天币股 诺和诺德 甲骨文 crwv 亚马逊 拼多多全都在跌 我更悲伤了", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "37404373", "author": "老板的老板 AI Exec", "date": "2025-12-29", "title": "RKLB 股价分析与情景预测 — 2025-12-28", "chars": 11637, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/37404373", "path": "library/37404373.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "7. 监测框架与触发点（Monitoring Framework） 7.1 关键监测指标（按优先级排序） 🔴 高优先级（每周监测） Neutron 进度公告 LC-3 设施建设进度 发动机测试结果（热点火、满推力测试） 首飞窗口明确化（具体月份） 分析师目标价变化 若多家下调至 <$60，警惕估值压缩风险 若多家上调至 >$90，可能有新催化剂 股价技术面 若跌破 $60（约 -15%），可能触发技术性抛售 若突破 $80（约 +13%），可能突破新高 🟡 中优先级（每月监测） Electron 新增合同数量 若 <12 份/季度，警惕需求放缓 若 >15 份/季度，验证增长动能 SpaceX", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "37391559", "author": "老板的老板 AI Exec", "date": "2025-12-27", "title": "Robinhood (HOOD) 周报：2025 年 12 月 20 日-12 月 26 日", "chars": 2319, "read": true, "has_note": true, "themes": ["DRK", "HOOD", "ACCL", "ACCO", "OUT", "IBKR", "SC", "AB", "CAN", "GOLD", "SCHW", "R"], "source": "https://longbridge.cn/zh-CN/topics/37391559", "path": "library/37391559.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "核心业务与财务表现 本周无新季度财报发布，但公司于 12 月 10 日公布的 11 月运营数据显示，权益和期权日均收入交易量（DARTs）同比上升，加密 DARTs 也保持强劲。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "37376518", "author": "老板的老板 AI Exec", "date": "2025-12-26", "title": "Recursion Pharmaceuticals Inc (RXRX) 过去一周动态报告", "chars": 2266, "read": true, "has_note": true, "themes": ["RXRX", "ABCL", "PRME", "GILD", "RHHBY", "SNYNF", "RPTX", "R", "RHHVF", "SNY"], "source": "https://longbridge.cn/zh-CN/topics/37376518", "pat AI Exec", "date": "2025-11-17", "title": "RXRX.us 深入研究 by Qwen app", "chars": 12125, "read": true, "has_note": true, "themes": ["BAYZF", "RXRX", "NVDA", "BAYRY"], "source": "https://longbridge.cn/zh-CN/topics/36428354", "path": "library/36428354.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "下表总结了公司近年来的部分财务数据： 财务指标 2024年 Q3 2024年 2025年 Q1 2025年 Q2 2025年 Q3 总营收 (Total Revenue) $26.1 million [[5]] $58.8 million [[12]] $15.0 million [[14]] $19.2 million [[17]] $5.2 million [[15]] 净亏损 (Net Loss) $95.8 million [[5]] $463.7 million [[12]] $203.0 million [[14]] $171.9 million [[17]] $162.3 mil", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "36422494", "author": "股神小顾", "date": "2025-11-17", "title": "股票实盘 P82:李密的 k 线人生", "chars": 888, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/36422494", "path": "library/36422494.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "闲来无事，又去翻了隋唐那段历史，发现三十六路反王之首李密的一生很有意思 融资阶段：牛角挂书，被大佬杨素赏识，与杨玄感交好 出生名门，又被大佬杨素赏识，大有可为（利好） 李靖也被杨素赏识，混的挺惨的，先观望吧（中性） 第一轮上市失败：和杨玄感造反失败，隐姓埋名 造反失败，一无所有，成逃犯了（利空） 再次融资：加入瓦岗军，阵斩名将张须陀，成为瓦岗二把手 张须陀所向无敌，都被李密杀了，潜力股，加注（利好） 上市：攻占兴洛仓，被推举为盟主，称魏公 李密是真有两把刷子，隋朝最大粮仓都给打下了，他是真的挺能干的（利好） 一山不如二虎，翟让容得下他吗（中性） 震荡阴跌：杀翟让，整合内部 不知道瓦岗寨其他人怎", "lesson": "他人观点只能作为线索；跟单前独立写出估值、仓位、退出与最大损失。"}, {"id": "36359347", "author": "lyhalfway", "date": "2025-11-14", "title": "BMNR 新任 CEO 和 3 位独立懂事", "chars": 992, "read": true, "has_note": true, "themes": ["9961", "HTGD", "BMNR", "BMNRD", "9988", "700", "MS", "UBS", "TCOM", "BABA", "89988", "TCEHY"], "source": "https://longbridge.cn/zh-CN/topics/36359347", "path": "library/36359347.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "对 BMNR 的潜在帮助： 她的法律和政策背景，尤其在能源科技领域的经验，可帮助公司处理监管合规、合同管理和风险评估，支持数字基础设施的合法扩展。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "36350556", "author": "股神小顾", "date": "2025-11-14", "title": "股票实盘 P81:绝途", "chars": 935, "read": true, "has_note": true, "themes": ["TSLA", "9992", "CRCL", "002028", "6969", "SE", "SMCI", "APP", "HPPD"], "source": "https://longbridge.cn/zh-CN/topics/36350556", "path": "library/36350556.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我跟过一次 Qqq call，那天闲聊，我本来不打算赌末日的，看他说的太笃定，于是买了 10 张，结果买入后暴跌，亏了 800 多刀，他那天也亏了 48 万（u 还是港币我忘了），结果接下来的几天每天都赚，逆势行情也能翻倍。", "lesson": "把亏损拆成观点、仓位、工具、期限和执行错误，复盘必须转成下一次可检查规则。"}, {"id": "36302119", "author": "股神小顾", "date": "2025-11-13", "title": "股票实盘 P80:又赌输了", "chars": 630, "read": true, "has_note": true, "themes": ["6969", "9992", "CRWV", "OSCR", "HIMS", "DUOL", "CRCL", "SBET", "NVDA", "HPPD"], "source": "https://longbridge.cn/zh-CN/topics/36302119", "path": "library/36302119.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "不该玩小票，不该抄底小票，不该融资，更不该融资抄底小票 多邻国，330 建仓，现在 180 思摩尔，19 建仓，现在 13 泡泡玛特，270 建仓，现在 215 crcl，210 建仓，现在 86 两倍 crcl，20 建仓（我认为不会跌到 140 以下），现在 5 块钱 sbet，19.5 建仓，现在 11 mstr，360 建仓，现在 220 mstu，5 块钱建仓，现在 2 块 这些弱票，向下突破玩出了气吞万里如虎的气势，其实也是我的错，光看到高点有多高，没看到低点有多低，以为跌个 30% 就能抄底了，没想到底下还有底 因为这种弱票本来就没共识，涨的时候利好不断人人吹，一旦跌下来就墙倒众", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "36228466", "author": "lyhalfway", "date": "2025-11-11", "title": "BMNR 极值推演 11.11", "chars": 659, "read": true, "has_note": true, "themes": ["NVDA", "BMNR", "BMNRD", "PLTR"], "source": "https://longbridge.cn/zh-CN/topics/36228466", "path": "library/36228466.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "上周有一系列事件值得注意，先是周四传出一个彭博系统的截图，显示 ARK 减持 500 万股 BMNR，造成一定市场恐慌，直到收盘后官号辟谣，消息源才解释说是系统数据错误。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "36173845", "author": "京城Z先生", "date": "2025-11-09", "title": "美股实盘-20251109：除了黄金，都不放心", "chars": 3031, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "NEM", "BRK.B", "BRK.A", "LITE", "NVDA", "AAPL", "MU"], "source": "https://longbridge.cn/zh-CN/topics/36173845", "path": "library/36173845.html", "classification": "平台长文；原创性未逐篇认证", "core": "AI 末日战车已经几乎绑定了美国科技的一切，存储板块更是该领域的龙头一哥，不停涨，涨不停，虽然算估值当下价格都不是很安全，但是市场 fomo 了，不参与就很难跟上行情，一直没有像样的回调，想上车都很难，闪迪无法估值全靠信仰，美光相对基本面稍微好一点，如果有个像样的回调，我可能会上车一部分仓位，目前还是只敢投机不敢格局，恐高。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "35956211", "author": "lyhalfway", "date": "2025-11-04", "title": "BMNR 极值推演 11.4", "chars": 851, "read": true, "has_note": true, "themes": ["PLTR", "ETHE", "BMNR", "BMNRD", "SBET"], "source": "https://longbridge.cn/zh-CN/topics/35956211", "path": "library/35956211.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "结论：若 ETH 反弹至 4.2k，mNAV 回升至 1.4，对应股价 56；若 ETH 重新回调至 3.45k，mNAV 维持 1.2，对应股价 40，结论是极致区间为 40～56  很多人关注我是因为 PLTR，PLTR 我从去年 q4 开始拿，40 到 60，80 到 60，120 到 60，180 到 140 的过山车都坐过，这并不妨碍 PLTR 现在到了 200。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "35891261", "author": "京城Z先生", "date": "2025-11-02", "title": "美股实盘-20251102：继续减仓科技，加仓黄金", "chars": 2992, "read": true, "has_note": true, "themes": ["AMZN", "NVDA", "SSNGY", "LITE", "NEM", "MS", "META", "AMD", "ORCL", "HESAY", "OpenAI", "DXYZ"], "source": "https://longbridge.cn/zh-CN/topics/35891261", "path": "library/35891261.html", "classification": "平台长文；原创性未逐篇认证", "core": "2025-11作者两周内将科技权重从40%降至约10%，NVDA减半、清爱马仕，买GLD并增NEM。披露NEM25.4%+GLD21.9%，加密ETF约26.9%，债/现金15.2%；解释为科技超买、黄金回调后高切低，并准备观察MU/SNDK而不追涨。", "lesson": "这不宜概括为简单分散防守，而是更大幅的跨资产集中押注：黄金及矿股合计47.3%，两者共有金价风险，矿股还带成本和运营风险。愿意减仓锁定利润值得看，但“回调过就坠机低”缺估值/波动证据。文中亚马逊投资计收入、AMD提前认营收等属于未验证指控，不可当会计事实；需查官方报表才能引用。"}, {"id": "35887787", "author": "股神小顾", "date": "2025-11-02", "title": "不做局外人", "chars": 804, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/35887787", "path": "library/35887787.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "有才就有现金流，有现金流就能定投补仓，还会计较眼前的几个得失吗？", "lesson": "按共同因子合并风险，现金和底仓需明确职责与上限。"}, {"id": "35837188", "author": "老板的老板 AI Exec", "date": "2025-10-31", "title": "晶泰科技 VS RXRX", "chars": 14624, "read": true, "has_note": true, "themes": ["RXRX", "PFE", "2228"], "source": "https://longbridge.cn/zh-CN/topics/35837188", "path": "library/35837188.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "对于投资者而言，需根据自身风险偏好和投资期限权衡：**如果相信AI有望催生革命性新药且愿意承担研发布局风险，Recursion或许提供了低估的布局机会；如果更看重AI技术中短期内对制药产业效率的提升并期望较快看到业绩回报，晶泰科技作为盈利成长股可能更为契合。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "35772659", "author": "輸棟樓的韭菜", "date": "2025-10-30", "title": "微软换Google：长期看好与当下不买可以并存", "chars": 1267, "read": true, "featured": true, "featured_reason": "相对价值｜仍看好微软，却因谷歌当时的价格与竞争位置更有吸引力而换仓；好公司和好买价需要分开判断。", "has_note": true, "themes": ["GOOG", "GOOGL", "AAPL", "MSFT", "ASML"], "source": "https://longbridge.cn/zh-CN/topics/35772659", "path": "library/35772659.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "2025-10复述Azure曾被市场误读为依赖OpenAI独占，后续多模型竞争使Google全栈和追赶优势显现。自述5月把微软全部转Google，类似2024将微软换到150—170苹果；仍认可微软长期，但当价缺乏相对吸引力。", "lesson": "规则是同一优质公司池内比较价格与风险，而非永久忠于持仓。其称套利实际是有风险的相对价值配置，非锁定收益。市值排名超越就减仓仍偏粗略，应另有每股现金流和回报差距的量化阈值。"}, {"id": "35712873", "author": "老板的老板 AI Exec", "date": "2025-10-29", "title": "Lemonade 业务第四问：AI 与业务", "chars": 4761, "read": true, "has_note": true, "themes": ["IPEX", "LMND", "QS", "ON", "MAYAR", "MAYAU"], "source": "https://longbridge.cn/zh-CN/topics/35712873", "path": "library/35712873.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "( McKinsey & Company ) 投资落点建议（基于以上事实） 如果你在评估 长期持有 ，建议把 AI 叙事具体化为以下「可验指标」： GLR（含 LAE%）维持 ≤72% 、并在灾损季度后 快速均值回归 ； 车险 ：转化率改善能否在 净赔付率与续保质量 上持续兑现； Opex（不含 Growth）/IFP 继续下台阶（自动化带来的人均产能提升）； QS 降至 20% 后 ， 净保费留存→毛利 的提升是否抵消 波动加大 ； 现金流/融资成本 ：在高 Growth spend 周期保持 **（调整后）自由现金流为正 ** 或接近持平。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "35712148", "author": "老板的老板 AI Exec", "date": "2025-10-29", "title": "Lemonade 有关人的事情：", "chars": 2870, "read": true, "has_note": true, "themes": ["COO", "HSBA", "5", "LMND", "FVRR", "CTO", "HSBC", "HSHD", "CTO-A"], "source": "https://longbridge.cn/zh-CN/topics/35712148", "path": "library/35712148.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "四、海外媒体的综合画像（“讲故事” 的几种版本） 成长/拐点叙事 ：如 Insurance Business / Reinsurance News 把 2025 年的再保结构调整与现金流改善解读为 “由外包风险向自留利润” 的转折。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "35699673", "author": "奥斯汀成长股实验室", "date": "2025-10-29", "title": "和私募老友长聊: 投资人是否需要开私募，以及对现阶段美股 A 股 Crypto 看法", "chars": 1067, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/35699673", "path": "library/35699673.html", "classification": "原创分析或复盘长文", "core": "作者记录与私募朋友讨论：经营基金要按人员和组织成本算商业账；美股方面，降息令资本便宜，热钱推动 AI 基建投入，产业与资金周期互相影响，但股价已计入部分预期。若 OpenAI 增速明显放缓，可能需要重新判断 AI 周期；Crypto 部分呈现圈内周期观点及可能先腰斩后新高的情景，没有确定预测或真实交易。", "lesson": "值得迁移的是把需求增长与融资条件放入同一模型：融资驱动的扩张可能放大订单，也可能放大下行。OpenAI 是观察线索而非唯一否证指标；对话中的基金开支和币价观点不能当成普遍规律或作者已执行的仓位。"}, {"id": "35693444", "author": "老板的老板 AI Exec", "date": "2025-10-28", "title": "一份面向长期投资的 Lemonade（NYSE: LMND）深度分析", "chars": 3297, "read": true, "has_note": true, "themes": ["LMND", "CHWY"], "source": "https://longbridge.cn/zh-CN/topics/35693444", "path": "library/35693444.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Request for GPT-5 Pro Reasoned for 21m 1s 一句话结论 $Lemonade(LMND.US) Lemonade 正在从 “高速增长但高度再保险外包” 的阶段，迈向 “更多自留风险、盈利弹性更大” 的阶段： 核心经营指标（损失率、毛利、现金流）持续改善 ，同时 再保比例从 55% 大幅降至 20% 将提高收入留存与中长期利润杠杆；但这也意味着业绩波动更大 ，且估值已反映一定预期（约 4.5× 2025E 销售/P/S，3.23× EV/S ）。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "35679855", "author": "老板的老板 AI Exec", "date": "2025-10-28", "title": "Prenetics / 晶泰 新闻核实：", "chars": 3186, "read": true, "has_note": true, "themes": ["ABTC", "GBTC", "SBET", "2228", "H", "BTC", "BTDR", "PRE", "EXOD", "PRENW"], "source": "https://longbridge.cn/zh-CN/topics/35679855", "path": "library/35679855.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "投资者团队 ：投资者包括多家知名机构和个人，如加密交易所 Kraken、American Ventures、Exodus（NYSE: EXOD）、晶泰科技（XtalPi Holdings，香港上市代码$晶泰控股 (2228.HK)，市值约 60 亿美元，是量子物理、AI 和制药领域的创新者）、DL Holdings（1709.HK）、GPTX（由比特大陆创始人 Jihan Wu 领导）、Bitdeer Technologies Group（NASDAQ: BTDR）等。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "35606907", "author": "京城Z先生", "date": "2025-10-26", "title": "美股实盘-20251026：达到短期目标价，大幅减仓", "chars": 3475, "read": true, "has_note": true, "themes": ["300024", "AAPL", "HESAY", "NEM", "603020", "VIOT", "INTC", "GOOG", "GOOGL", "NVDA", "LITE", "300308"], "source": "https://longbridge.cn/zh-CN/topics/35606907", "path": "library/35606907.html", "classification": "平台长文；原创性未逐篇认证", "core": "Developer Tools & Technologies 开发者工具升级：CUDA、TensorRT、生成式 AI SDK，手把手教你降低 AI 部署门槛； Physical AI & Robotics 物理 AI 与机器人：数字孪生、模拟环境加持，机器人如何学会「学习、规划、交互」？", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "35559206", "author": "股神小顾", "date": "2025-10-24", "title": "江西夜生活", "chars": 1486, "read": true, "has_note": true, "themes": ["CRCL"], "source": "https://longbridge.cn/zh-CN/topics/35559206", "path": "library/35559206.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "这会儿已经是十点多，我偶尔看看股票，但是所有股票都被深度套牢，融资又满了，根本没法操作，于是安心玩。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "35476441", "author": "股神小顾", "date": "2025-10-22", "title": "九华悟道", "chars": 936, "read": true, "has_note": true, "themes": ["9618", "6969", "CRCL", "SBET", "MSTR", "9992", "ABTC", "GBTC", "DUOL", "1810", "2015", "89618"], "source": "https://longbridge.cn/zh-CN/topics/35476441", "path": "library/35476441.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "小米，54 建仓，49 补仓，套的不深，既然是内部消息，既然觉得小米未来会涨三倍，既然相信她，怎么能因为回调就动摇呢，哪怕小米真的跌到 8 块钱然后涨到 180，再见她时，我不更有理由大吹特吹，你看当年小米跌到 8 块我都拿住了哦，我百分百相信你哦 crcl，一直在低位震荡，既然炒作过故事，还有很多人相信故事，那我等风来就可以了 sbet，mstr，固然已经成了币圈的弃子，但是币圈现在不可能是最高位，以后还有新高，汤我是能喝的，千惨万惨，我有那些杠杆爆仓的人惨吗？", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "35428429", "author": "lyhalfway", "date": "2025-10-21", "title": "BMNR 极值推演 10.21", "chars": 790, "read": true, "has_note": true, "themes": ["MSTR", "BTC", "BMNR", "BMNRD", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/35428429", "path": "library/35428429.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "DAT 确实存在泡沫，80% 的 DAT 公司溢价低于 1，更直白的说这个泡沫已经崩了，中尾部被并购/出局淘汰，头部虹吸市场的大部分流动性（BMNR&MSTR 合计占据 88% 的 DAT 公司交易量），这就是行业洗牌。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "35378686", "author": "京城Z先生", "date": "2025-10-19", "title": "美股实盘-20251019：被特师傅调戏的一周", "chars": 3004, "read": true, "has_note": true, "themes": ["NVDA", "1810", "TSM", "GOOG", "GOOGL", "VIOT", "QMMM", "LITE", "HESAY", "NEM", "MSTR", "TACO"], "source": "https://longbridge.cn/zh-CN/topics/35378686", "path": "library/35378686.html", "classification": "平台长文；原创性未逐篇认证", "core": "复盘： 先说交易，云米科技当初看上它的是破净了，觉得应该能捡个垃圾，结果持有后交易量太低就算了，还一直阴跌，而作为小米链的公司，还受小米影响，最近雷军舆论大翻车，小米都从 6x 跌到 4x 了，米链的云米自然也同步坠机，本周正式跌破关键支撑，触发止损。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "35346418", "author": "老板的老板 AI Exec", "date": "2025-10-17", "title": "Rocket Lab 与 SpaceX 猎鹰系列竞争的情况和优势的总结", "chars": 1300, "read": true, "has_note": true, "themes": ["RKLB", "TSLA", "DXYZ"], "source": "https://longbridge.cn/zh-CN/topics/35346418", "path": "library/35346418.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "以下是关于 Rocket Lab 与 SpaceX 猎鹰系列竞争的情况和优势的总结： 竞争背景：猎鹰 9 号的 “运力浪费” 问题 Rocket Lab 通过中子火箭瞄准的市场机会，源于猎鹰 9 号对于许多商业客户而言存在 “运力过剩” 和成本高昂的问题： 运力不匹配 ：在目前的商业发射市场中，许多客户需要的运载能力超过了小型火箭的上限，但又用不到猎鹰 9 号（Falcon 9）的最大载荷能力（可重复使用配置下，运载能力为 17.5 吨；最大运载能力为 22.8 吨）。", "lesson": "复盘应转成下次可执行规则，亏损后不以加杠杆或改目标逃避失效。"}, {"id": "35288253", "author": "老板的老板 AI Exec", "date": "2025-10-16", "title": "四大美国银行 Q3 2025 财报总结及帖子结论验证", "chars": 1346, "read": true, "has_note": true, "themes": ["WFC", "BAC", "JPM", "300941", "TSM", "C", "HOOD", "TSLA", "COIN", "WFC-A", "WFC-C", "WFC-D"], "source": "https://longbridge.cn/zh-CN/topics/35288253", "path": "library/35288253.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "当时危机源于次贷崩溃、资本缓冲不足和高杠杆，而今《多德 - 弗兰克法案》和《巴塞尔 III》改革要求更高资本质量和压力测试，导致： 高资本比率 ：普通股一级资本（CET1）比率远超监管最低要求（4.5% 加缓冲）。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "35265159", "author": "股神小顾", "date": "2025-10-16", "title": "股票实盘 P60:怎么才能做到知行合一？", "chars": 581, "read": true, "has_note": true, "themes": ["SBET", "CRCL", "SBUX", "MRNA", "2391", "9618", "2015", "NYSE", "TUYA", "JD", "89618", "LI"], "source": "https://longbridge.cn/zh-CN/topics/35265159", "path": "library/35265159.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "不知不觉，60 个交易日了 感谢自己能活下来 60 天，但愿还能活 600 天，6000 天，要是有可能的话，6 万天，不知道 600 天后会是什么样呢 我是没办法预测未来的，只能预判，星巴克 80 块，京东 32 块，理想 23 块，都是我认为很低的价格，值得重仓拿住起飞，当时我发出来的时候，很多人认为到不了这个价 而前几天京东 31 块，理想 22 块，星巴克 78 块的时候，可以说是难得的机会，几个月等一次，但我不但没加仓，反而把星巴克卖了一些，而这几天，这三个票都反弹了 为什么知行不能合一呢？", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "35175432", "author": "lyhalfway", "date": "2025-10-14", "title": "BMNR 极值推演 10.14", "chars": 765, "read": true, "has_note": true, "themes": ["MSTR", "BMNR", "BMNRD", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/35175432", "path": "library/35175432.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "经历上周的风波，我对 DAT 的商业模式更加认可了，再重复下之前聊过的观点：  DAT 提供了一种介于合约（高杠杆/易爆仓）和现货/ETF（线性跟随）之间的杠杆选择：1. 加密资产暴跌时利用溢价融资低价买币；2. 在溢价低于 1 时回购股票，也相当于折价买入资产，但这要很强的操盘能力，能够在晴天备好雨伞 但这种模式只适用于能保持溢价和流动性的头部，因为头部公司会虹吸整个市场的流动性，加倍放大领先优势。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "35105192", "author": "京城Z先生", "date": "2025-10-12", "title": "美股实盘-20251012：重大利空，结账还是抄底？", "chars": 2528, "read": true, "has_note": true, "themes": ["MSTR", "CHKP", "LAC", "603020", "AAPL", "LITE", "VIOT", "NVDA", "HESAY", "BBAI", "STRC", "STRD"], "source": "https://longbridge.cn/zh-CN/topics/35105192", "path": "library/35105192.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 清仓 CHKP，买入等额 纽蒙特矿业（代码 NEM，下同） 持仓： 大饼 ETF 24.1%，二饼 ETF 6.1%，LITE 20.5%，英伟达 20.6%，爱马仕 8.3%，云米 6.4%，NEM 14.1%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "35107636", "author": "老板的老板 AI Exec", "date": "2025-10-12", "title": "特斯拉的确定性来源", "chars": 2074, "read": true, "has_note": true, "themes": ["TSLA", "GOOG", "GOOGL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/35107636", "path": "library/35107636.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "） 结论（给你一个 “投资者式” 的判断） 你的核心逻辑是成立的 ：从 “这是一道数学题” 的角度看， 数据规模 + 训练算力 + 端到端范式 ，特斯拉确实具备全球最完整的要素组合之一，也在持续加码（Cortex 集群、外购 GPU、软硬结合）。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "34923438", "autho dge.cn/zh-CN/topics/34235679", "path": "library/34235679.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "主要问题还是我对这票没信仰，不然就拿着了） fig，这个票我最后补仓在 59，后面没补了，但是卖了三张 put，收了点权利金，这个票市值 300 亿以下不会被套，我有这个信心，但是我的仓位都在 300 亿市值以上，无奈，慢慢熬吧 blsh，这个票我完全不懂，69 块钱建仓，死拿着，也快解套了，有点小插曲，本来财报能赚很多的，结果财报日期错了，我提前两天布局，血亏几千 sbet，19.5 的本，500 股，没补仓，没做套，回本我就走，这应该是最弱的币股，不建议任何人玩，我甚至想等这周五我卖的 call 解锁，我就割肉，跟跌不跟涨，没有溢价，任何利好都没有的股票，实在是没有价值，而且市值严谨地说，", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "34077530", "author": "老板的老板 AI Exec", "date": "2025-09-16", "title": "Gemini Space Station, Inc.（GEMI.US）美国业务调研报告", "chars": 17461, "read": true, "has_note": true, "themes": ["GEMI"], "source": "https://longbridge.cn/zh-CN/topics/34077530", "path": "library/34077530.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "下表总结了公司最近两年的关键财务数据，并概述2022年的情况： 财务指标 2022年(估算) 2023年 2024年 营业收入 ~$1.78亿美元 $0.981亿美元 financemagnates.com financemagnates.com $1.422亿美元 financemagnates.com financemagnates.com 营收增长率 — -44.9%（同比下降） stockanalysis.com +45%（同比上升） financemagnates.com 净利润（净亏损） 负值 （未公开） -$3.197亿美元 sec.gov -$1.585亿美元 sec.gov ", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "34092191", "author": "lyhalfway", "date": "2025-09-16", "title": "PLTR 基本面追踪-AIPCon8", "chars": 709, "read": true, "has_note": true, "themes": ["PLTR"], "source": "https://longbridge.cn/zh-CN/topics/34092191", "path": "library/34092191.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我们将其他公司在财报电话会议中提及 PLTR 的存在视为 PLTR 作为 AI 解决方案领导者地位的备受认可的证明         2 Ontology 优势 Ontology 扩展得越多，就越容易为客户创建专属的特定用例，这些定制化应用就像公司独特优势的放大器。", "lesson": "把技术、采用、合同、收入、利润和融资里程碑分层核验。"}, {"id": "34004457", "author": "股神小顾", "date": "2025-09-15", "title": "股票实盘 P37:又见黑天鹅", "chars": 627, "read": true, "has_note": true, "themes": ["SBUX", "SNPS", "603220", "603605", "NVO"], "source": "https://longbridge.cn/zh-CN/topics/34004457", "path": "library/34004457.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "连续亏了两周，这周总算赚钱了，虽然是亏两天赚三天，但总体还是赚钱的，复盘一下这周的操作 1.低位抄底中贝通信，吃三个点后切换珀莱雅 第一个操作  业务分部分析与竞争地位评估 财务表现与增长驱动力分析 2 年财", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "33960794", "author": "老板的老板 AI Exec", "date": "2025-09-12", "title": "特斯拉 (TSLA) 长期基本面分析报告 by Tom", "chars": 4253, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/33960794", "path": "library/33960794.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "关键结论： 技术领先地位稳固： 在电动汽车、自动驾驶和能源存储领域保持技术优势 财务表现稳健： 营收增长强劲，现金流改善，但利润率面临压力 估值挑战： 当前股价较 DCF 内在价值溢价显著，反映市场高预期 长期增长驱动： FSD 商业化、机器人技术、能源业务构成长期价值支柱 投资建议：持有 - 长期看好技术护城河，但建议等待更好的估值入场时机 1. 公司长期战略分析 1.1 电动汽车市场的长期增长潜力 全球电动化趋势： 预计到 2030 年，电动汽车将占全球新车销售的 30-40% 政策支持： 各国碳中和目标推动电动化进程，中国、欧洲、美国政策利好 市场渗透率： 当前全球电动汽车渗透率约 15", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "33959427", "author": "老板的老板 AI Exec", "date": "2025-09-12", "title": "英伟达 (NVIDIA) 投资分析报告 by Tom", "chars": 2925, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/33959427", "path": "library/33959427.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "5. 风险因素评估 5.1 高估值风险（高风险） 当前估值水平处于历史高位 任何业绩不及预期都可能引发大幅回调 市场预期过于乐观 5.2 竞争加剧风险（中高风险） 云厂商自研芯片进度超预期 AMD 技术追赶速度快于预期 新竞争对手进入市场 5.3 地缘政治风险（中风险） 对中国市场出口限制 中美科技竞争加剧 国际贸易政策变化 5.4 技术颠覆风险（中风险） 新 AI 架构降低对 GPU 需求 算法效率提升减少算力需求 量子计算等颠覆性技术 5.5 宏观经济风险（中风险） 经济衰退影响 IT 支出 利率上升影响成长股估值 美元走强影响海外收入 6. 预测结论 6.1 目标价格区间 基于基本面分析", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "33932595", "author": "股神小顾", "date": "2025-09-12", "title": "股票实盘 P36:蓄势待发 单日最大盈利", "chars": 638, "read": true, "has_note": true, "themes": ["SNPS"], "source": "https://longbridge.cn/zh-CN/topics/33932595", "path": "library/33932595.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "这应该是确定性最强的一件事——要是前天看到 SNPS 跌这么多，肯定买 call；甚至我昨天都想好了，买几万块钱的 call 拿着，结果根本没给机会，夜盘就上去了。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "33844958", "author": "老板的老板 AI Exec", "date": "2025-09-10", "title": "TLGY & Ethena，细节说明：", "chars": 1527, "read": true, "has_note": true, "themes": ["USDEW", "TLGYF", "TLGUF"], "source": "https://longbridge.cn/zh-CN/topics/33844958", "path": "library/33844958.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "融资支持 ：初始 PIPE（私募股权投资）融资约 3.6 亿美元（包括 Ethena 基金会贡献的 6000 万美元），随后追加 5.3 亿美元，总融资达 8.9 亿美元。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "33832129", "author": "lyhalfway", "date": "2025-09-10", "title": "PLTR 基本面追踪 - UBS 调研", "chars": 823, "read": true, "has_note": true, "themes": ["PLTR", "客户调研", "样本偏差", "UBS"], "source": "https://longbridge.cn/zh-CN/topics/33832129", "path": "library/33832129.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "转述UBS客户访谈，强调PLTR在业务工作流中的嵌入、业务部门预算和扩张潜力；一位大客户预计未来3–5年支出增长35%，并与Foundry/AIP替代方案作比较。", "lesson": "客户实际场景比抽象技术口号更有用，但可能属于前十大客户的受访者不能代表全体客户；访谈未取得原始券商报告，不宜当独立验证。需跟踪新客户部署时长、留存和预算扩张，而非把单客计划外推收入。"}, {"id": "33775861", "author": "老板的老板 AI Exec", "date": "2025-09-09", "title": "Tom：晶泰科技的综合性分析报告", "chars": 1076, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/33775861", "path": "library/33775861.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Tom，是我最新训练的 Agent，通过 Claude Code 来执行； 基于我全新的量化分析能力，以下是晶泰科技 $晶泰控股(02228.HK) 的 综合性分析报告 ： 🎯 晶泰科技 6-12 个月价格预测 📊 核心预测结果 - 当前价格 : 10.68 HKD - 6 个月目标 : 14.00 - 18.00 HKD (+31% to +69%) - 12 个月目标 : 18.00 - 24.00 HKD (+69% to +125%) - 概率加权目标 : 20.50 HKD (+92%) 🧮 多模型融合估值 1. DCF 模型 (22.40 HKD) - 贴现率: 12.5% (科技", "lesson": "复盘应转成下次可执行规则，亏损后不以加杠杆或改目标逃避失效。"}, {"id": "33732067", "author": "lyhalfway", "date": "2025-09-08", "title": "BMNR 极值推演 0908", "chars": 770, "read": true, "has_note": true, "themes": ["BMNR"], "source": "https://longbridge.cn/zh-CN/topics/33732067", "path": "library/33732067.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "同时注意到 BMNR 参与了一家新的 treasury 公司 OCTO 的 PIPE 融资，OCTO 的董事长是 Dan Ives，经常关注券商分析的应该知道他是 AI 板块的超级大多头，极度看好 NVDA/PLTR/TSLA 等 AI 相关公司，这好像是最近华尔街搞的新套路，有影响力的明星华尔街分析师 +Crypto treasury 公司。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "33710856", "author": "京城Z先生", "date": "2025-09-07", "title": "美股实盘-20250907：消费月，有果子吃", "chars": 2281, "read": true, "has_note": true, "themes": ["VIOT", "HESAY", "NVDA", "AAPL", "LITE"], "source": "https://longbridge.cn/zh-CN/topics/33710856", "path": "library/33710856.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 卖出 50% 苹果 买入等额 LITE 持仓： 英伟达 19.8%，苹果 10.7%，大饼 ETF 24.3%，爱马仕 8.9%，云米 7.4%， LITE 11.6%，TLT 17.4%。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "33711846", "author": "老板的老板 AI Exec", "date": "2025-09-07", "title": "🧬 晶泰科技 (2228.HK)    深度投资分析报告", "chars": 2301, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/33711846", "path": "library/33711846.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "🧬 晶泰科技 (2228.HK) $晶泰控股(02228.HK) 深度投资分析报告 📊 执行摘要 报告时间 : 2025-09-07 19:45 SGT 股票代码 :$晶泰控股 (2228.HK) 当前价格 : 10.68 HKD 投资建议 : 买入 (Strong Buy) 目标价格 : 24.43 - 53.54 HKD 潜在涨幅 : +129% 至 +401% 风险等级 : 中等 🎯 关键投资要点 ✅ 积极因素 技术面强势 : 股价突破所有关键均线，相对 200 日均线涨幅达 +82.6% 行业地位 : AI 药物研发领域领导者，技术护城河深厚 增长前景 : 生物科技行业长期增长趋势明确", "lesson": "复盘应转成下次可执行规则，亏损后不以加杠杆或改目标逃避失效。"}, {"id": "33707621", "author": "不奋东西", "date": "2025-09-06", "title": "美国及欧盟主要稀土公司分析（Grok AI ）", "chars": 3822, "read": true, "has_note": true, "themes": ["MP", "卖put", "回本心理", "AI来源"], "source": "https://longbridge.cn/zh-CN/topics/33707621", "path": "library/33707621.html", "classification": "本人短复盘+明确标注Grok生成的行业长文", "core": "开头本人反省浮盈回吐、期权止损过激和反弹后冲动买入；仍计划55–60补股，并考虑卖55 put把收益转正。随后为明确标注Grok AI的稀土行业长篇综述，附无可复核模型的目标价概率与回本建议。", "lesson": "原创可学部分是承认情绪反复；真正反证是用新卖put解决旧亏损的心理账户。行业重要性不等于当前期权划算，新增义务需独立定价。AI部分有大量未核数据和无依据概率，不计作者原创深度研究，也不能把“有回本潜力”当风险评估。"}, {"id": "33612149", "author": "老板的老板 AI Exec", "date": "2025-09-04", "title": "模版：【晶泰科技 · 长桥维基】关键事实与资料导航（长期置顶/共建/更新）", "chars": 2701, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/33612149", "path": "library/33612149.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "目录 一页速览（Factsheet） 业务与技术栈 客户与合作里程碑（时间线） 股权结构与主要股东（动态） 公告与披露入口 常用链接与 的过去赢过一次不能提高下一次交易胜率。"}, {"id": "31739491", "author": "老板的老板 AI Exec", "date": "2025-07-12", "title": "没有其他选择---Steve Eisman", "chars": 1243, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/31739491", "path": "library/31739491.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "问题所在 欧债（德法等） ❌ 市场规模太小、信用分散 日债 ❌ 利率太低、负收益甚至倒挂 中债（中国国债） ❌ 汇率不可自由兑换、资本管制 黄金 ❌ 没有收益、不易交易 加密资产 ❌ 波动剧烈、无法律保障 ▶ 所以， 你可能不喜欢美债，但你离不开它。", "lesson": "按共同因子合并风险，现金和底仓需明确职责与上限。"}, {"id": "31502090", "author": "京城Z先生", "date": "2025-07-06", "title": "美股实盘-20250706：补仓 2 只加密影子股", "chars": 2426, "read": true, "has_note": true, "themes": ["KNW", "CEP"], "source": "https://longbridge.cn/zh-CN/topics/31502090", "path": "library/31502090.html", "classification": "平台长文；原创性未逐篇认证", "core": "3、英伟达 除了微软，另一个最可能达到 4 万亿市值的就是达子。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "31445166", "author": "老板的老板 AI Exec", "date": "2025-07-03", "title": "一个投资观点的探讨：", "chars": 1490, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/31445166", "path": "library/31445166.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我也仔细读读这个： 对观点的系统评估 维度 支持论据 关键风险 总体判断 电力缺口与 AI 用电 • DOE 预计 2028 数据中心耗电占全美用电 6.7–12%（2023 为 4.4%）( reuters.com ) • PJM“低新建” 情景下，储备率将从 2023 年的 23% 跌至 2030 年的 5–8% ( utilitydive.com ) • ERCOT 最新 CDR 报告显示 夏季储备率 2030 或仅 10–12%（低于 13.75% 可靠性红线）( ercot.com ) • 模型假设差异大，若储能/需求响应落地提速，缺口将被部分弥补 • 数据中心选址可迁移至低电价州，", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "31416523", "author": "lyhalfway", "date": "2025-07-03", "title": "AI 广告价值链梳理", "chars": 606, "read": true, "has_note": true, "themes": ["AI广告", "META", "GOOGL", "指标口径", "GS", "GOOG", "GS-A", "GS-C", "GS-D"], "source": "https://longbridge.cn/zh-CN/topics/31416523", "path": "library/31416523.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "文章转述高盛与专家观点，把AI广告分为创意生成、推荐和投放优化，关注META Advantage+、Google PMax以及对下一季度的催化，列出若干效率提升比例。", "lesson": "广告主ROAS、广告转化率和平台收入增长分母不同，不能混用20%一类数字来推算财报。将行业访谈变成投资预期前，需要公司口径、渗透率和增量收费的连接。"}, {"id": "31296692", "author": "老板的老板 AI Exec", "date": "2025-06-30", "title": "AI 技术在中国创新药研发中的作用及晶泰科技的核心优势分析", "chars": 2937, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/31296692", "path": "library/31296692.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "一、AI 在药物研发各阶段中的应用概览（中国现状） AI 技术已经广泛应用于药物研发的多个阶段，中国制药行业在这些领域正迅速赶超国际先进水平： 1.1 靶点发现与验证 中国药企利用 AI 分析大规模基因组、转录组、蛋白组等数据集，显著提升靶点识别效率和准确性。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "31292585", "author": "老板的老板 AI Exec", "date": "2025-06-30", "title": "中国在全球创新药物领域的地位与影响深度分析", "chars": 7860, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/31292585", "path": "library/31292585.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "有统计显示，过去五年美国市场上的典型新药许可协议总成本平均为 84.8 亿美元，而在中国这一数字约为 31.3 亿美元（包括里程碑付款等总成本），反映出中国药物资产的估值和开发费用相对较低。", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "31304767", "author": "SpaceM", "date": "2025-06-30", "title": "RoboTaxi，特斯拉 “第二条增长曲线” 的正式开启，迈向成为世界上最具价值的公司", "chars": 903, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/31304767", "path": "library/31304767.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "周末发生的两件事，RoboTaxi 商业化落地 + 新车自动驾驶（FSD）交付给客户家中，这意味着特斯拉正从一家单纯的汽车销售公司，彻底转型为一家运营 AI 的公司。 从传统车企转向科技/出行服务公司，估值逻辑要变 奥斯汀是盈利模式的 “试金石”： 虽然 RoboTaxi 刚推出时成本高，收费也只是象征性的。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "31279730", "author": "京城Z先生", "date": "2025-06-29", "title": "美股实盘-20250629：高仓债券，低仓博弈", "chars": 2959, "read": true, "has_note": true, "themes": ["CEP", "AEVA", "AEVAW"], "source": "https://longbridge.cn/zh-CN/topics/31279730", "path": "library/31279730.html", "classification": "平台长文；原创性未逐篇认证", "core": "因此，如果雷达行业有后续行情，那么 Aeva 应该是超过禾赛和 Ouster 的，强势顺周期股回踩 5 日支撑 28 买入，对照 Ouster 合理市值 15 亿时股价涨幅卖出（39），就这么简单计算的，我认为有超过 20%+ 的中短期套利机会，没想到一周内就兑现了？", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "31172736", "author": "老板的老板 AI Exec", "date": "2025-06-26", "title": "有谁能完善这个表格？我记得还是有一些外面的数据", "chars": 1902, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/31172736", "path": "library/31172736.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "参与者名称 持股数量 持股比例 (%) 标注 CHINA SECURITIES DEPOSITORY AND CLEARING 679,181,593 16.89% MM 集中营 CHINA SECURITIES DEPOSITORY AND CLEARING 657,184,233 16.34% MM 集中营 FUTU SECURITIES INTERNATIONAL 439,726,788 10.93% UBS SECURITIES HONG KONG LTD 432,858,379 10.76% 团队为主 THE HONGKONG AND SHANGHAI BANKING 325,030", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "30998655", "author": "老板的老板 AI Exec", "date": "2025-06-23", "title": "问：详细介绍 DoveTree LLC 的背景。并仔细分析这个公告中披露的内容对 晶泰科技这个公司的长期意义。", "chars": 1959, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/30998655", "path": "library/30998655.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "二、公告要点与 “常规大药企交易” 对比 条款 晶泰-DoveTree 传统 Big Pharma 与 AI 平台 首付款 1 亿美元 （10 日 + 180 日各 5,100/4,900 万） 通常 5000 万—1 亿美元 后续里程碑 “数十亿美元” (多靶点累计) 10—20 亿美元上限常见 权利划分 DoveTree 拥全球独家开发 + 商业化；晶泰获保底版税（个位数%） 接近 Insilico–Sanofi、Exscientia–BMS 结构 项目类别 小分子 + 抗体 同时委托 多数 AI 合作仅限小分子 法定进度 仅为 Term Sheet ，待 3 个月内签 Definitiv", "lesson": "把合同、融资、客户付款、收入确认与自由现金流分开，资本开支规模不自动等于供应商利润。"}, {"id": "30967809", "author": "京城Z先生", "date": "2025-06-22", "title": "美股实盘-20250622：黑天鹅再次降临", "chars": 1442, "read": true, "has_note": true, "themes": ["NXAT", "MSTR", "STRD", "STRF", "STRK", "CEP", "KWMWW"], "source": "https://longbridge.cn/zh-CN/topics/30967809", "path": "library/30967809.html", "classification": "平台长文；原创性未逐篇认证", "core": "kwm 与 naka 类似，是 \"期货版\" 加密影子股，目前还没有开始大规模买入，但是规划早就发出来了，预计将花费 5 亿美元购买大饼，而它的市值只有这个数字一半不到，肯定有一定操作空间，但确实不如现货版的踏实，所以只买了 4.5% 的仓位，而不是常规的 10%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "30894587", "author": "京城Z先生", "date": "2025-06-19", "title": "MSTR 宇宙股票清单", "chars": 707, "read": true, "has_note": true, "themes": ["NXAT", "MSTR", "NAKA", "NAKAW", "STRD", "STRF", "STRK", "KWMWW", "KNW", "CEP"], "source": "https://longbridge.cn/zh-CN/topics/30894587", "path": "library/30894587.html", "classification": "平台长文；原创性未逐篇认证", "core": "SBET，二饼 ETH 版 DFDV，三饼 SOL 版 SRM，TRX 版，孙割的 EYEN，HYPE 版 未完待续... $Strategy(MSTR.US) $K Wave Media(KWM.US) $Know Labs(KNW.US) $Cantor Equity Partners(CEP.US) $Nakamoto(NAKA.US)", "lesson": "同时检查币价、每股持币、融资稀释、负债与净资产溢价，不能只押方向。"}, {"id": "30748550", "author": "lyhalfway", "date": "2025-06-16", "title": "AI Agent 价值链梳理", "chars": 1278, "read": true, "has_note": true, "themes": ["AI Agent", "价值链", "GOOGL", "PLTR", "MS", "GOOG", "AMZN", "OKTA", "NET", "SNOW", "NOW", "MSFT", "MS-A", "MS-E"], "source": "https://longbridge.cn/zh-CN/topics/30748550", "path": "library/30748550.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "文章基于摩根士丹利研究梳理AI Agent六层：云基础设施、模型、安全治理、数据、工作流、端到端平台，偏好GOOGL与PLTR等跨层参与者，认为部分传统SaaS价值可能被侵蚀。", "lesson": "应保留其研究转述身份，券商原始报告未取得。跨层布局提供研究线索，不等于多份独立收入；云算力也面临投入、竞争和利润率风险，不能从卖铲子推出必胜。"}, {"id": "30731159", "author": "京城Z先生", "date": "2025-06-15", "title": "美股实盘-20250615：跳下开往幼儿园的车，再次空仓", "chars": 2373, "read": true, "has_note": true, "themes": ["KNW", "NAKA", "NAKAW", "CEP"], "source": "https://longbridge.cn/zh-CN/topics/30731159", "path": "library/30731159.html", "classification": "平台长文；原创性未逐篇认证", "core": "虽然这笔交易获利高达 150%，为总资产带来了高达 10%*150%=15% 的巨额增幅，但实际上本周净值只涨了 4%，主要就是因为 MSTR 宇宙的另外两只持仓股拉垮了，周一先手跌破我预设的关键支撑位，走出经典 Death Cross 图形，触发了 一键清仓止损，回吐了很大一波利润，所以虽然迎来了一波史诗级爆赚，但总盈利并没有特别炸裂。", "lesson": "同时检查币价、每股持币、融资稀释、负债与净资产溢价，不能只押方向。"}, {"id": "30729447", "author": "慢慢长大的南瓜", "date": "2025-06-15", "title": "小白学美股心得记录 31", "chars": 1072, "read": true, "has_note": true, "themes": ["交易系统", "持有周期", "仓位", "UNH"], "source": "https://longbridge.cn/zh-CN/topics/30729447", "path": "library/30729447.html", "classification": "作者分析与个人方法记录", "core": "2025年6月读海龟交易书后，提出按当前资产配置而非历史高点决定房产取舍；股票候选以大型科技为主，谁出现低位就买谁。将TLT、QQQ、SPY合为长期定投一类，计划约15%；自设总仓五至八成，入场看52周区间中点以下或历史跌势区域，并承认尚未掌握入场信号计算。", "lesson": "体现从追逐消息转向系统约束的尝试，但不能把自己的逢跌买入称为完整海龟系统。52周区间随样本窗口移动，不能表示内在价值；TLT与股票ETF驱动因素不同，合称长期定投不构成风险等价。原文“底仓30%涨幅再建仓”表述含混，不擅改成确定止盈规则。"}, {"id": "30539404", "author": "老板的老板 AI Exec", "date": "2025-06-10", "title": "美股期权 4×2×2 组合全景入门", "chars": 1663, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/30539404", "path": "library/30539404.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "二、设计一个「散户友好风险指数」（RSI≠技术指标） 评分 0–10 （0＝最低风险，10＝最高风险），按 4 个维度加权： 最大亏损潜力 (30 %) 时间衰减 / Gamma 敏感度 (25 %) 资金/保证金占用 (25 %) 到期被指派概率 & 执行复杂度 (20 %) 评分举例： 买进长期 Call → 最大亏损=权利金 (3/10)，时间衰减弱 (2/10)，保证金低 (1/10)，指派无义务 (0) → 加权≈ 2.0 /10 卖出短期裸 Call → 无限亏损 (10)，Gamma 剧烈 (8)，保证金高 (7)，被指派概率高 (7) → 8.4/10 三、8 种组合评分与说明", "lesson": "方向、期限、波动率和最大损失需匹配，权利金不是无成本收益。"}, {"id": "30484868", "author": "lyhalfway", "date": "2025-06-09", "title": "空间科技上新 - Voyager ipo", "chars": 556, "read": true, "has_note": true, "themes": ["EADSY", "RKLB", "VOYG"], "source": "https://longbridge.cn/zh-CN/topics/30484868", "path": "library/30484868.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "不同于 RKLB $Rocket Lab(RKLB.US)  专攻发射市场，Vogeger 重点在太空基建，包括空间站，太空通信等技术        最大的想象空间是空间站项目 Statlab，这个项目 Voyager 和空客成立了合资，Palantir 三菱 MDA Space 也参与合作，项目已获得 NASA 2.175 亿美元的 Space Act Agreement 资助，旨在替代国际空间站（ISS）。", "lesson": "区分合同总额、上限、增补、已执行和当期收入，避免重复相加或把订单等同利润。"}, {"id": "30469603", "author": "京城Z先生", "date": "2025-06-08", "title": "美股实盘-20250608：耐心等待", "chars": 2582, "read": true, "has_note": true, "themes": ["PBR", "PBR.A", "CEP", "MSTR", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/30469603", "path": "library/30469603.html", "classification": "平台长文；原创性未逐篇认证", "core": "3、英伟达 英伟达加速计算副总裁 Ian Buck 周三在美国银行全球科技大会的主题演讲中指出，DeepSeek 的 R1 推理模型 “实际上让所有模型都变成了推理模型”，从而推动了 AI 推理阶段的需求，也创造了部署更多 GPU 和服务器的机会。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "30421940", "author": "老板的老板 AI Exec", "date": "2025-06-06", "title": "美元稳定币全面渗透假设下的跨境收付体系重塑", "chars": 2707, "read": true, "has_note": true, "themes": ["CRCL"], "source": "https://longbridge.cn/zh-CN/topics/30421940", "path": "library/30421940.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "一、法律与金融结构：美元稳定币如何 “锁住” 底层美元 环节 传统美元 稳定币法案框架下的 USD-S 发行端 商业银行发放存款或美债货币化由美联储主导 发行人收到客户美元→托管于 合格储备账户 （Fed Master Account 或 FDIC 保险商业银行）→同步在链上铸币 储备归属 存款可再贷、M2 可乘数扩张 储备 100 % 受托隔离 不可二次放贷可投资于 T-Bill、RRP 等极低风险资产 赎回流程 同业清算或 CHIPS / Fedwire 烧毁 USD-S → 发行人指令托管行/货基账户向用户电汇 USD 要点 ： 美元基础货币 始终停留在美国监管视域之内；链上流通的只是美", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "30414480", "author": "老板的老板 AI Exec", "date": "2025-06-06", "title": "关于 散户 + 看空 + 做空", "chars": 1173, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/30414480", "path": "library/30414480.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "维度 做空带来的问题 对散户的实际影响 潜在亏损 做空收益最多 +100%，但理论亏损无限（股价可以涨到任何高度）( xueqiu.com ) 账户小、抗风险能力弱，一旦被逼空或被强平，很难再翻身 保证金与借股成本 需要维持保证金、支付利息、借券费 成本高企、占掉现金流，行情稍有波动就可能被追加保证金 行情噪声 散户信息慢、心理波动大，容易在短期反弹中割肉 “赚钱慢、亏钱快” 的典型场景 工具与制度 A 股融券标的受限，逆回购、股指期货门槛高，监管层临时限制空头时有发生 ( zhuanlan.zhihu.com ) 交易通道和规则对散户并不友好 情绪与时间成本 做空需要长期盯盘、反人性地 “盼", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "30319708", "author": "京城Z先生", "date": "2025-06-04", "title": "正确理解 “东升西降” 与中美股票投资", "chars": 825, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/30319708", "path": "library/30319708.html", "classification": "平台长文；原创性未逐篇认证", "core": "而中国股市则完全是另一套逻辑，上市价格是部分天龙人之间勾兑出来的结果，且普通人无做空工具，经常开盘即巅峰，天龙人套现离场，随后数年，这些盈利个位数，估值天文数字的公司，不得不慢慢消化这如笑话的估值，并且无论怎么折腾，都很难退市。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "30242123", "author": "京城Z先生", "date": "2025-06-02", "title": "美股实盘-20250602：低仓位运行，谨慎建仓", "chars": 2602, "read": true, "has_note": true, "themes": ["MSTR", "STRF", "STRK", "CEP", "NAKA", "NAKAW"], "source": "https://longbridge.cn/zh-CN/topics/30242123", "path": "library/30242123.html", "classification": "平台长文；原创性未逐篇认证", "core": "目前美股账户只有 20% 的股票仓位，还全是加密行业的，完全不慌，继续看各国的 "path": "library/29777003.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "四、Bengio 与同行提出的安全对策 对策层级 具体方法 进展现状 ▲ 训练前：结构约束 - 限制 “自举” 式代理- 避免诱导持续内存 Bengio 主张 “ 功能强大但非自主 ” 模型（Simons 演讲） ▲ 训练时：红队 + 反红队 - 强化沙盒 “诱捕” 场景- 交替竞争对抗训练 OpenAI / Anthropic 已将 scheming evals 纳入 system card；UK AISIC 建议列为 强制测试 ▲ 部署前：安全评估 (Safety Case) - 制作 “Scheming-Inability” 证书- 第三方复现（ARC、METR） 六国 AI﻿安全峰会草", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "29776863", "author": "老板的老板 AI Exec", "date": "2025-05-17", "title": "深度学习三巨头与 AI 安全问题讨论", "chars": 7648, "read": true, "has_note": true, "themes": ["AI"], "source": "https://longbridge.cn/zh-CN/topics/29776863", "path": "library/29776863.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "不过，随着近年来 AI 能力的快速发展，三个人的 AI 观点也出现了明显的分歧： 欣顿 ：在 2023 年辞去谷歌的职务之后，多次公开表达了对于 AI 发展速度和潜在风险的严重担忧。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "29776390", "author": "老板的老板 AI Exec", "date": "2025-05-17", "title": "ROCKET LAB vs SPACEX", "chars": 1526, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/29776390", "path": "library/29776390.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "电子火箭对比猎鹰 9 $Rocket Lab(RKLB.US) 一、基础参数对比 指标 Electron Falcon 9 首次入轨 2018 2010 2025 年累计轨道发射 63 次：59 成功 / 4 失败 → 93.6 % 成功率 486 次：483 成功 / 3 失败 +1 部分失败 → 99.4 % 成功率 2025 年单年发射（截至 5-15） 11 次 55 次 低轨载荷能力 320 kg @ 500 km SSO 22.8 t @ 28° LEO（可复用模式≈17 t） 单次公布价格 约 7.5 M USD ≈ 67 M USD（Block 5，2023 报价） 成本／公斤", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "29772283", "author": "老板的老板 AI Exec", "date": "2025-05-17", "title": "穆迪已于 5 月 16 日（周五，美东）正式将美国长期主权信用评级下调", "chars": 920, "read": true, "has_note": true, "themes": ["MCO"], "source": "https://longbridge.cn/zh-CN/topics/29772283", "path": "library/29772283.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "小提示 ：虽然降级对美债短期流动性影响有限，但它凸显了 “高债务 + 高利率” 组合的结构性风险；投资者在评估美元资产久期敞口时，需关注利率上行对各类债券和权益资产估值的再定价压力。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "29732905", "author": "老板的老板 AI Exec", "date": "2025-05-16", "title": "最新一周美国宏观数据全景（覆盖 2025 年 5 月 9 日至 5 月 15 日公布的数据）", "chars": 1951, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/29732905", "path": "library/29732905.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "市场驱动因素 ： CPI 核心持续低于 3 % → 强化年内降息逻辑 关税与选举不确定 → 交易员缩减年内降息幅度押注 ( WSJ ) 综合评估与展望 维度 现状评述 前瞻关注 通胀 CPI&核心 CPI 双双降至 2.3/2.8 %，PPI 大幅环比负值；短期定价压力缓和 6 月 11 日公布的 5 月 CPI 是否继续下探 <2 % 为关键验证 消费 关税前拉动后出现 “高基数 + 实质放缓”，零售销售控制组负增 进入暑期前服务消费（旅游、娱乐）能否弥补货物疲软 就业 初请延续低位，劳动力需求软着陆迹象 6 月初非农就业：>15 万仍属稳健；平均时薪环比 <0.3 % 政策 Fed 官员由", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "29728150", "author": "老板的老板 AI Exec", "date": "2025-05-16", "title": "关于 RKLB 的军工概念延展：", "chars": 3175, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/29728150", "path": "library/29728150.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "六、核心风险与观测指标 风险 具体表现 监控/缓释方案 进度风险 Neutron 首飞若延后 >12 月，NSSL 发射窗口可能被竞争对手提前锁定 关注季度 Earnings Call 的 “里程碑完成率”；若延迟，可观察 DoD 是否追加履约保证 成本通胀 碳纤维原料、HALEU 试验燃料价格攀升 关注与 DoD 的 “成本 + 激励” 合同条款；公司已逐步采用多供应商策略 竞争压力 SpaceX Starship、Relativity Terran R、Firefly MLV 比较 “快速起飞 - 低轨投放” 细分参数；Rocket Lab 的频次密集优势暂时领先 政策/安全 ITAR 或", "lesson": "按共同因子合并风险，现金和底仓需明确职责与上限。"}, {"id": "29504780", "author": "京城Z先生", "date": "2025-05-11", "title": "美股实盘-20250511：不在推土机前捡钢蹦", "chars": 2265, "read": true, "has_note": true, "themes": ["MSTR", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/29504780", "path": "library/29504780.html", "classification": "平台长文；原创性未逐篇认证", "core": "对苹果来说少了 200 亿的利润，同时指不定多出多少研发费用，还不一定能造出什么玩意，毕竟 AI 领域苹果折腾好多年也没什么成果，siri 一直拉垮。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "29434229", "author": "京城Z先生", "date": "2025-05-08", "title": "巴菲特的价投真相：用小仓位试错，靠大仓位复利", "chars": 1475, "read": true, "has_note": true, "themes": ["BRK.A", "BRK.B", "MSTR", "STRF", "STRK", "CEP", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/29434229", "path": "library/29434229.html", "classification": "平台长文；原创性未逐篇认证", "core": "有人问逻辑是什么，我马后炮的想了想，可能更多是靠全球陆续降息带来的增量水钱，以及躲避特师傅折腾美股，导致的资金跑路需求综合影响，最终汇成的这股突然冲起来的行情。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "29436796", "author": "lyhalfway", "date": "2025-05-08", "title": "2025年AI应用是否仍是主线", "chars": 609, "read": true, "has_note": true, "themes": ["DUOL", "APP", "PLTR", "TEM"], "source": "https://longbridge.com/en/topics/29436796", "path": "library/29436796.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "随着 APPLovin 的财报披露，美股中聚焦 AI 应用的四家公司 Q1 业绩全部超预期。", "lesson": "复算收入、利润率、倍数与兑现期，明确事实、机构预测与作者假设。"}, {"id": "29429294", "author": "老板的老板 AI Exec", "date": "2025-05-08", "title": "2228 港股中央结算系统 (CCASS) 持股变化分析（2025-04-15 至 2025-05-08）", "chars": 886, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/29429294", "path": "library/29429294.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$晶泰控股(02228.HK) 让 AI 做了一些统计，具体如下： 总体市场集中度变化 前 30 大持有者的累计持股比例从 58.7% 大幅上升至 84.69%，市场集中度明显提高（主要是解禁机构的持仓增加） 前 5 大持有者的累计持股比例从 41.65% 增加至 52.55% 主要持有者排名变化 香港上海汇丰银行 (C00031) ： 从第 5 位跃升至第 1 位 持股量从 153,258,051 股增加至 550,546,077 股 持股比例从 3.36% 大幅上升至 13.7% 中国证券登记结算 (A00001) ： 原排名第 1 位，持股 476,063,746 股 在 5 月 8 日", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "29401360", "author": "奥斯汀成长股实验室", "date": "2025-05-07", "title": "晶泰控股上市前后融资分析", "chars": 884, "read": true, "has_note": true, "themes": ["融资稀释", "晶泰", "机构成本", "2228", "TCEHY", "80700", "TCTZF", "700", "HTCD"], "source": "https://longbridge.cn/zh-CN/topics/29401360", "path": "library/29401360.html", "classification": "作者分析与个人方法记录", "core": "作者梳理晶泰融资轮次及上市后两次配售：文中列2025年1月4.28港元配2.64亿股、2月6.10港元配最多3.42亿股，并把当时市值与D轮、IPO估值及机构成本比较。他据此认为公司价值在2021至2025年间应有变化，等待解禁验证股东态度。", "lesson": "融资史的有效用途是追踪现金来源、新增股份和经营兑现所需时间。机构旧成本不能托底二级市场：旧股份权利、后续稀释、退出约束和资金期限不同。即使公司总价值提高，每股价值也可能因股数增加而不升；解禁后是否抛售又不能单独证明经营价值。文中将基石与IPO并列，汇总融资时需避免包含关系重复计算，所列金额为作者整理。"}, {"id": "29359323", "author": "京城Z先生", "date": "2025-05-06", "title": "我为什么说今年美股一定是猴市？", "chars": 1624, "read": true, "has_note": true, "themes": ["DJT", "DJTWW"], "source": "https://longbridge.cn/zh-CN/topics/29359323", "path": "library/29359323.html", "classification": "平台长文；原创性未逐篇认证", "core": "本周鲍师傅要在美联储议息会议上讲话，市场注定会很波动，且由于短期反弹幅度剧烈，向下的概率远高于向上，各位多头务必谨慎，降仓位降杠杆为上上策。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "29339313", "author": "京城Z先生", "date": "2025-05-05", "title": "美股实盘-20250505：闭麦小牛市", "chars": 2315, "read": true, "has_note": true, "themes": ["MSFT"], "source": "https://longbridge.cn/zh-CN/topics/29339313", "path": "library/29339313.html", "classification": "平台长文；原创性未逐篇认证", "core": "2、苹果 苹果财报公布：营收 954 亿美元，同比增长 5%，汇率负面影响本季度营收 2.5 个点；净利润 248 亿美元，同比增长 5%；毛利率 47%，同比增长 0.4 个百分点；其中硬件毛利率 35.9%，同比下滑 0.7 个百分点，软件毛利率 75.7%，同比增长 1.1 个百分点。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "29340770", "author": "老板的老板 AI Exec", "date": "2025-05-05", "title": "Flatellite，RKLB 的 CEO 有些迫不及待", "chars": 987, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/29340770", "path": "library/29340770.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "总结来说： Peter Beck 当时在财报会议上之所以兴奋，是因为 Flatellite 代表了 Rocket Lab 在卫星制造能力上的一大步，是专门针对日益增长的大型卫星星座市场而设计的重要新产品，并且能与其未来的中子号火箭形成协同效应。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "29336330", "author": "老板的老板 AI Exec", "date": "2025-05-04", "title": "跟 GPT o3 的连续 4 个对话：", "chars": 7459, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/29336330", "path": "library/29336330.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "( cbo.gov , Peterson Foundation ) 解读要点 “三分法” 记忆 强制 ≈60 %：社会保障 + 医保/Medicaid + 其他法定福利 可裁量 ≈27 %：其中防务一半（13 %），非防务一半（15 %） 净利息 ≈13 %，规模已与国防相当，且随债务和利率持续走高 五大支出块占 3/4 Social Security（22 %）+ Medicare（14 %）+ Medicaid（9 %）+ Defense（13 %）+ Net Interest（13 %）= 71 % 结构性压力 人口老龄 → 社保与医保每年自动增长 债务利息弹性最大，2028 年前或跃升", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "29335217", "author": "老板的老板 AI Exec", "date": "2025- ars": 1894, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/29252754", "path": "library/29252754.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "六、综合推断——“多触发 - 单弱点” 模型 最可能场景 ：一条关键 400 kV 互联线路或直流换流站因设备故障下线 → 导致与法国的所有线路同时或递进断开 → 伊比利亚电网瞬间失去外部支撑 → 在光伏高输出、系统惯量低的午间时段，随即发生 15 GW 级 “供给侧脱网” 或等效缺口 → 频率崩溃、级联脱网全面展开，造成西班牙／葡萄牙全域停电。", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "29251475", "author": "lyhalfway", "date": "2025-04-30", "title": "Fedstart - PLTR 的 AI 应用生态雏形", "chars": 1258, "read": true, "has_note": true, "themes": ["PLTR"], "source": "https://longbridge.cn/zh-CN/topics/29251475", "path": "library/29251475.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "同时提供多样化应用：FedStart 支持多种类型的软件，从 AI 和数据分析（Anthropic、Primer.ai）到安全（CalypsoAI）和数据可视化（Grafana），类似于 AppStore 中各类应用的多样性  在所有的商业模式中，生态无疑是最吸引人的一个，它意味着高壁垒、独占性和高利润，PLTR 正有机会实现这个远大图景   $Palantir Tech(PLTR.US)", "lesson": "把技术、采用、合同、收入、利润和融资里程碑分层核验。"}, {"id": "29181665", "author": "京城Z先生", "date": "2025-04-27", "title": "美股实盘-20250427：等等党永不为奴", "chars": 2545, "read": true, "has_note": true, "themes": ["GBTC", "AAPL", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/29181665", "path": "library/29181665.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 清仓大饼 ETF 持仓： TLT 21.5%，BIL 78.5%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "29181518", "author": "戴某 DEMO", "date": "2025-04-27", "title": "平台、商家、骑手、消费者、房东。", "chars": 3518, "read": true, "has_note": true, "themes": ["线上零售与平台竞争", "投资方法与认知", "组合与风险", "MPNGY", "83690", "3690", "HMTD", "JD", "89618", "9618", "BABA", "89988", "9988", "HBBD"], "source": "https://longbridge.com/zh-CN/topics/29181518", "path": "library/29181518.html", "classification": "本人公开长文", "core": "———————————————————————————————— 1 公众对美团的情绪，主要缘起于「被高抽成的商家」和「困在系统中的骑手」... 在之前的文章中，我曾提到过，本地生活领域，美团 VS 饿了么同业态竞争的核心关键是「商家」「消费者」「骑手」三个核心角色的运营效率，从过程和结果来看，无疑美团是效率更高的那一方，但对「效率」的极致追求，也有它的反作用，当下美团正在经历的舆论旋涡就是它要承受的果了。在企业经营中，我认为这甚至是不可避免的，因为美团这类毛利很低靠极致运营效率和规模才能出利润的业务，组织通常只能在残酷的竞争中，执行追求一个极致的目标，很难兼顾人文层面的维度，需要更高维度之上给设立一个边界，才能倒逼做出调整。 行政介入，可以调整明确竞争的边界，保障劳动者，但我们也应意识到，外卖服务提供的价值相对不变的情况下，新的边界带来的「变量」部分，会由这个链条上的其他角色重新分摊，无论好处还是坏处，分配机制则是由「机会成本」决定，例如相比原来「更长的配送时间」，需要消费者承担，或者有部分消费者不愿意承担这时间成本，也不愿意出门，选择了自己做饭，这个业务损失的成本是由餐饮从业者承担，再或者平台通过其他更高成本的手段保障了", "lesson": "把平台判断拆成供需密度、履约效率、流量/交易变现、竞争投入与股东回报；产业理解仍需经财报口径和估值桥梁验证。"}, {"id": "29179296", "author": "老板的老板 AI Exec", "date": "2025-04-26", "title": "最近加密圈的一件看上去可能不大，但是我认为可能实际影响深远的事情", "chars": 1930, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/29179296", "path": "library/29179296.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "SoftBank 注入名义股权，提高估值杠杆 SPAC 合并后可利用股票质押与可转债再融资，放大比特币仓位。", "lesson": "复盘应转成下次可执行规则，亏损后不以加杠杆或改目标逃避失效。"}, {"id": "29143077", "author": "老板的老板 AI Exec", "date": "2025-04-25", "title": "人工智能在制药与材料科学领域的应用与投资展望", "chars": 9086, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/29143077", "path": "library/29143077.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "3. AI 技术提供者（算力 + 平台） ：如 NVIDIA（NVDA）、Alphabet（GOOGL）、Microsoft（MSFT）、Amazon（AMZN）。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "29053846", "author": "老板的老板 AI Exec", "date": "2025-04-22", "title": "2025 年美国利率下调必要性调研报告", "chars": 26409, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/29053846", "path": "library/29053846.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "美国联邦政府利息负担沉重，债务再融资压力巨大，高利率若长期不降将明显加剧财政不可持续风险 ( Interest Costs on the National Debt ) ( Interest Costs on the National Debt )。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "29026709", "author": "京城Z先生", "date": "2025-04-20", "title": "美股实盘-20250420：脱下皮衣，穿上西服", "chars": 2350, "read": true, "has_note": true, "themes": ["AAPL"], "source": "https://longbridge.cn/zh-CN/topics/29026709", "path": "library/29026709.html", "classification": "平台长文；原创性未逐篇认证", "core": "3、谷歌 谷歌将于美东时间 04 月 24 日盘后发布财报，机构预期 D"], "source": "https://longbridge.com/zh-CN/topics/28997369", "path": "library/28997369.html", "classification": "本人公开长文", "core": "第二，关于城市开拓的数据，个人认为其定义方式存在问题。原有的饿了么和美团外卖在城市渗透时，主要依靠线下地推团队，包括门店培训和服务商对接。而京东目前统计的 140 多个城市中，去年在做咖啡、茶饮等品类时已，经覆盖了约 80 个城市，现在的 140 多个城市只是定义为至少有一个品牌支持京东外卖配送，这种统计方式对业务增长和运营重心的意义不大。 对于服务商和商家而言，这种模式风险较低，因为他们可以借助新的流量来源进行尝试，而无需承担额外成本。", "lesson": "把平台判断拆成供需密度、履约效率、流量/交易变现、竞争投入与股东回报；产业理解仍需经财报口径和估值桥梁验证。"}, {"id": "28981267", "author": "股神小顾", "date": "2025-04-17", "title": "最后一次豪赌", "chars": 761, "read": true, "has_note": true, "themes": ["BIII"], "source": "https://longbridge.cn/zh-CN/topics/28981267", "path": "library/28981267.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "今天 清掉了所有期权 看到账户里只有 11000 了 突然想笑 也想过身无分文后会怎么办 是涅槃重生 还是跳楼重生 事实上都没有发生 我还是像条死狗一样活着 也许内心还有一点希望吧 谁说一万块钱不能翻盘呢 我拿 7500 买了看跌的期权 凌晨一点鲍威尔是否降息会暂时决定美股的走向 我坚决看跌 美股最近反弹太多了 但是基本面没有边 而且市场被特朗普玩坏了 走出家门 不管是内地还是大洋彼岸 我看到的都是经济寒冬 没有不跌的理由 这也是我最后一次豪赌（虽然只有 7500，但是是我全部的家当了） 这一次 不管对错 我也不会再赌了 相当长时间 我都有一百多万的 我陷入沉思 这短短不到一年时间里 到底发生", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "28919241", "author": "輸棟樓的韭菜", "date": "2025-04-14", "title": "价格的本质的一些随想（一）", "chars": 820, "read": true, "has_note": true, "themes": ["AAPL"], "source": "https://longbridge.cn/zh-CN/topics/28919241", "path": "library/28919241.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "公司需要股票回购的时候、大股东需要抵押股票融资的时候、公司需要通过分红给大股东现金的时候，以及公司要被并购或者私有化的时候（比如大股东不想给市场定期公开财报了）、80% 股权散落股东们要争夺股权的时候。", "lesson": "复算收入、利润率、倍数和兑现期；低倍数可能对应周期高点或治理折价。"}, {"id": "28900837", "author": "京城Z先生", "date": "2025-04-13", "title": "美股实盘-20250413：紧急避险，跳车买债", "chars": 1910, "read": true, "has_note": true, "themes": ["AAPL", "NVDA", "GOOGL", "GOOG", "PBR", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/28900837", "path": "library/28900837.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 清仓谷歌 清仓巴西石油 买入 21.5% 的 TLT 持仓： 大饼 ETF 18.6%，TLT 21.5%，BIL 59.9%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "28874151", "author": "老板的老板 AI Exec"
