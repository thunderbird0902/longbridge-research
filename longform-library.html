font-weight:650;color:#674813}.featured-reading{border:1px solid #dcc68f;background:#fff8e8;border-radius:10px;padding:18px;margin:18px 0}.featured-reading p{margin:8px 0}.featured-reading h3{margin:0 0 12px;font-size:18px}</style></head><body><div class="progress" id="progress"></div><header><div class="eyebrow">研究配套资料 / 离线阅读</div><h1>长文索引</h1><p class="lead">按作者、标的与主题查找。每篇同时保留公开正文、原始出处与已有研读笔记。</p></header><main><a href="longbridge-research.html">← 返回研究报告</a><section><p>共保存 759 篇正文文字，其中 759 篇附内容分析。未分析文章单列为待研读，不计已读。收录包括复盘、专题及参考材料，不以篇数代表研究质量；图片请回原帖查看。</p><div class="controls"><input id="q" type="search" placeholder="搜索作者、标的、主题或思想，例如 NVDA、估值、卖出" aria-label="搜索文章"><select id="author" aria-label="作者"><option value="">全部作者</option><option>AngerBird</option><option>Ryan-</option><option>Sam港美日记</option><option>SpaceM</option><option>lyhalfway</option><option>不奋东西</option><option>京城Z先生</option><option>价值&amp;投资</option><option>保持平和</option><option>周树人的交易员</option><option>奥斯汀成长股实验室</option><option>慢慢长大的南瓜</option><option>戴某 DEMO</option><option>无限制星级格斗士</option><option>昆仑山岩石</option><option>晓风 morning_wind</option><option>熊猫校长Ming</option><option>爱妻的交易员</option><option>老板的老板 AI Exec</option><option>股神小顾</option><option>躺平de交易员</option><option>輸棟樓的韭菜</option><option>还差3800出圣者遗物</option></select><select id="form" aria-label="阅读状态"><option value="">全部状态</option><option value="featured">重点研读</option><option value="note">有分析笔记</option><option value="read">正文已读</option><option value="pending">待研读</option></select></div><p id="count" class="muted"></p><div id="results"></div><div class="controls"><button id="prev">上一页</button><button id="next">下一页</button></div><script>const data=[{"id": "44090961", "author": "戴某 DEMO", "date": "2026-09-28", "title": "此道一百，你我又知多少呢？", "chars": 3985, "read": true, "has_note": true, "themes": ["投资方法与认知", "估值与预期差", "AI产业与产品形态"], "source": "https://longbridge.com/zh-CN/topics/44090961", "path": "library/44090961.html", "classification": "本人公开长文", "featured": true, "featured_reason": "价格价值催化｜将非共识、现金流折现、价格和催化剂连接，代表后期方法的完整化。", "core": "有人觉得 30 倍估值已经太贵，有人算完五年后的利润以后觉得并不贵。 利润超预期，估值应该抬升。", "lesson": "将技术叙事落到新供给、替代人力、专有数据、工作流和付费结果；正文多为研究假说，需用客户留存、单位经济与现金回报继续证伪。"}, {"id": "43876980", "author": "股神小顾", "date": "2026-09-13", "title": "股票实盘 P9:大出血", "chars": 1090, "read": true, "has_note": true, "themes": ["9899", "9988", "BABA", "89988", "002028", "605499", "9980", "ALB", "BSX", "9888", "UBER", "LMT"], "source": "https://longbridge.cn/zh-CN/topics/43876980", "path": "library/43876980.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "四倍融资风险｜披露四倍融资下多板块同步下跌、靠追加资金避免爆仓，说明多标的并不等于分散共同风险。", "core": "光模块存储板块依然强势，黄金也还行，但是我重仓的小金属、医药、中概、航天板块却遭重挫，动则都是八九个点的跌幅，我本身就是 4 倍融资，如何扛得住？", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "43401513", "author": "AngerBird", "date": "2026-08-14", "title": "【六维度投资升级版】从三轮深度回撤再创新高：沉淀一套六维选股框架", "chars": 1283, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/43401513", "path": "library/43401513.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "投资框架｜六维选股把管理、组织、定价权、现金流、行业与估值仓位放在一起；研读重点是将每一维转成可验证问题。", "core": "第四维：看财务——现金流是企业的体检核心 相比单纯追逐营收增速，我更加重视稳定的经营性现金流、可持续的营业利润。", "lesson": "把人物与组织判断落到客户留存、定价权、现金流和资本回报；框架问题不等于答案已证实。"}, {"id": "43235029", "author": "AngerBird", "date": "2026-08-06", "title": "投资最残酷的必修课：所有大成者，都曾死过一次", "chars": 1233, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/43235029", "path": "library/43235029.html", "classification": "文章", "featured": true, "featured_reason": "回撤与幸存者偏差｜将爆仓或深回撤视为成长路径，容易浪漫化风险；应与永久损失和失效条件对照。", "core": "长文把亏损、深套甚至爆仓描述为顶级投资者必经课程，并把能扛逆境与最终成功联系。", "lesson": "接受普通回撤与美化毁灭性亏损必须分开；爆仓不是学习必修课，“活下来都会成功”存在幸存者偏差。"}, {"id": "43139888", "author": "熊猫校长Ming", "date": "2026-08-02", "title": "AI正循环的认错路径：客户付费不是ROI终证", "chars": 2975, "read": true, "has_note": true, "themes": ["SKHY", "SKHYV", "AMZN", "MSFT", "GOOG", "GOOGL", "GOOGN", "META"], "source": "https://longbridge.cn/zh-CN/topics/43139888", "path": "library/43139888.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "增长验证｜把企业ROI、付费、云收入、资本开支和上游订单逐段连接，并列出逆转信号，是跟踪AI预期差的研究清单。", "core": "全文从云与Copilot财报讨论付款人由少数模型公司扩至普通企业，区分3000万付费席位与4000万注册Agent，后者不等于收入。提出ROI→企业付费→云收入/RPO→CapEx→上游订单循环，并列续费、用量、现金流验证与逆转链。", "lesson": "可以直接用于供应链投资跟踪：企业ROI若不持续，先影响付费和云，再影响CapEx与设备订单。席位增长证明购买，不能证明客户已经赚钱；训练初期投入、合同承诺、真实现金流要分开，原帖财务数据属作者引用。"}, {"id": "43117078", "author": "无限制星级格斗士", "date": "2026-07-31", "title": "能力圈、集中度与生活现金流", "chars": 7685, "read": true, "has_note": true, "themes": ["9992", "FFIE", "MSFT", "MNSO", "9896", "NVDA", "META", "SPOT", "NFLX", "LLY", "HPPD", "ASML"], "source": "https://longbridge.cn/zh-CN/topics/43117078", "path": "library/43117078.html", "classification": "第三方采访全文；作为作者研究材料，不计本人原创帖子", "featured": true, "featured_reason": "能力圈与组合｜完整采访呈现从集中投机到龙头分散的变化，并解释满仓投资背后的工作收入、应急金和仓位上限。", "core": "完整采访披露从FFIE全仓投机与科技股回撤割肉，转向每领域看得懂的龙头、单股15%—20%上限、SCHD压舱。行业经验用于广告与IP判断，拒绝不懂的存储；生活备用金与工作现金流支持满仓投资。", "lesson": "最值得学习的是能力圈和账户外资金安排；SCHD仍属股票，股息不是无风险现金。曾经盈利回吐与后来割肉不能被成绩徽章掩盖，采访自述并非审计净值。"}, {"id": "43056125", "author": "熊猫校长Ming", "date": "2026-07-30", "title": "微软与Meta：同样CapEx扩张，回款路径不同", "chars": 2190, "read": true, "has_note": true, "themes": ["META", "MSFT", "002245", "MET", "COP", "AMZN", "SKHY", "MU", "NVDA", "MET-A", "MET-E", "MET-F"], "source": "https://longbridge.cn/zh-CN/topics/43056125", "path": "library/43056125.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "AI产业链｜微软和Meta同样增加AI开支，收入与现金回收路径却不同；学习分别评价付款方与供应商。", "core": "全文将微软视为企业云与Copilot直接付费，Meta视为AI先改善广告再回收成本。作者列微软云增速、RPO、付费席位，与Meta广告量价增长、CapEx挤压FCF对照；另提醒法律与裁员费用也影响Meta利润，不能全算AI。", "lesson": "核心机制是把资本开支与实际付款方式连接：供应链订单利好不等于买单者股东收益同步。Azure全增长不等于AI收入，RPO不是当期现金；原帖本季大量数字未逐项二次核验，宜用机制而非照抄预测作估值。"}, {"id": "42875421", "author": "晓风 morning_wind", "date": "2026-07-23", "title": "近期 Deepseek 梁文峰分享完整版", "chars": 10174, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/42875421", "path": "library/42875421.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "需求弹性｜token成本下降与杰文斯效应的长文；需用量、价、客户预算和毛利拆分验证。", "core": "因为在这个价格区间，用户的需求是没有弹性的，就是我价格再翻一半，或者说我价格再抬高一倍，token 的消耗量区别不大的。", "lesson": "把模型能力、真实采用、付费收入与利润贡献分层验证，避免由测评或舆论直接推仓位。"}, {"id": "42789293", "author": "京城Z先生", "date": "2026-07-19", "title": "美股实盘：勾起非常不美好的回忆（20260719）", "chars": 2521, "read": true, "has_note": true, "themes": ["共同客户", "浮盈错觉", "压力回撤", "MU", "688008", "TSM", "MRVL", "GOOG", "NVDA", "LITE", "SKHYV", "SKHY", "ASML", "BE", "NOK"], "source": "https://longbridge.cn/zh-CN/topics/42789293", "path": "library/42789293.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "featured": true, "featured_reason": "单周大回撤的复盘揭示共同客户预算和浮盈错觉：多只供应商并不等于分散风险。", "core": "7月19日作者自述组合单周-16.86%，同期标普-1.55%；未交易，SNDK30.4%、MRVL7.1%、LITE9.6%、BE9.3%、GLW6.1%、NOK6.7%，现金美债18.3%。他承认早料七月调整，却因本金缓冲厚、预想跌幅不超约10%而未防守，实际远超预期。复盘开始强调不能只看收钱的供应商，要看巨头CapEx与未来指引，因为供应商客户高度集中重叠；若需求逻辑证伪便退出。", "lesson": "这是明确可用的失败机制：浮盈属于当前财富，不会降低下一段下跌的经济损失；看似六只股票可能押同一客户预算。下跌归因韩国融资盘等仅是作者解释、未独立证实，但集中敞口和低估回撤已由其仓位及自述直接支持。"}, {"id": "42280957", "author": "股神小顾", "date": "2026-06-29", "title": "2026年中复盘：亏损后的期权交易", "chars": 2146, "read": true, "has_note": true, "themes": ["NOW", "NVO", "UBER", "MSFT", "UNH", "SNPS", "PATH", "BA", "9988", "9961", "AMZN", "ALB"], "source": "https://longbridge.cn/zh-CN/topics/42280957", "path": "library/42280957.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "期权失败总复盘｜把老登股、主线周度期权和末日箱体交易串成完整损失链，并区分戒期权后的正股阶段。", "core": "（Ps：这是悟道前的操作，但是悟道后没完全止损） 老登这一块，NOW、优步、亚马逊、微软、拼多多，亏了 10 万。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "42179316", "author": "Ryan-", "date": "2026-06-25", "title": "关于美光股价最新预期，以及操作", "chars": 727, "read": true, "has_note": true, "themes": ["MU"], "source": "https://longbridge.cn/zh-CN/topics/42179316", "path": "library/42179316.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "退出纪律｜给出分档兑现区间和8%—12%移动止盈，适合检验目标价、趋势延续与回撤控制如何配合。", "core": "仓位操作（基于目前已知财报信息以及指引） •1500：减持 10% •1800-1900 过渡：减持 10% •2000：减持 30 % •超过 2000 后：采用 trailing stop （例如最高价回撤 8-12% 卖出剩余部分）。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "40811354", "author": "SpaceM", "date": "2026-05-15", "title": "Cerebras：希望是下一个英伟达", "chars": 4339, "read": true, "has_note": true, "themes": ["GRO", "AVGO", "CBRS", "SNOW", "AMZN", "NVDA", "AMD", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/40811354", "path": "library/40811354.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "算力新公司｜Cerebras案例展示作者从TSLA扩展到AI芯片，但需要补商业化、竞争和估值桥梁。", "core": "我的看法是，这不是一个能用\"贵不贵\"回答的问题，因为它本质上是个 期权题 ——市场不是在给 Cerebras 的当前业务定价，而是在给\"下一代 AI 芯片格局\"押注。 二、训练 vs 推理：这不是同一场战争 我们必须把 AI 芯片这个赛道拆成两个完全不同的市场——这是理解 Cerebras 估值逻辑的钥匙。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "40107611", "author": "SpaceM", "date": "2026-04-22", "title": "【财报前瞻】华尔街还在数特斯拉卖了多少车，但主线早就换到 AI 了", "chars": 4937, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "TSLA", "9868", "300024", "XPEV"], "source": "https://longbridge.cn/zh-CN/topics/40107611", "path": "library/40107611.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "特斯拉财报前瞻｜把汽车销量与AI主线分开，是检验技术叙事如何进入经营模型的重要长文。", "core": "但我的看法是：这些都不是今晚真正值得看的东西。 先说结论：多空的算盘，根本不在同一张桌子上 截至发稿，特斯拉（TSLA.US）报价 $391.14，盘中涨幅 +1.22%，日内高点 $393.00。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "39710701", "author": "SpaceM", "date": "2026-04-03", "title": "Longbridge Skills 带来的行为经济学机会（实际案例）", "chars": 816, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/39710701", "path": "library/39710701.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "情绪工具｜用社区情绪构建逆向观察信号；方法有启发，但仍缺样本外和交易成本验证。", "core": "对冲基金花几十万美元买 alternative data，干的事情本质上就一件： 在散户情绪到达极端时，做反向交易。 这门生意的核心壁垒，不是模型多复杂，是数据源拿不到。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "39632952", "author": "lyhalfway", "date": "2026-03-31", "title": "BMNR 极值推演 3.31", "chars": 861, "read": true, "has_note": true, "themes": ["COIN", "BMNR", "BMNRD"], "source": "https://longbridge.cn/zh-CN/topics/39632952", "path": "library/39632952.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "质押收益｜从ETH beta扩展到质押平台估值；需扣除成本并纳入罚没、监管与技术风险。", "core": "过去市场更多把它当作 ETH beta 和 treasury 标的来看，但随着 MAVAN 正式上线、以及收购 Pier Two 来搭建质押技术平台，BMNR 的估值逻辑已经开始出现切换的可能性。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "38745132", "author": "SpaceM", "date": "2026-02-17", "title": "2025 年度投资复盘", "chars": 1426, "read": true, "has_note": true, "themes": ["TSLA", "BTC", "300024", "SBET", "ABTC", "GBTC"], "source": "https://longbridge.cn/zh-CN/topics/38745132", "path": "library/38745132.html", "classification": "作者年度复盘", "featured": true, "featured_reason": "长期组合｜SpaceM公开QQQ、BTC、TSLA长期趋势组合与少择时规则，是其方法最完整的自述。", "core": "核心认知：\"草台班子\"与纠错效率 这个世界，无论政府还是企业，本质上都是\"草台班子\"——任何环节都可能出错。 这个认知再次验证了我持仓 QQQ 和 BTC 的逻辑： QQQ（纳斯达克 100 指数） $纳指 100 ETF - Invesco(QQQ.US) 它是美股前 100 家科技企业的集合。", "lesson": "正文以叙事/判断为主，需把预测与可验证事实分开；关注后续是否出现正文列出的业务指标。"}, {"id": "37769583", "author": "AngerBird", "date": "2026-01-13", "title": "投资选股篇 - 选好投资标的\n2 个核心判断 + 估值上下限逻辑", "chars": 725, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "9988", "89988", "BABA", "AMZN", "9618", "700", "JD", "89618", "80700", "TCEHY"], "source": "https://longbridge.cn/zh-CN/topics/37769583", "path": "library/37769583.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "谷歌估值｜利润增长与PE相连的可复算骨架；需加入贴现、股份变化和下行情景。", "core": "上限看成长空间：以上限可落地的谷歌为例，以 2024 年年利润 1000 亿美元为例（按今日股价，大概预测今年利润会达到 1200-1250 亿美元…）若按平均 15% 年利润增速，5 年后利润可达 2000 亿美元；同样 30 倍 PE，市值上限可到 6 万亿美元，对应股价即 500 美元/股；这就是最高上限！", "lesson": "复算收入、利润率、倍数与兑现期，预测数字回到公司披露核验。"}, {"id": "36814630", "author": "奥斯汀成长股实验室", "date": "2025-12-01", "title": "202511 复盘", "chars": 826, "read": true, "has_note": true, "themes": ["NEM", "RKLB", "NOK", "CRWV", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/36814630", "path": "library/36814630.html", "classification": "原创分析或复盘长文", "featured": true, "featured_reason": "纪律与执行｜十一月复盘明确写出已想到降风险却未执行。研究警报、仓位和实际减仓之间缺了哪一步。", "core": "作者自述 2025 年至当时简单加权约 +43%，十一月 -9%；RKLB、AMZN 等成长股与 call 是主要损失，期权一度约 30%，复盘时已降至 8%。BTC 月初下跌且有人提醒，他也原拟降 beta、降 call、加 BRK/KO，却高估美股韧性、恋仓未执行。防守股有收益但配置不足，AMZN 利好上涨时 call 减得太少。", "lesson": "这把回撤原因从“行情不好”定位到事前计划没有落地，且行业分散未抵消期权共同敏感性。两种收益口径不能混用；从 30% 到 8% 是作者披露的状态变化，未给具体交易路径，不能补造逐日去杠杆过程。"}, {"id": "36409144", "author": "京城Z先生", "date": "2025-11-16", "title": "美股实盘-20251116：打不过就加入", "chars": 2143, "read": true, "has_note": true, "themes": ["SNDK", "TSLA", "NVDA", "META", "MU", "AMZN", "AAPL", "NEM", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/36409144", "path": "library/36409144.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "MU与SNDK分开比较企业质量、资金强弱、回调价格和波动承受，展示同板块选股的真实取舍。", "core": "交易： 清仓英伟达（NVDA） 买入 12% 闪迪（SNDK） 持仓： 大饼 ETF 23.0%，SNDK 12.9%，NEM 28.2%，GLD 22.9%，现金/美债 13.0%。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "36113500", "author": "股神小顾", "date": "2025-11-07", "title": "股票实盘 P76:要结束了", "chars": 710, "read": true, "has_note": true, "themes": ["DUOL", "CRCL", "FIG", "SQNS", "6969", "9992", "SBET", "MSTR", "HPPD", "STRC", "STRD", "STRF"], "source": "https://longbridge.cn/zh-CN/topics/36113500", "path": "library/36113500.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "跟单失效｜承认因他人一句话买入不理解标的并长期自我安慰，展示观点来源、退出缺失和沉没成本如何连锁。", "core": "可惜我没遵守住原则，最终付出了惨痛的代价 不谈往事，就谈近期给我重伤的一些票吧，思摩尔，泡泡玛特，crcl，fig，这些票我完全不懂，就因为一个人一句话买的，无脑抄作业，把自己抄上了断头台，然后跌了几个月，一直找理由心理安慰自己，现在彻底腰斩了 事实上别人就是随口一说，我就是出生，明明抄了几十次亏了几十次，还要抄，该信自己的时候不信自己，该信别人的时候不信别人 sbet 属于是小票，以前不可能碰的，现在莫名其妙碰了，sqns 给我的教训白搭了，有什么办法呢，我就是这么一个记吃不记打的人啊 多邻国，mstr 也是，评论区老有人抄底，我也以为到底了，实际上呢？", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "35219758", "author": "奥斯汀成长股实验室", "date": "2025-10-15", "title": "再谈仓位管理", "chars": 946, "read": true, "has_note": true, "themes": ["RKLB", "ASTS", "POWI", "AMZN", "TSM", "INTC", "TSLA", "NVDA", "AAPL", "603020", "4335"], "source": "https://longbridge.cn/zh-CN/topics/35219758", "path": "library/35219758.html", "classification": "原创分析或复盘长文", "featured": true, "featured_reason": "持股周期与退出｜主线、卫星、事件三类仓位分别对应不同持有理由与退出标准；学习分类方法，而非机械复制比例。", "core": "作者提出主线 50%—60%、卫星 20%—30%、事件约 10% 的三层结构。主线为熟悉的创新和 AI 资产，单股及相关行业均不超过 20%，可用半年以上期权做波动；卫星为右侧趋势，单股小于 5%、涨逾 50% 逐步减；事件机会如 POWI 纳入 NVDA 生态，要求价格尚未充分反应，单股也不超 5%。这些是作者提出的个人模式，不是证明所有历史持仓达标。", "lesson": "分类的意义是让持有理由决定卖法：长期公司变化、板块趋势和单一催化不能用同一耐心。各档区间不是固定合计权重；所谓套利例子是单边事件交易，缺少锁定价差结构，不能承诺风险已被对冲。"}, {"id": "34295374", "author": "京城Z先生", "date": "2025-09-21", "title": "美股实盘-20250921：疑似老鼠仓，偷感很重", "chars": 2079, "read": true, "has_note": true, "themes": ["VIOT", "NVDA", "HESAY", "LITE", "MSTR", "STRC", "STRD", "STRF", "STRK", "BBAI"], "source": "https://longbridge.cn/zh-CN/topics/34295374", "path": "library/34295374.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "选股与兑现｜比较中小盘公司的新增订单弹性、既有现金流与兑现阶段；重点研究LITE选择逻辑，内幕猜测不作买入依据。", "core": "交易： 清仓 TLT，买入等额 BBAI 持仓： 大饼 ETF 23.5%，二饼 ETF 6.7%，LITE 22.9%，英伟达 19.7%，爱马仕 8.7%，云米 7.1%，BBAI 11.3%。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "34072519", "author": "lyhalfway", "date": "2025-09-16", "title": "BMNR 极值推演 0916", "chars": 929, "read": true, "has_note": true, "themes": ["BMNR"], "source": "https://longbridge.cn/zh-CN/topics/34072519", "path": "library/34072519.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "每股资产｜持续跟踪mNAV和稀释；应把完全摊薄股数、现金、债务与融资条件纳入同一模型。", "core": "目前 mNAV 为已回升至 1.39，日益提升的市场情绪带动流动性提升，形成正向飞轮，所以融资路径角度不用过于担心  结论： BMNR，若 ETH 回升至 4.8k，mNAV 回升值 1.5，对应股价 61，若 ETH 回调下探至 4.3k，mNAV 跌至 1.25，对应股价 46，结论是极值区间为 46～61 之间  市场都很关注周四是降息 25bp 还是 50bp，是否会出现 sell the news 的下跌，但我认为不论 9 月是 25/50 都只是短期波动，更重要的是进入降息周期。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "33496199", "author": "lyhalfway", "date": "2025-08-30", "title": "10B，发行可转债的规模门槛", "chars": 2216, "read": true, "has_note": true, "themes": ["BMNR", "MSTR", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/33496199", "path": "library/33496199.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "融资模型纠错｜包含10B数量级、可转债票息和ETH价值的实质错误，是检验精密叙事与底层算术的关键帖。", "core": "BMNR 最新的 ETH 持仓 180 万，接近 8B 美元，预期未来两周将超过 200 万，ETH 总资产超过 10B，这很重要，因为一旦资产规模达到 10B，更容易发行低成本的可转债，因为此时公司的资产基础足够稳固，能吸引机构投资者并降低融资风险。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "33383956", "author": "老板的老板 AI Exec", "date": "2025-08-27", "title": "晶泰半年报总结 By GPT5", "chars": 2863, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/33383956", "path": "library/33383956.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "收入质量｜将里程碑、现金到位、客户集中、应收与经常性收入列为跟踪指标，避免只看合同总额。", "core": "我建议重点盯的 5 个指标 里程碑兑现与现金到位节奏 （公告与现金流量表双确认）； 收入结构 ：按业务线与 “时间点 vs 期间” 确认占比的变化； 客户集中度轨迹 （Top1 占比能否显著下行）； 应收与周转 （绝对额与账龄分布/坏账拨备）； 机器人业务出海/交付节点 （收入与毛利弹性能否进一步显性化）。", "lesson": "按共同因子合并风险，现金和底仓需明确职责与上限。"}, {"id": "31745233", "author": "lyhalfway", "date": "2025-07-13", "title": "机构大单：组合期权策略", "chars": 1041, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG"], "source": "https://longbridge.com/zh-CN/topics/31745233", "path": "library/31745233.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "期权乘数｜期权大单成本漏算每张100股乘数，提醒先核单位和组合结构再推断机构方向。", "core": "解读：机构中性，暗示未来一个月会有大波动，期望从波动中获益；但由于 put 是深度价外，整体还是看涨倾向，put 只是为了对冲   以下是详细分析：  第一笔是合成多头 (Synthetic Long Stock) 策略   构建： 同时买入相同数量、相同到期日和相同行权价的看涨期权，并卖出相同数量、相同到期日和相同行权价的看跌期权。", "lesson": "方向、期限、波动率与最大损失需匹配，单位和合约乘数必须复算。"}, {"id": "31096876", "author": "股神小顾", "date": "2025-06-25", "title": "抄作业与杠杆的三条忠告", "chars": 605, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/31096876", "path": "library/31096876.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "事前风险规则｜明确写下不抄作业、不赌博、不满仓不融资；适合与后续真实行为对照规则为何失效。", "core": "是自己看得懂 是价格合理 是拿得住，是自己本来就想买和他英雄所见略同，而不是看到某个高人推票，自己脑子一热就去买了 2.不赌博 买小票/买期权/赌财报这些都叫赌博 看消息面炒某种程度也算 因为你不能确定这个消息一定是真的 更不能确定市场一定会被这个消息影响 偏离价值去赌博 长期来看 一定是吃亏的 除非是赌神 但是我玩一下午干瞪眼一局都没赢过 偏财运我是没有的 所以不能参与 3.不满仓不融资 心态都是仓位决定的 三倍融资跌三个点就是跌九个点 0.3 成仓位跌三个点才 0.9 个点 心态当然不一样 而且融资了没办法补仓，降低成本，做不了波段，还容易割肉，事实证明，仓位控制永远是最重要的", "lesson": "他人观点只能作为线索；跟单前独立写出估值、仓位、退出与最大损失。"}, {"id": "31059674", "author": "輸棟樓的韭菜", "date": "2025-06-24", "title": "从国补到撒币，京东想做什么？", "chars": 1381, "read": true, "has_note": true, "themes": ["89618", "JD", "9618", "9988", "89988", "HBBD", "BABA", "HJDD", "3690", "83690", "HMTD", "MPNGY"], "source": "https://longbridge.cn/zh-CN/topics/31059674", "path": "library/31059674.html", "classification": "原创分析或复盘长文", "featured": true, "featured_reason": "商业模式与现金流｜家电补贴例子说明有毛利、销量增长也可能缺现金。重点研究回款延迟和营运资金，后续京东战略部分是作者推测。", "core": "作者走访部分地区家电商户，举进货 2 万、成交 2.1 万、国补 2000 的例子：消费者付 1.9 万，补贴若两三个月才到账，销售越多短期现金越紧。他明确样本有限；随后推测京东自营溢价更强，国补回款可能变成即时零售及出海弹药，并把稳定币结算计划作为线索。作者多次说明京东部分纯属推测。", "lesson": "最可学习的是从销量转看应收回款和营运资金，而非直接相信平台战略推断。补贴回款通常先补回已垫资金，不能天然等同新利润或横财；地方商户的用途约束也不能无证据外推京东，更不能据此确认外卖补贴资金来源。"}, {"id": "30999308", "author": "老板的老板 AI Exec", "date": "2025-06-23", "title": "继续说说 DoveTree LLC 的事情，AI 太好用：", "chars": 1822, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/30999308", "path": "library/30999308.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "AI4S付款链｜把term sheet、首付款、里程碑、版税与悲观情景分开，是晶泰商业化研究中最完整的付款链样本。", "core": "2 | 公告条款对晶泰科技（XtalPi, 02228）的长期意义 维度 细节（源自公告） 长期价值 风险点 即时现金流 首付款 1 亿美元 （10 日内 5 100 万＋180 日内 4 900 万）( prnewswire.com ) 相当于晶泰 2023 全年营收 1.3× → 可支撑后续机器人实验室扩产、海外 BD 合同仍是 non-binding term-sheet ；最终协议若延期或缩水将影响确认 里程碑 & 分成 开发＋销售里程碑 “数十亿美元” 上限＋个位数销售提成 若任何 1-2 管线进入临床后期，晶泰将形成高杠杆 royalty 流水，显著抬升估值弹性 AI 早期 hit", "lesson": "把合同、融资、客户付款、收入确认与自由现金流分开，资本开支规模不自动等于供应商利润。"}, {"id": "29675547", "author": "价值&投资", "date": "2025-05-15", "title": "长期期权的操作汇总", "chars": 1178, "read": true, "has_note": true, "themes": ["NVDA", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/29675547", "path": "library/29675547.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "期权与成本｜把LEAPS分批兑现到负成本；适合研究现金回收、剩余市值和到期风险的区别。", "core": "期权分批建仓和出货的一些操作策略： 1、市场被误判时建仓 leaps call，或者卖 put 2、波动起来分批卖一部分，拿回成本 3、上涨继续分批出，甚至 T 成负成本，剩下的安心拿着，我认为这要叫期权的安全边际 4、后续时间足够长，也许继续翻几倍，因为成本足够低，就是有波动我们也能拿住 说一下我自己对 long call 操作买入和卖出时机的经验： 1、时机是：大波动低点附近，分批加仓 2、出货时机：因为时间我一般选半年到一年左右，期间有股价冲高的机会，就分批出货把成本拿回来 3、后续根据时机分批出完，不要等待", "lesson": "把方向、期限和最大损失分开记录；同向正股与衍生品需合并计算风险。"}, {"id": "27728873", "author": "京城Z先生", "date": "2025-03-02", "title": "美股实盘-20250302：瞎整，就死给你看", "chars": 4043, "read": true, "has_note": true, "themes": ["GOOG", "PBR", "GOOGL", "NVDA", "TSLA", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/27728873", "path": "library/27728873.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "现金与组合｜现金接近零的持仓记录，用于检验单股估值纪律为何未必带来组合层防守。", "core": "交易： 清仓巴西石油，买入等额微策略 卖出等额微策略，买入原比例巴西石油 持仓： 谷歌 23.8%，英伟达 29.1%，巴西石油 8.7%，大饼 ETF 17.2%，微策略 19.4%， 其他/现金 1.8%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "27723655", "author": "股神小顾", "date": "2025-03-01", "title": "二月实盘记录：单月最大亏损", "chars": 856, "read": true, "has_note": true, "themes": ["DJT", "TSLA", "DJTWW"], "source": "https://longbridge.cn/zh-CN/topics/27723655", "path": "library/27723655.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "亏损机制复盘｜逐笔披露接飞刀、追高、仓位失控和期权归零的自述，是分析回本执念与工具叠加的关键样本。", "core": "不知道 等两三年再说 2.美股 这个月最巅峰的时候美股赚了六万港币 最终却亏了 111756 港币 复盘一下做错的交易： 1.捡便宜 买名创优品（觉得其他都涨了 就他没涨）亏损两万多 2.接了 App 飞刀 471 莫名其妙觉得便宜 结果跌到 300 亏损三万多 3.coin 上周五本来期权回本了 前几分钟没平期权去加仓名创优品 回过头期权跌了一点 想等 Coin 起飞 结果当晚黑天鹅 四万多期权归零 60 股正股也亏了 3 万多 加起来七万多 4.mstr 330 多建仓 300 重仓 昨天坐反套亏两万不说 还只接回来了一半（246 卖的 80 股 257 接回来 40 股）然后今天比特币起", "lesson": "把亏损拆成观点、仓位、工具、期限和执行错误，复盘必须转成下一次可检查规则。"}, {"id": "25997222", "author": "价值&投资", "date": "2024-12-11", "title": "2024 年投资复盘总结 - 长短结合策略实战的一年", "chars": 690, "read": true, "has_note": true, "themes": ["9868", "XPEV", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/25997222", "path": "library/25997222.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "收益归因｜2024年收益主要来自特斯拉、小鹏和期权；用于区分主线暴露与跨行业选股能力。", "core": "一句话总结：长短结合策略实战的一年 各仓数据总结： 1、长桥美股收益 141.8%，主要是 $特斯拉(TSLA.US) 和 $小鹏汽车(XPEV.US) 立功，长短结合中期权发挥了很大价值！", "lesson": "将产品里程碑、监管、商业化与估值分别核验，避免用远景替代当前兑现。"}, {"id": "25998887", "author": "輸棟樓的韭菜", "date": "2024-12-11", "title": "2024年度回顾：债券杠杆与科技股换仓", "chars": 1466, "read": true, "has_note": true, "themes": ["TSLA", "HSAI", "SNOW", "AAPL", "U", "MSFT", "PDD", "ASML", "PANW", "CRWD"], "source": "https://longbridge.cn/zh-CN/topics/25998887", "path": "library/25998887.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "仓位与杠杆｜长期美债50%—75%、杠杆上限1.8/2.1的明确规则，是组合失败链的事前证据。", "core": "這次的主動倉，有大致如下幾個方向的原則： 1. 現階段長期美國國債及相關 etf 的總倉位佔比不得小於 50%，不得大於 75%，搭配少量的黃金、石油等資產做保護；2. 股票操作套利為主，投資為輔，投機娛樂；3.上槓桿，槓桿控制在 1.8 以下，極限不得超過 2.1。", "lesson": "把公司质量、增长、资本开支与买入估值分开，同行轮换仍需计算共同因子。"}, {"id": "25816422", "author": "京城Z先生", "date": "2024-12-01", "title": "美股实盘-20241201：最后一个月，该关注什么", "chars": 3676, "read": true, "has_note": true, "themes": ["AAPL", "MSFT", "NVDA", "GOOGL", "GOOG", "MSTR"], "source": "https://longbridge.cn/zh-CN/topics/25816422", "path": "library/25816422.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "加密集中｜BTC ETF与MSTR共同出现时，需把加密价格和净资产溢价视为同一风险因子。", "core": "交易： 卖出剩余的苹果，买入等额英伟达 持仓： 微软 10.8%，谷歌 21.0%，英伟达 7.7%，巴西石油 8.3%，大饼 ETF 17.8%，mstr 18.1%， 其他/现金 8.2%。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "25723141", "author": "輸棟樓的韭菜", "date": "2024-11-24", "title": "套利篇：医渡、B站与多空组合", "chars": 2010, "read": true, "has_note": true, "themes": ["2158", "BILI", "9626", "PDD", "MSFT", "TSLA", "AAPL", "JD", "89618", "9618", "SNOW", "AMD"], "source": "https://longbridge.cn/zh-CN/topics/25723141", "path": "library/25723141.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "相对交易｜多组同行多空的总结；适合研究净敞口、腿部风险和不收敛条件。", "core": "无论是去年年底到今年上半年的做多 $微软(MSFT.US) ，做空 $特斯拉(TSLA.US) ；今年年中的抛弃 $微软(MSFT.US) 转头 $苹果(AAPL.US) ；还是现在财报后重新部署的做多 $拼多多(PDD.US) 做空 $京东(JD.US) ，做多 $Snowflake(SNOW.US) 小空 $AMD(AMD.US) ，本质都是找到两个相关联的公司，做多一个价值低估的，做空一个价值相对高估的，套取潜在的收益差，并避免系统性风险带来的损失。", "lesson": "先标明赚企业成长、估值修复、趋势或相对定价的钱；不同策略使用不同退出条件。"}, {"id": "25306897", "author": "輸棟樓的韭菜", "date": "2024-11-11", "title": "下注前的策略身份：投资篇", "chars": 2338, "read": true, "has_note": true, "themes": ["PBR", "PBR.A", "BRK.B", "BRK.A", "AAPL", "MSFT", "TSLA", "PDD", "2158", "883", "80883", "600938"], "source": "https://longbridge.cn/zh-CN/topics/25306897", "path": "library/25306897.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "策略身份｜明确美债有卖点所以不属于价值投资，展示持有理由如何决定退出规则。", "core": "下面介绍几个我目前在做或潜在的价值投资清单： （其实扪心自问，如果不算配仓长持组合的那部分，我的最大重仓美债并不属于价投，因为我确实有很明确的有卖出点） 1. $伯克希尔哈撒韦-B(BRK.B.US) $苹果(AAPL.US) $微软(MSFT.US) 这三个不说了，特别是微软我写不少了。", "lesson": "先标明赚企业成长、估值修复、趋势或相对定价的钱；不同策略使用不同退出条件。"}, {"id": "25128861", "author": "戴某 DEMO", "date": "2024-11-06", "title": "PDD 的动态跟踪纪要-DEMO", "chars": 814, "read": true, "has_note": true, "themes": ["线上零售与平台竞争", "组合与风险", "估值与预期差"], "source": "https://longbridge.com/zh-CN/topics/25128861", "path": "library/25128861.html", "classification": "本人公开长文", "featured": true, "featured_reason": "PDD估值｜把PDD经营、利润与估值放在一起，是其少数较完整的公司价值分析入口。", "core": "⚫ 预计拼多多 2024 年国内主站 GMV4.5-5 万亿「由于用增无空间、频次提升有限、客单提升缓慢的问题，GMV 增速会迅速跌破 20%，维持略高于社零线上渗透增速的稳态」，阿里约 7 万亿，但是拼多多的订单量已经超越 阿里（淘宝 + 天猫）， 差距主要源于客单价。京东 GMV 约 3.6 万亿，抖音电商 GMV 约 3.5 万 亿。目前只有抖音电商、拼多多还能较高成长速度， 阿里、京东电商 GMV 基本处于稳态， 随着各家补贴投入的 ROI 迅速降低后，各家基于自身发展的资源禀赋和产品形态所构成的业务基本盘日渐清晰。 ⚫ 2023 年拼多多平台整体广告货币化率（广告收入/GMV）3.5-3.6%，2024 年应该可以达到 5% 左右，基于管理层指引，货币化率在这个区间应该不会再大幅提高。", "lesson": "把平台判断拆成供需密度、履约效率、流量/交易变现、竞争投入与股东回报；产业理解仍需经财报口径和估值桥梁验证。"}, {"id": "24470639", "author": "戴某 DEMO", "date": "2024-10-15", "title": "淘宝微信拆墙，大家作何感想？", "chars": 5210, "read": true, "has_note": true, "themes": ["线上零售与平台竞争", "投资方法与认知", "组合与风险", "BABA", "700"], "source": "https://longbridge.com/zh-CN/topics/24470639", "path": "library/24470639.html", "classification": "本人公开长文", "featured": true, "featured_reason": "平台结构｜支付入口变化如何影响数据与信贷利润，展示戴某从产业结构落到价值归属。", "core": "在淘宝的支付体系中，支付宝的独占地位被打破，部分用户可能会因为使用习惯或其他因素选择微信支付，这会在一定程度上导致支付宝在淘宝平台上的支付份额有所下降。值得注意的是，有不少论调是从非淘系支付份额的角度看待这次影响，认为淘系占比有限，所以影响也就有限。 但蚂蚁金服的利润来源主要是信贷类、网商银行等，这些业务的运转都一定程度上依托支付宝用户的活跃度和数据源，其中数据的广度和厚度都直接会影响到业务营收/利润规模，所以这一轮变化对蚂蚁金服的实际影响可能是超过支付份额变化所体现出的，因为淘系的支付行为数据，是质量相对更高的数据源。", "lesson": "把平台判断拆成供需密度、履约效率、流量/交易变现、竞争投入与股东回报；产业理解仍需经财报口径和估值桥梁验证。"}, {"id": "20274917", "author": "京城Z先生", "date": "2024-03-31", "title": "本周实盘-20240329：AI 降温，大宗升温，降息摇摆", "chars": 4028, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/20274917", "path": "library/20274917.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "组合暴露｜2024年苹果、微软、能源、长债与BTC的具体权重，是防守仓迁移前的重要基线。", "core": "交易： 无 持仓： 苹果 15.5%，微软 14.2%，巴西石油 23.3%，谷歌 4.3%，TLT 31.5%，TMF 2.8%，大饼 ETF 8.5%，现金/其他 0%。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "20003077", "author": "京城Z先生", "date": "2024-03-17", "title": "本周实盘-20240317：清仓 2 只重仓股票", "chars": 3722, "read": true, "has_note": true, "themes": ["MSFT", "PBR.A", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/20003077", "path": "library/20003077.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "机会成本｜罕见同时清仓两只股票，展示低频作者在机会成本变化时如何执行非常规动作。", "core": "交易： 以均价 161.53 清仓 强生 以均价 149.86 清仓 帝亚吉欧 持仓： 苹果 15.9%，微软 14.3%，巴西石油 17.8%，谷歌 4.1%，TLT 23.0%，TMF 2.7%，现金/其他 22.3%。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "12064850", "author": "輸棟樓的韭菜", "date": "2024-03-12", "title": "长期美债重仓逻辑：防守资产被误当保本组合", "chars": 1717, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/12064850", "path": "library/12064850.html", "classification": "补充对照长文；原创性未逐篇认证", "featured": true, "featured_reason": "长债反证｜把TLT描述为结构性风险保护工具；后续组合回撤为这一承诺提供了直接反例。", "core": "2024-03作者称近50%主仓配置长期美债/TLT，以票息加降息资本利得吸引力为主，粗估两年20%、五年70%空间；认为股市发生结构性风险时可卖债抄底，半仓债可使其不担心股票损失。", "lesson": "好处是先想股跌时买入资金从何而来；错误是把低信用风险与低价格风险混同。收益率差×剩余年数忽略票息现值、有效久期和凸性；联储降息也不等于长端收益率等幅下行。TLT无个人固定到期兑付，股债相关性还可能转正。其2025年终自述证实组合保护失效。"}, {"id": "11739865", "author": "晓风 morning_wind", "date": "2024-02-24", "title": "美股持仓复盘（20240223）", "chars": 1046, "read": true, "has_note": true, "themes": ["NVDA", "TAL", "PDD", "LI", "2015", "TSLA", "GOOGL", "GOOG", "AMD"], "source": "https://longbridge.cn/zh-CN/topics/11739865", "path": "library/11739865.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "证据驱动换仓｜从AMD重新排序到NVDA、TSM等，展示新增产品与财报证据如何改变持仓。", "core": "之所以说 需求曲线更加健康了是因为，英伟达的财报里披露了一个我认为非常关键的信息：需求侧这里，已经有 40％的芯片应用场景是推理端而非训练端了。", "lesson": "按产品、客户、架构和利润持续时间拆解；多只芯片股仍可能依赖同一资本开支周期。"}, {"id": "10678549", "author": "晓风 morning_wind", "date": "2023-12-26", "title": "2023 年投资总结", "chars": 887, "read": true, "has_note": true, "themes": ["LI", "XPEV", "PDD", "AMD", "NVDA", "AAOI", "SMCI", "9966"], "source": "https://longbridge.cn/zh-CN/topics/10678549", "path": "library/10678549.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "失败复盘｜XBI、LABU成为最大负贡献；把行业判断、三倍ETF和期权期限错配放到同一案例中。", "core": "负向收益最大贡献 $标普生物技术 ETF - SPDR(XBI.US) $标普生物技术 3 倍做多 - Direxion(LABU.US) 年中 xbi 一路涨到 95 的时候，预判 xbi 进入了右侧，在 90 一线加仓超配了不少正股，3x 做多，以及期权。", "lesson": "行业空间不能替代临床、融资与期限风险；杠杆ETF还需处理每日复位和波动损耗。"}, {"id": "9837655", "author": "京城Z先生", "date": "2023-09-14", "title": "我为什么会在此时买入苹果？", "chars": 1233, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/9837655", "path": "library/9837655.html", "classification": "平台长文；原创性未逐篇认证", "featured": true, "featured_reason": "机会成本｜买苹果前同时比较短债收益、其他候选、估值与现有仓位，展示一笔新增现金怎样作选择。", "core": "作者以175.68美元加仓苹果约组合3%，持仓从11.9%到14.8%；资金来自新入金、分红和闲钱。选择不是因跌了就买，而是观察池普遍离买点远，苹果低于自己合理估值下限，产品乏味与谣言未伤根基。另有32.3%美债使本次风险可承受。", "lesson": "可学把每笔现金的用途与已有仓位一起比较。作者没有披露估值模型的关键参数；“看空就该做空”不成立，判断方向与承担做空的无限损失是两件事。美债也须区分短长久期。"}, {"id": "44087768", "author": "京城Z先生", "date": "2026-09-27", "title": "美股周报：画线师也披露持仓了（20260927）", "chars": 2347, "read": true, "has_note": true, "themes": ["STRD", "STRK", "STRF", "STRC", "MSFT", "PL", "AMZN", "MU", "MSTR", "CRM", "ORCL", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/44087768", "path": "library/44087768.html", "classification": "平台长文；原创性未逐篇认证", "core": "仓位增持则倾斜 AI 算力与企业软件 ，同月账户买进 50 万至 100 万美元的 $英伟达(NVDA.US) ，并建仓 $财捷(INTU.US) 、 $迈威尔科技(MRVL.US) 、 $赛富时(CRM.US) 各 100 万至 500 万美元。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "43988631", "author": "股神小顾", "date": "2026-09-21", "title": "股票周报 P10:美 A 同时止跌，小顾稳中向好", "chars": 811, "read": true, "has_note": true, "themes": ["PATH", "NVO", "UBER", "605499", "9980", "9999", "9899", "3993", "9988", "AA", "603220", "600066"], "source": "https://longbridge.cn/zh-CN/topics/43988631", "path": "library/43988631.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "这周最终获利 900 港币整，差强人意了，算是短期止跌了 ______ 三、A 股账户数据 项目 数值 上周净值 61,291 本周净值 45,264 出金 15,925 本周回撤 -102 累计收益 11,189 ______ 四、A 股本周交易心得 这周硬扛到周四，对 A 股彻底失去信心，割肉了中贝通信、东鹏饮料、万丰奥威，全都涨了，拿着的宇通客车暴跌，只能感慨命运捉弄，但是这一波大浪淘沙，手里剩下的宇通、思源、洛阳钼业成了三只我最拿的住股票，也算是付出几千块钱的代价，让我的持仓更健康了 简单来说，这周 A 股和美股同时止跌，期待下一周的行情", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "43981979", "author": "京城Z先生", "date": "2026-09-20", "title": "美股周报：反向操作（20260920）", "chars": 2062, "read": true, "has_note": true, "themes": ["TSM", "AVGO", "AMD", "MSTR", "GOOG", "GOOGL", "GOOGN", "GOOGM", "COIN", "STRC", "STRD", "STRF"], "source": "https://longbridge.cn/zh-CN/topics/43981979", "path": "library/43981979.html", "classification": "平台长文；原创性未逐篇认证", "core": "这周全网最关注的事就是 FOMC 了，最终结果来看是比较鹰的，虽然没超过最悲观的预期，但还是毕竟糟糕的，计提了两次加息的预期，按照历史上的几次加息周期来看，后面坠机的概率都不低。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "43935181", "author": "爱妻的交易员", "date": "2026-09-17", "title": "NVDA下跌情景的论证缺口", "chars": 1765, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/43935181", "path": "library/43935181.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "以订单、收入、毛利和客户资本开支仍强，论证跌至150基本不可能，除非AI叙事结束。", "lesson": "这是把经营无恶化等同于股价有底。估值、贴现率与风险偏好也能造成下跌；没有给出150对应估值及情景分布，结论确定性明显超过证据。"}, {"id": "43930272", "author": "股神小顾", "date": "2026-09-16", "title": "我在城中村炒美股", "chars": 1237, "read": true, "has_note": true, "themes": ["NEM"], "source": "https://longbridge.cn/zh-CN/topics/43930272", "path": "library/43930272.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我记得 24 年 1 月份 A 股 2600 点的时候，当时每天都是无数人痛骂，但后来呢，它一飞冲天，一下涨到了 4000 点，全面牛市。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "43878096", "author": "京城Z先生", "date": "2026-09-13", "title": "美股周报：博弈激烈，提前结账收摊（20260913）", "chars": 2298, "read": true, "has_note": true, "themes": ["BE", "INTC", "GOOGL", "NVDA", "GOOG", "META", "OpenAI", "GOOGN", "4335"], "source": "https://longbridge.cn/zh-CN/topics/43878096", "path": "library/43878096.html", "classification": "平台长文；原创性未逐篇认证", "core": "按照此叙事，加息是利空股市的，尤其是估值高的科技股，该继续跌才对，但周五开盘以后反而直接爆拉，标普、纳指一度涨了 1%，黄金也涨，大饼更是一度突破 8w，唯一合理的解释就是： 市场已经提前计提了加息两次的预期，预判你的预判，加息落地那一刻，变成了利空出尽等于利好？", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "43854642", "author": "輸棟樓的韭菜", "date": "2026-09-11", "title": "苹果：产品组合如何传导到收入与估值", "chars": 2029, "read": true, "has_note": true, "themes": ["TERN", "MAX", "1810", "XIACY", "81810", "AAPL", "603020", "COOK", "PRO", "AIR", "DUO", "HXXD"], "source": "https://longbridge.cn/zh-CN/topics/43854642", "path": "library/43854642.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "即摆在 Ternus 面前的路有三条： 革新产品：推动更多的人愿意换机，甚至是提前换机（iPhone17 来看，Apple intelligence 推动的换机已经成功） 针对愿意付出更高价格、有其他更多需求的人：让他们能够花更多的钱，去买一部他们想要的、价格更高、利润更高的产品 推出更多的 SKU：覆盖并满足更多不同类型的需求和不同类型的人群 苹果的高盈利能力是件非常好的事情，但是长年以来持续推动的高 ROE 增长，对苹果来说是一个魔咒。", "lesson": "把公司质量、增长、资本开支与买入估值分开，同行轮换仍需计算共同因子。"}, {"id": "43816119", "author": "熊猫校长Ming", "date": "2026-09-09", "title": "纳指微跌，AI 基建、算力续涨", "chars": 742, "read": true, "has_note": true, "themes": ["META", "NBIS", "LITE", "SPCX", "UXSD"], "source": "https://longbridge.cn/zh-CN/topics/43816119", "path": "library/43816119.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "9月观察AI硬件相对指数强势，关注Agent分发入口、端侧推理与生产力，将亲自使用AI作为研究问题来源。", "lesson": "可把产品体验与产业假设连起来；个人体验不能估计行业付费率，相对强势也不是长期盈利证明。该篇是短论而非深度长文，不应凑1000长文数量。"}, {"id": "43777464", "author": "京城Z先生", "date": "2026-09-06", "title": "美股周报：数据打架，叙事分化（20260906）", "chars": 2468, "read": true, "has_note": true, "themes": ["SSNGY", "SKHY", "SKHYV", "IBKR", "MSFT", "C", "AAPL", "BLK", "BE", "HOOD", "MU", "C-R"], "source": "https://longbridge.cn/zh-CN/topics/43777464", "path": "library/43777464.html", "classification": "平台长文；原创性未逐篇认证", "core": "按这个数据，你别管真的假的，那应该开始走加息爆杀科技估值的剧本，结果公布完时盘前的美股没什么反应，也就加密和金属跌了一点点，当时虽然没想明白怎么回事，但肯定说明市场不认可这个结果，可能要预判你的预判，提前埋伏你下个月 “按需下修” 的预期了。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "43776920", "author": "股神小顾", "date": "2026-09-06", "title": "股票实盘 P8:A 股回调，美股新高", "chars": 525, "read": true, "has_note": true, "themes": ["002028", "NVO", "603220", "9999", "9899", "3993", "RKLB", "DY", "600066", "NTES", "603993"], "source": "https://longbridge.cn/zh-CN/topics/43776920", "path": "library/43776920.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "美股 初始上周净值：96523 HKD 本周净值：116285 HKD 新增入金：17900 HKD 本周交易盈利：1862 HKD，创 8 周以来净值新高 8 周周度盈亏（港币）： 第 1 周：‑7900 第 2 周：+770 第 3 周：+3283 第 4 周：+10665 👉阶段最大胜利周 第 5 周：+2500 第 6 周：+2300 第 7 周：‑787 第 8 周：+1862 8 周累计交易盈亏：+12693 港币 本周一共做了 176 笔交易 大多数交易盈利为不到 10 港币 这几周主要是被中钙拖累了，不然净值会更漂亮 本周失误 1⃣️乌龙指，121 买入网易，被迫被套 本周亮点", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "43776026", "author": "AngerBird", "date": "2026-09-05", "title": "投资的底层感悟：不要被股价与消息裹挟，做快乐的价值博弈", "chars": 1346, "read": true, "has_note": true, "themes": ["MRNA", "NOW", "MSFT", "FIG", "INTC", "TSLA", "4335"], "source": "https://longbridge.cn/zh-CN/topics/43776026", "path": "library/43776026.html", "classification": "平台长文；原创性未逐篇认证", "core": "回看 figure，Figma、ServiceNow、英特尔、微软、特斯拉，mrna 等等无一例外都经历过大段回调。", "lesson": "把人物与组织判断落到客户留存、定价权、现金流和资本回报；框架问题不等于答案已证实。"}, {"id": "43666685", "author": "京城Z先生", "date": "2026-08-30", "title": "美股周报：问题的关键，是要找到关键的问题（20260830）", "chars": 1092, "read": true, "has_note": true, "themes": ["MRVL", "SPCX", "000333", "NVDA", "300", "UXSD"], "source": "https://longbridge.cn/zh-CN/topics/43666685", "path": "library/43666685.html", "classification": "平台长文；原创性未逐篇认证", "core": "当然大饼现货仓位我没动，毕竟本来就没买多少，虽然我认为 “这次也一样”，但考虑到买入成本够低，还是等 q4 或者明年找个机会加仓合适，加密股不太担心卖飞，后面肯定有机会接回来，短期 fomo 情绪有点高，略有恐高。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "43663778", "author": "股神小顾", "date": "2026-08-29", "title": "股票周报 P7:A 股五日全红，美股首次回调", "chars": 1039, "read": true, "has_note": true, "themes": ["9999", "9899", "9888", "DY", "RKLB", "NVO", "META", "9988", "PDD", "CLSK", "NTES", "89888"], "source": "https://longbridge.cn/zh-CN/topics/43663778", "path": "library/43663778.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "目前手里 10 股，不打算加仓了，做好了长期持有的准备 教训就是：不能碰小票 Ps：这个票在中文社区无人讨论，属于是我一个人的武林了 2⃣️rklb 大火箭和小火箭我是同时持有的，大火箭已经盈利走人（主要是波动不及预期，就清仓了），小火箭还在深套中 目前 40 股小火箭，还有 200 股 15 成本的双倍小火箭要行权，只能熬周期了，躺平大法 3⃣️nvo nvo 本周高开低走，我卖出了三周后 45.5 的 put，打算磨一下期权 nvo 的波动很小了，做网格的体验不太好，唯一的策略就是磨期权，也要警惕利空暴杀 4⃣️百度 百度我继续躺平，102、101、100 分别开的仓，现在还有 20 股，", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "43643082", "author": "熊猫校长Ming", "date": "2026-08-28", "title": "MRVL 财报全线超预期，为什么股价反而跌了？", "chars": 1049, "read": true, "has_note": true, "themes": ["MRVL", "GOOG", "GOOGL", "GOOGN", "LITE", "AVGO", "COHR", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/43643082", "path": "library/43643082.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "MRVL财报后将短期下跌归因于已计入Google远期增量，而FY28收入目标已含部分合作；关注FY29更新、定制业务毛利和客户产品扩散。", "lesson": "有用的是防止合作消息双重计入预测，并把增收与毛利稀释一起看。但断言还会涨缺少估值区间，10月6日Investor Day在研究日仍属未来，不能列为已兑现。"}, {"id": "43551932", "author": "股神小顾", "date": "2026-08-24", "title": "美股周报 P6:准备迎接周一暴击", "chars": 859, "read": true, "has_note": true, "themes": ["META", "9988", "9888", "89988", "HBBD", "BABA", "89888", "HBUD", "BIDU"], "source": "https://longbridge.cn/zh-CN/topics/43551932", "path": "library/43551932.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "本周的错误交易来自于三笔，第一笔就是百度，101 块钱的时候接了飞刀，因为我错误的理解为利空落地，但是我忘了一个点：不在主线的股票，不管财报好坏它都会跌，不存在所谓的利空落地，只有利好落地。", "lesson": "把亏损拆成观点、仓位、工具、期限和执行错误，复盘必须转成下一次可检查规则。"}, {"id": "43550134", "author": "京城Z先生", "date": "2026-08-23", "title": "美股周报：难道这次不一样？（20260823）", "chars": 1731, "read": true, "has_note": true, "themes": ["MRVL", "HOOD", "ORCL", "AAPL", "NEM", "NVDA", "ORCL-D"], "source": "https://longbridge.cn/zh-CN/topics/43550134", "path": "library/43550134.html", "classification": "平台长文；原创性未逐篇认证", "core": "NVDA 如果回答三个问题： AI 需求继续超预期； Rubin 进度正常； hyperscaler 资本开支仍然强； NVDA 本周还有一个很值得注意的动作，投资美国数据中心开发商 Cloverleaf Infrastructure ，帮助建设 AI 数据中心电力、选址、冷却等基础设施。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "43528180", "author": "AngerBird", "date": "2026-08-21", "title": "真正的投资复利，都是 “熬” 出来的：读懂竹子定律，读懂 99% 人的人生", "chars": 1321, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/43528180", "path": "library/43528180.html", "classification": "平台长文；原创性未逐篇认证", "core": "所有一夜开窍、一年蜕变、三年进阶的投资高手， 本质都是： 熬过了别人熬不住的扎根期， 守住了别人守不住的寂寞期， 扛住了别人扛不住的回撤期。", "lesson": "反省需由后续规则和行动验证，不能把巨大回撤浪漫化为必经之路。"}, {"id": "43484100", "author": "老板的老板 AI Exec", "date": "2026-08-19", "title": "2228.hk 财报解读 by Jason", "chars": 1498, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/43484100", "path": "library/43484100.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "所以眼下不是生存风险，而是 资本效率 ：这么厚的现金，能不能换来可复制收入、毛利率恢复和真正的 pipeline milestones。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "43471647", "author": "躺平de交易员", "date": "2026-08-19", "title": "美股头部大模型盈亏拆解：OpenAI、Anthropic 的亏损本质与盈利伏笔", "chars": 1534, "read": true, "has_note": true, "themes": ["OpenAI", "NVDA", "GOOG", "GOOGL", "GOOGN", "SKHY"], "source": "https://longbridge.cn/zh-CN/topics/43471647", "path": "library/43471647.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "OpenAI、Anthropic 作为全球两大顶级闭源大模型厂商，虽未上市，但属于美股 AI 板块的 “定价锚”，直接决定微软、谷歌等 AI 生态股的估值中枢。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "43420340", "author": "京城Z先生", "date": "2026-08-16", "title": "美股周报：求稳还得选中登（20260816）", "chars": 2714, "read": true, "has_note": true, "themes": ["AAOI", "NVDA", "BX", "SKHY", "COIN", "COHR", "NBIS", "MSTR", "CRCL", "HOOD", "LITE", "CRWV"], "source": "https://longbridge.cn/zh-CN/topics/43420340", "path": "library/43420340.html", "classification": "平台长文；原创性未逐篇认证", "core": "》里预设的理想状态比较吻合， sndk 不再只是一家依靠 nand 价格上涨赚钱的周期公司，而是有机会凭借长期合约、技术升级和大规模回购，转型为一台持续产生现金流的「复利机器」。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "43422509", "author": "熊猫校长Ming", "date": "2026-08-16", "title": "AI研究助手：保留反方与判断修改记录", "chars": 4679, "read": true, "has_note": true, "themes": ["TSM", "NVDA", "MRVL"], "source": "https://longbridge.cn/zh-CN/topics/43422509", "path": "library/43422509.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "作者坦承使用AI参与研究与写作，并自述搭建研究助手，将“能买吗”拆成业务、估值、波动、资金期限和组合适配；要求助手先找反方，保存上次判断、证据和什么会让自己改看法，而非替自己下单或拥有观点。", "lesson": "可学的是可追问过程：每条结论附原始证据、最强反论及下一季检验指标。顺畅文字和产业链比喻不是独立研究质量保证；这是作者自述工作流，不证明其每篇财务数字已核实，仍应逐项抽检。"}, {"id": "43414269", "author": "股神小顾", "date": "2026-08-15", "title": "美股周报 P5：连续红了四周", "chars": 658, "read": true, "has_note": true, "themes": ["NVO", "AA", "META", "ALB", "ALB-A"], "source": "https://longbridge.cn/zh-CN/topics/43414269", "path": "library/43414269.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "目前手里也有不少被套的票捞出来分析一下 1⃣️诺和诺德 这个票我是 47 块 4 建仓的，拿了一周发现中计了，这个票波动太小了，不适合做网格，也不适合收租（权利金太少） 唯一能做的就是高抛低吸，低价买进去，涨了立即卖，可惜我被套了 2⃣️稳定币 我目前 20 股仓位被套着，不过被套得不深，网格也没有做成。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "43329315", "author": "熊猫校长Ming", "date": "2026-08-11", "title": "去存留光：三张收据，今晚验货", "chars": 2892, "read": true, "has_note": true, "themes": ["GLW", "LITE", "COHR", "AAOI", "NVDA", "MRVL", "AVGO"], "source": "https://longbridge.cn/zh-CN/topics/43329315", "path": "library/43329315.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "LITE/COHR财报前反对把存储波动厌恶误认光链确定性，要求检验AI收入、800G/1.6T/CPO认证交付、毛利与现金三组证据。", "lesson": "把轮动解释为不同风险的交换有价值：存储是高利润回落风险，光是交付与估值兑现风险。政策传闻不能替代产能和客户认证；不能把这篇标题当作者已卖存买光。"}, {"id": "43320673", "author": "股神小顾", "date": "2026-08-11", "title": "青梅煮酒论股票", "chars": 1755, "read": true, "has_note": true, "themes": ["AA", "META", "1787", "SNPS", "AMZN", "3993", "2899", "TSLA", "UBER", "MSFT", "HOOD", "600547"], "source": "https://longbridge.cn/zh-CN/topics/43320673", "path": "library/43320673.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "” 最后，小顾一字一句，定自己终生交易体系： “我体系永远泾渭分明，绝不混乱： 美股三核心：波动、收租、抄底。", "lesson": "比较业务增量、资本开支、利润率和估值，热门公司仍需买价。"}, {"id": "43292746", "author": "京城Z先生", "date": "2026-08-09", "title": "美股周报：深蹲起跳，大幅修复（20260809）", "chars": 1189, "read": true, "has_note": true, "themes": ["AMZN", "MSFT", "GOOG", "GOOGL", "GOOGN"], "source": "https://longbridge.cn/zh-CN/topics/43292746", "path": "library/43292746.html", "classification": "平台长文；原创性未逐篇认证", "core": "2026-08-09宣布不再公开具体持仓、个股交易及净值。此前清仓后补回六成，以债>金=科技>加密配置，减小高波动小型科技，转部分大科技；强调利空不跌、利率叙事饱和和轮动，计划逐步补仓。", "lesson": "此帖改变证据等级：后续周报可研究观点，却不能延续之前精确持仓和净值的可复核性。其风格从2023低频估值再平衡，转向叙事/资金轮动与价格反应，必须按阶段评价。市场资金有限、券商一定受益等说法需独立数据；比特币利空不跌可作价格观察但不是下跌风险已消失。"}, {"id": "43288006", "author": "股神小顾", "date": "2026-08-08", "title": "股票实盘 P245（周报 P4）：清仓大甩卖", "chars": 990, "read": true, "has_note": true, "themes": ["NBIS", "META", "CRWV", "UBER", "NVO", "SKHY", "SKHYV", "NEM", "AA", "NVDA", "SPCX", "ALB"], "source": "https://longbridge.cn/zh-CN/topics/43288006", "path": "library/43288006.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "nvo 的话，我是在财报前卖出了 43 的 put，这一笔交易赚了 69 美金。", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "43260561", "author": "熊猫校长Ming", "date": "2026-08-07", "title": "闪迪财报全 A，股价先给了个 C", "chars": 2415, "read": true, "has_note": true, "themes": ["SNDK", "MU", "SKHY", "SKHYV"], "source": "https://longbridge.cn/zh-CN/topics/43260561", "path": "library/43260561.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "SNDK财报后分辨价格与量增长、数据中心与消费端、10份协议与此前3份420亿口径、金融担保与到账现金、回购授权与执行。", "lesson": "这篇比早期Ming更重口径边界，适合作为周期股阅读模板。将未来协议和回购上限当收益保底均不成立；单日弱于同行原因仍是作者推断。"}, {"id": "43261731", "author": "股神小顾", "date": "2026-08-07", "title": "美股最容易踩的七个坑：我是怎么迭代的", "chars": 2018, "read": true, "has_note": true, "themes": ["AMZN", "SKHYV", "NOA3", "NOK", "GOOG", "9992", "PDD", "SKHY", "GOOGL", "6869", "NVDA", "DUOL"], "source": "https://longbridge.cn/zh-CN/topics/43261731", "path": "library/43261731.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我举个例子吧，有些时候修复是特别慢特别慢的，比如多邻国，比如 BMNR， 过去快一年了也没有任何修复，你买的一年的期权也差不多归零了，何况这个 iv 还高的要命，当时你给的利息都可能有 40 个点了。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "43173933", "author": "股神小顾", "date": "2026-08-04", "title": "股票实盘 P224（上周周报）：点石成金手", "chars": 639, "read": true, "has_note": true, "themes": ["TSLA", "GLW", "SKHY", "SKHYV", "TSM", "META", "COIN", "SNPS", "NDAQ"], "source": "https://longbridge.cn/zh-CN/topics/43173933", "path": "library/43173933.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "1⃣️312 买入 2 股特斯拉 2⃣️395 清仓 2 股新思科技，372.5 买入 2 股新思科技，382 清仓 3⃣️119 买入 10 股康宁，120 清；118 买入 10 股康宁，119 清 4⃣️118 买入 7 股海力士，120 清；124、117 分别买入 10 股，120、124 清；122 最后买入 10 股，125 清 5⃣️387 买入 3 股台积电，388 清 6⃣️528.5 买入 2 股 meta，535 清（循环 3 次） 7⃣️143 买入 9 股 coin，145.8 清 7 笔交易全部成功，清仓的六个股票无一例外全部起飞，我仿佛是点石成金的魔术师，经过我", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "43143646", "author": "熊猫校长Ming", "date": "2026-08-03", "title": "熊猫校长 AI 基建月报｜7 月：问题变了，主角没换", "chars": 2899, "read": true, "has_note": true, "themes": ["MU", "AMZN", "700", "80700", "TCTZF", "TCEHY", "9988", "BABA", "89988", "META", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/43143646", "path": "library/43143646.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "7月月报把研究从谁最缺推进到谁付款、为何持续付款，新增工作流入口、续费、权限数据和实际使用作为AI收入验证。", "lesson": "能公开记录认识变化，优于恒定口号；但云收入、芯片业务和AI业务口径可能重叠，不能相加。使用案例有助产生问题，不替代付费留存和利润数据。"}, {"id": "43140395", "author": "京城Z先生", "date": "2026-08-02", "title": "美股实盘：献祭 AI 股神，锁定利润收摊（20260802）", "chars": 2004, "read": true, "has_note": true, "themes": ["GOOG", "LITE", "TSM", "SNDK", "NVDA", "MSFT", "GOOGL", "AMZN", "MSTR", "AAPL", "GOOGN", "STRC"], "source": "https://longbridge.cn/zh-CN/topics/43140395", "path": "library/43140395.html", "classification": "平台长文；原创性未逐篇认证", "core": "这哥们持仓和我有几个重叠的 sndk lite be，所以我们的净值走势差不多，我年内最高收益率 100%，他上了据说四倍杠杆 + 做空应用股，所以在主升阶段年内最高收益率 400%+，可惜 7 月这波快速杀跌选择硬扛，我 100% 正股的情况下利润都回吐了 40%，所以他扛不住是必然的。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "42938313", "author": "京城Z先生", "date": "2026-07-26", "title": "美股实盘：牛熊分界线，选方向站队（20260726）", "chars": 1607, "read": true, "has_note": true, "themes": ["GOOGL", "BE", "MRVL", "LITE", "GLW", "NEM", "NOK", "MU", "GOOG", "SNDK", "NVDA", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/42938313", "path": "library/42938313.html", "classification": "平台长文；原创性未逐篇认证", "core": "周五的无差别坠机，我也并没有找到像样的新理由，主要还是老一套： 美债利率到牛熊分界线了，油价又到压力位了，特师傅又搞关税战了，谷歌资本开支增加但现金流首次转负，担心 AI 基建游戏玩不下去了。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "42939736", "author": "周树人的交易员", "date": "2026-07-26", "title": "晶泰控股：旧模式退潮，盈利承压后的 AI 成长再平衡", "chars": 1056, "read": true, "featured": true, "featured_reason": "经营更新｜晶泰预亏后拆开授权收入高基数、持续收入与研发消耗，提出可继续跟踪的商业化指标。", "has_note": true, "themes": ["晶泰", "收入质量", "研发ROI", "反证", "2228", "MEDI"], "source": "https://longbridge.cn/zh-CN/topics/42939736", "path": "library/42939736.html", "classification": "作者原创分析或复盘", "core": "面对2026H1预亏，先区分2025H1大额授权首付款造成的高基数与常规业务，再比较下半年收入和研发；提出AI4S收入、现金、研发资产转化、毛利率、全年目标和授权波动六项观察清单。承认没料到研发增加幅度。", "lesson": "这是对旧档案的实质升级：不是只数合作，而已追问研发如何形成可量化持续收入。数字本批未逐项公告核对，应作为作者分析。单纯剔除首付款也可能过度美化正常化利润；需一致处理收入与对应研发、授权成本、现金消耗，不能只剔除不利或偶发项。"}, {"id": "42868742", "author": "熊猫校长Ming", "date": "2026-07-23", "title": "谷歌开奖：水龙头拧得更大，现金流却转负了", "chars": 2176, "read": true, "featured": true, "featured_reason": "事后更新｜把谷歌增加AI投入与自由现金流转负并列，区分供应商的新增订单和付款方的股东回报。", "has_note": true, "themes": ["GOOG", "GOOGL", "META", "AMZN", "GOOGN", "AVGO", "NVDA", "MU", "SKHY", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/42868742", "path": "library/42868742.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "财报后按前文标准判capex加码、但区分硬件供应链需求利好和谷歌自身FCF转负/融资稀释压力，说明产业需求与股东回报可以背离。", "lesson": "可迁移的做法是同一事件按付款人/收款人分别分析。原帖列多项财务数字，除本批Micron外尚未逐项核验，报告应用“作者记载”。 此轮复核：季度FCF约负58.55亿美元而TTM仍正；2424.74亿美元为现金加有价证券，非纯现金。简化剔除投资收益后EPS约2.85美元，并非公司正式主业EPS；投资收益不能全归于Anthropic。依据同期SEC业绩公告及10-Q，详情见报告深读补充。"}, {"id": "42852809", "author": "熊猫校长Ming", "date": "2026-07-22", "title": "谷歌今晚发财报，我只看一个数字", "chars": 2512, "read": true, "featured": true, "featured_reason": "事前预案｜财报公布前写出资本开支上调、持平、下调三种情景，并用云收入与现金流检验结果。", "has_note": true, "themes": ["GOOG", "GOOGL", "MSFT", "META", "TSM", "SKHY", "NVDA", "AVGO", "GOOGN", "MU", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/42852809", "path": "library/42852809.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "谷歌财报前列资本开支上调/强口径、持平但趋谨慎、下调三情景，并提前提醒EPS可能受Anthropic投资浮盈扭曲，辅看云增速和FCF。", "lesson": "这是本批更强的事前研究样本：事先写验证指标，而非结果后找原因。仍应让capex增长与收入回款共同决定仓位，不能单因上调亮绿灯。 核对发布时间早于当次官方电话会，确属事前列问题；但缺实际持仓与成交，不能以事后讨论推定交易获利。"}, {"id": "42816775", "author": "股神小顾", "date": "2026-07-21", "title": "我为什么不买 space？", "chars": 1088, "read": true, "has_note": true, "themes": ["RXRX", "XRX", "SBSW", "TSLA", "BMNR", "BMNRD", "SPCX", "CLF", "SBET", "XRXDW", "BMNP", "UXSD"], "source": "https://longbridge.cn/zh-CN/topics/42816775", "path": "library/42816775.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "第一次就是在马斯克以身家性命托举特朗普上台之后，特朗普当选那天特斯拉是 280，那时候确实可以梭哈特斯拉的期权，因为你买特斯拉就相当于和马斯克享受战队红利。", "lesson": "比较业务增量、资本开支、利润率和估值，热门公司仍需买价。"}, {"id": "42803630", "author": "股神小顾", "date": "2026-07-20", "title": "股票实盘 P222:被迫清仓", "chars": 654, "read": true, "has_note": true, "themes": ["2600", "AA", "CRWV", "CLF", "TSM", "NVDA", "601600"], "source": "https://longbridge.cn/zh-CN/topics/42803630", "path": "library/42803630.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "上周卖的 46.5 的美国铝业 put 行权了 为了防止仓位被强平，我只能选择平掉手上的部分仓位。", "lesson": "把亏损拆成观点、仓位、工具、期限和执行错误，复盘必须转成下一次可检查规则。"}, {"id": "42746847", "author": "熊猫校长Ming", "date": "2026-07-17", "title": "台积电财报炸了，赚的钱却留不住？", "chars": 2911, "read": true, "has_note": true, "themes": ["OpenAI", "NVDA", "AMZN", "TSM", "ASML", "AVGO", "AAPL", "AMD"], "source": "https://longbridge.cn/zh-CN/topics/42746847", "path": "library/42746847.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "用TSM财报后下跌比较利润与自由现金流，追踪资本开支从云厂到晶圆厂再到设备商，偏好有议价权且能留住现金的环节。", "lesson": "现金流链条有启发，但“钱不会消失”不等于股东价值保全，低capex也不自动优于高回报再投资。需区分维持/成长capex和增量ROIC，不能只按一季FCF排行。"}, {"id": "42646701", "author": "晓风 morning_wind", "date": "2026-07-14", "title": "对话股主晓风：不满仓、不裸杠杆、先保战果——AI 从业者的投资自律", "chars": 4737, "read": true, "featured": true, "featured_reason": "风险纪律｜本人回顾上涨加仓后倒亏、两倍产品减得不够，把产业判断与仓位和杠杆预算分开。", "has_note": true, "themes": ["GOOGL", "PDD", "1810", "81810", "XIACY", "NVDA", "HXXD", "SKHYV", "MU", "AAPL", "GOOG", "GOOGN"], "source": "https://longbridge.cn/zh-CN/topics/42646701", "path": "library/42646701.html", "classification": "编辑采访晓风的公开问答，不是晓风账号原创帖", "core": "股主管理局采访中，晓风把2015年上涨加仓、反转后倒亏归因为均价与暴露不断升高；小米失误让他重视资本和产品周期。他主张止损不看成本，单股常规20%、例外30%，期权卖方须匹配现货。对存储认为供需暂稳但价格受去杠杆冲击，并承认海力士两倍产品冲高减得太少。谷歌底仓可留，高弹性则需新的模型证据。", "lesson": "这是采访中的自述体系，不能据排行或收益宣传验证成绩。最实用的是把产业判断与风险预算分开。卖Put与备兑Call仍承担下跌或封顶风险；正股加同向杠杆产品并非对冲。所谓基本面安全也不等于给定价格与期限安全。"}, {"id": "42600585", "author": "熊猫校长Ming", "date": "2026-07-13", "title": "Meta 涨了 15%，真正变的不是股价（深度研究）", "chars": 4779, "read": true, "has_note": true, "themes": ["META", "CRWV", "AVGO", "OpenAI", "NVDA", "MU"], "source": "https://longbridge.cn/zh-CN/topics/42600585", "path": "library/42600585.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "从Meta一周上涨切入，分已兑现广告推荐收益与未兑现云/自研芯片/API收入，把数据、人才、算力、分发能力放在同一体系，讨论从广告估值向全栈AI估值转变。", "lesson": "最可学的是把已实现与期权式增长分开。强广告现金流本身可支持AI回报，不能认定缺少公有云就是短板；估值比较还需同一利润口径及capex强度，观点多为涨后解释。"}, {"id": "42609854", "author": "躺平de交易员", "date": "2026-07-13", "title": "韩国股市如何利用人工智能牛市收割散户", "chars": 2584, "read": true, "has_note": true, "themes": ["SKHY", "SSNGY", "SKHYV"], "source": "https://longbridge.cn/zh-CN/topics/42609854", "path": "library/42609854.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "二、指数抵达政策目标高位，监管骤然收紧去杠杆，系统性收割散户 当 KOSPI 触及 8000 点历史高位、半导体估值充分兑现、散户杠杆仓位抵达极限后，韩国金融监管风向 180 度急转弯，一套完整的去杠杆组合拳同步落地，直接击碎牛市泡沫： 限制杠杆产品供给：停止审批新增单股杠杆 ETF，给现有产品设置规模天花板，禁止新资金申购，仅允许赎回；下调杠杆倍数，弱化再平衡机制带来的抛压冲击； 大幅抬高融资门槛：将三星、SK 海力士个股融资保证金比例从 45% 上调至 60%，压缩散户可撬动杠杆空间，缩短平仓预警处置时间； 切断场外资金源头：各大商业银行收紧信用贷、消费贷，严查信贷资金流入股市，彻底封堵散", "lesson": "方向、期限、波动率和最大损失需同时匹配；卖方权利金必须扣除义务与尾部风险。"}, {"id": "42598314", "author": "京城Z先生", "date": "2026-07-12", "title": "美股实盘：大力士撑起场子（20260712）", "chars": 1849, "read": true, "has_note": true, "themes": ["MRVL", "LITE", "NVDA", "MU", "GLW", "9988", "BE", "NEM", "SNDK", "NOK", "BABA", "89988"], "source": "https://longbridge.cn/zh-CN/topics/42598314", "path": "library/42598314.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 个股方面， 1、科技： NVDA/GOOG 7 月 10 日，据 The Information 披露，阿里巴巴、字节跳动和 DeepSeek 已获悉，它们可能很快获准购买英伟达 H200 芯片，引发股价上涨。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "42594419", "author": "躺平de交易员", "date": "2026-07-11", "title": "投资是一场认知的修行", "chars": 2127, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/42594419", "path": "library/42594419.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "也正是这份对自我、对人性的通透认知，让我在 2024 年布局 AI 赛道时，能够屏蔽外界杂音、顶住短期波动，坚守自己的判断，最终收获与自身认知相匹配的利润。", "lesson": "复盘要连接到下一次可执行规则，亏损后不得用加杠杆或改目标逃避失效。"}, {"id": "42569436", "author": "爱妻的交易员", "date": "2026-07-10", "title": "从NVDA集中持仓转向新增资金QQQM", "chars": 4599, "read": true, "has_note": true, "themes": ["NVDA", "MSFT", "GOOG", "GOOGL", "AMZN", "AVGO", "META", "GOOGN"], "source": "https://longbridge.cn/zh-CN/topics/42569436", "path": "library/42569436.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "认为巨型企业维持高增速需要更大绝对利润，估值下降会抬高所需增长；不卖原有NVDA，但新增资金主要买QQQM，以减少押单一赢家与追逐行业轮动。", "lesson": "可学研究能力与仓位边界的匹配；QQQM仍有科技及NVDA重叠风险，不代表买全AI产业或保证低回撤。文章反复陈述同一观点，篇幅不等于新增信息量。"}, {"id": "42586046", "author": "股神小顾", "date": "2026-07-10", "title": "写给自己的十条心法，每当想开仓的时候，就看一遍", "chars": 956, "read": true, "has_note": true, "themes": ["HOOD", "BMNR", "BMNRD", "SBET", "MSTR", "COIN", "BMNP", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/42586046", "path": "library/42586046.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "但是我们可以拿很小的仓位做套，涨了就把它卖掉，如果跌了的话就长期持有拿着，前提是价格本身就非常合理了。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "42544518", "author": "Sam港美日记", "date": "2026-07-09", "title": "迈威尔 VS CRDO，谁是最强 AI 互联", "chars": 2489, "read": true, "has_note": true, "themes": ["MRVL", "CRDO"], "source": "https://longbridge.cn/zh-CN/topics/42544518", "path": "library/42544518.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "比较CRDO集中AEC业务与MRVL更广产品及ASIC布局，认为前者弹性大、后者更稳，讨论毛利、客户集中及并购成本。", "lesson": "文中未给可复算价格与估值，却宣称成长性价比；技术指标口径、业务收入分类和GAAP差异须逐项核验，不直接把措辞强度当分析质量。"}, {"id": "42479130", "author": "股神小顾", "date": "2026-07-07", "title": "韩国女孩的夏天", "chars": 988, "read": true, "has_note": true, "themes": ["SKHY", "MU", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/42479130", "path": "library/42479130.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "（写于 2026 年 6 月 18 日） $美光科技(MU.US) $SK海力士(SKHY.US) $闪迪(SNDK.US)", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "42434626", "author": "老板的老板 AI Exec", "date": "2026-07-06", "title": "周大人关于 2228.HK 的技术分析", "chars": 1249, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/42434626", "path": "library/42434626.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "5. Supertrend 6.34 左上角 Supertrend 显示 6.34 ，这代表趋势支撑/止损参考。", "lesson": "技术条件用于执行与止损，不替代公司价值，并计入成本。"}, {"id": "42426171", "author": "京城Z先生", "date": "2026-07-05", "title": "美股实盘：搅 * 棍助力 AI 降温（20260705）", "chars": 1939, "read": true, "has_note": true, "themes": ["BE", "NOK", "MU", "META", "NVDA", "SNDK", "GLW", "NEM", "MRVL", "SSNGY", "GOOG", "LITE"], "source": "https://longbridge.cn/zh-CN/topics/42426171", "path": "library/42426171.html", "classification": "平台长文；原创性未逐篇认证", "core": "尽管这两笔操作都是赚的，但仍然没能阻止我的账户连续第二周回调，而且是大幅下修，主要原因还是之前涨得猛的这些 AI 基建板块个股，短期都涨得比较猛了，然后美股知名搅屎棍 META，突然放出准备出租算力的新闻，市场遂借坡下驴，直接以最惊悚的鬼故事 AI 讲不下去了资本开支要大砍来引发全球暴跌，可看过新闻原文都知道，实际上是 META 自己模型太拉没人用，别人都缺的东西它花不完，只能被迫把中低端算力弄出去降点成本。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "42411029", "author": "熊猫校长Ming", "date": "2026-07-03", "title": "美光赚了 415 亿美元。真正变的，却是它最坏的那一天。", "chars": 2806, "read": true, "has_note": true, "themes": ["MU", "HBM", "NVDA", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/42411029", "path": "library/42411029.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "进一步把美光增长拆成售价、销量、结构和成本，承认本季主要靠涨价；认为长期协议提升最坏情景盈利，但未保护全部生意。", "lesson": "核心框架可学，但“16份五年合同、220亿美元已掏押金”口径不严：汽车合同通常三年，220亿是预计押金及承诺，约180亿现金押金未来收到；合同保护也含违约、诉讼和自身履约风险。"}, {"id": "42262919", "author": "京城Z先生", "date": "2026-06-28", "title": "美股实盘：老登也有第二春（20260628）", "chars": 1867, "read": true, "has_note": true, "themes": ["MRVL", "NVDA", "SNDK", "LITE", "GLW", "TSM", "AAPL", "BE", "INFN", "NOK", "MU", "INTC"], "source": "https://longbridge.cn/zh-CN/topics/42262919", "path": "library/42262919.html", "classification": "平台长文；原创性未逐篇认证", "core": "6月28日买入NOK6.8%，看中收购Infinera后磷化铟晶圆与封测能力。SNDK37%、GLW14%，认为MU财报、长协和保守扩产提升存储盈利可见度；GLW同时受光纤与玻璃基板支持。相反，NVDA拟返还更多现金被他视为再投资空间收窄，考虑换仓。", "lesson": "真正可学的是把老公司新增稀缺资产与下游需求连接。长协是否保量保价、客户退出权和资本开支须进一步验证，不能直接宣布周期消失；回购分红也不证明成长终结。多个AI供应商仍共有客户预算风险。"}, {"id": "42165857", "author": "熊猫校长Ming", "date": "2026-06-25", "title": "美光单季净赚 280 亿美元，但这份炸裂财报里最重要的，不是超预期", "chars": 2577, "read": true, "has_note": true, "themes": ["MU", "GOOG", "GOOGL", "MSFT", "META", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/42165857", "path": "library/42165857.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "美光财报后关注利润资金源与SCA价格地板，提出由纯周期向部分合同保护转变，同时警惕扩产和地板在真实衰退时失效。", "lesson": "重要的是合同覆盖面和下行盈利，而非峰值利润。原文把毛利率写86%，官方本季非GAAP为84.9%，86%是下季指引，存在实际值与预测混用。"}, {"id": "42119646", "author": "老板的老板 AI Exec", "date": "2026-06-24", "title": "晶泰的一些数据", "chars": 567, "read": true, "has_note": true, "themes": ["GS", "BLK", "JPM", "700", "TCTZF", "80700", "TCEHY", "2228", "GS-A", "GS-C", "GS-D", "JPM-C"], "source": "https://longbridge.cn/zh-CN/topics/42119646", "path": "library/42119646.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$晶泰控股(02228.HK) 核心百分比如下： 类别 百分比 对应股数 / 说明 创始股东权益口径 25.70% 温书豪、马健、赖力鹏三人 SFO 权益合计，含信托、期权、受控公司、投票权 创始人实际平台持股口径 16.87% QuantumPharm Roc、Holdings、Crete Helix、SeveningBAlpha、Employee Holdings 等平台合计 主要外部机构股东合计 约 24.64% 腾讯、国寿、晨兴、红杉/高榕？", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "42100439", "author": "Ryan-", "date": "2026-06-23", "title": "Z 先生提到沃什和格林斯潘相似，早几天看到过一篇不错的帖子，复制粘贴给大家看看", "chars": 3244, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/42100439", "path": "library/42100439.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "前提是 AI 生产率开始真正兑现，一旦这个叙事成立，PS 和 PE 都会扩张，最先受益的是 AI 基础设施、半导体、软件平台和高弹性成长股。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "42075084", "author": "Ryan-", "date": "2026-06-23", "title": "同时押注两大独立万亿级 AI 叙事（投资股票先搞懂这家公司到底是干什么的，以及未来打算干什么）", "chars": 1826, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "AVGO", "MAIA", "MRVL", "AMZN", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/42075084", "path": "library/42075084.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Google 引入 Marvell 并非意图完全替代 Broadcom，而是建立 第二供应商 以分散风险、提升供应韧性。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "42083453", "author": "躺平de交易员", "date": "2026-06-23", "title": "人工智能大模型公司真是被高估泡沫吗？", "chars": 2688, "read": true, "has_note": true, "themes": ["OpenAI", "688688", "9988", "BABA", "89988", "NVDA", "GOOG", "GOOGL", "HBBD", "GOOGN"], "source": "https://longbridge.cn/zh-CN/topics/42083453", "path": "library/42083453.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "但 OpenAI、Anthropic、豆包这类头部企业，估值与市值支撑来自真实的用户规模、真实的产业落地、真实的生态闭环与持续的技术迭代。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "42102120", "author": "股神小顾", "date": "2026-06-23", "title": "微乐高人：当反指遇上羊毛局，谁才是真正的赢家？", "chars": 915, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/42102120", "path": "library/42102120.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "代练更委屈：我利润本就微薄，怎么可能赔？", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "42036023", "author": "熊猫校长Ming", "date": "2026-06-22", "title": "我以为碳化硅是特斯拉的故事，结果它跑去了英伟达的电网里", "chars": 1840, "read": true, "has_note": true, "themes": ["NVDA", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/42036023", "path": "library/42036023.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "沿AI电力研究到800VDC及SiC，认为数据中心可创造独立于电动车的新需求；列出部署延期、GaN和替代架构作为反证。", "lesson": "方向可研究，但“没有SiC根本开不了”把系统电压、器件耐压及变换拓扑压成单一必需品结论。英伟达公开生态采用多类器件与分阶段架构，需按具体电源级核验。"}, {"id": "42031419", "author": "AngerBird", "date": "2026-06-21", "title": "成年人最高级的清醒：向上链接，不向下消耗", "chars": 891, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/42031419", "path": "library/42031419.html", "classification": "平台长文；原创性未逐篇认证", "core": "很多人遇到困境，习惯性怪罪环境、埋怨他人，轻易就能为自己的平庸和困顿找到理由，却从来不肯向内复盘、主动寻找解决问题的方法。", "lesson": "反省需由后续规则和行动验证，不能把巨大回撤浪漫化为必经之路。"}, {"id": "42029916", "author": "京城Z先生", "date": "2026-06-21", "title": "美股实盘：涨到你信为止？（20260621）", "chars": 2008, "read": true, "has_note": true, "themes": ["SNDK", "GLW", "GOOG", "TSM", "ASML", "LITE", "SSNGY", "5930", "MRVL", "NVDA", "NEM", "ORCL"], "source": "https://longbridge.cn/zh-CN/topics/42029916", "path": "library/42029916.html", "classification": "平台长文；原创性未逐篇认证", "core": "6月21日无交易，SNDK37.7%，MRVL、GLW、LITE合计29.6%。论据从AI需求转向HBM挤占传统存储产能、光棒18—24个月扩产周期及厂商预付锁产能。他明确不建议因近期大涨才追，自身则除非出现极低价格机会继续持有，正股体验优于倍数工具。", "lesson": "供应扩张慢解释利润持续性，却不保证股价继续上涨：估值可能先反映稀缺。持仓集中与“不追新钱”同时存在；后续应查新增供给、客户CapEx、预付能否转收入及同因子暴露，而非只统计利好数量。"}, {"id": "41958981", "author": "股神小顾", "date": "2026-06-17", "title": "股票实盘 P218:可怜白发生", "chars": 1515, "read": true, "has_note": true, "themes": ["1810", "NVDA", "3690", "MU", "CRCL", "9618", "9992", "PDD", "SNDK", "9868", "81810", "XIACY"], "source": "https://longbridge.cn/zh-CN/topics/41958981", "path": "library/41958981.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "不管你营收如何，你现金流如何，只要你没上 ai 和半导体的车，你就要跌。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "41914672", "author": "股神小顾", "date": "2026-06-16", "title": "股票实盘 P217:我爱刘浩存", "chars": 876, "read": true, "has_note": true, "themes": ["CRCL", "9992", "NVDA", "1810", "MSFT", "AMZN", "META", "XIACY", "81810", "HPPD", "HXXD"], "source": "https://longbridge.cn/zh-CN/topics/41914672", "path": "library/41914672.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "只选择观望，在合适的时候去找适合过居家过日子的女生，比如在合适的时候买入微软、亚马逊、 Meta 这种股票，它早晚总会新高的，这才是炒股的真正逻辑。", "lesson": "比较业务增量、资本开支、利润率和估值，热门公司仍需买价。"}, {"id": "41859947", "author": "熊猫校长Ming", "date": "2026-06-15", "title": "光，根本不是一个东西", "chars": 1478, "read": true, "has_note": true, "themes": ["300502", "MRVL", "NVDA", "AVGO", "GLW", "300308", "COHR", "LITE", "300394", "TSM"], "source": "https://longbridge.cn/zh-CN/topics/41859947", "path": "library/41859947.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "把光分为光纤、模块、激光器/光芯片、光引擎/CPO，判断价值可能往瓶颈迁移；承认CPO延期或模块龙头向上整合会改变赢家。", "lesson": "产业位置比较有价值，但“越往里利润越厚”不是普遍规律。盈利应由产品组合、客户议价与量产成本证明，NVDA投资名单也不等同投资回报保证。"}, {"id": "41856131", "author": "京城Z先生", "date": "2026-06-14", "title": "美股实盘：躺出新高度（20260614）", "chars": 2010, "read": true, "has_note": true, "themes": ["SNDK", "DXYZ", "SPCX", "GOOG", "SSNGY", "TSLA", "NVDA", "LITE", "MU", "NOA3", "NOK", "INFN"], "source": "https://longbridge.cn/zh-CN/topics/41856131", "path": "library/41856131.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 个股方面， 1、科技： NVDA/GOOG 今年美股是 AI 牛市，但对纳指的权重股 M7 可不是，如果说 AI 就是硅基崩老头游戏的话，那么这些大厂就是被崩的老头，而 AI 基建的细分赛道股，就是精神小妹，所以这两年投小妹的都赢麻了，投老头的赚钱不多，甚至还有不少人是亏的，而且全都大幅跑输大盘指数。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "41855363", "author": "晓风 morning_wind", "date": "2026-06-14", "title": "AI 半导体选股的下半场", "chars": 1772, "read": true, "has_note": true, "themes": ["AMD", "INTC", "MU", "ARM", "TSM", "NVDA", "4335"], "source": "https://longbridge.cn/zh-CN/topics/41855363", "path": "library/41855363.html", "classification": "平台长文；原创性未逐篇认证", "core": "主要半导体资产 解读： 对于 A，不是说 $台积电(TSM.US) 应该卖出，而是说，他后续的进一步爆发，需要更多的依赖总 Capex 的增速/总需求增速，以及其他的一些特异性因素（比如你们担心的地缘，Intel 在北美被政策一边倒的扶持等）。", "lesson": "把实际结果、市场预期和估值分别记录；好财报并不自动等于好买点。"}, {"id": "41855042", "author": "熊猫校长Ming", "date": "2026-06-14", "title": "涨了 60 倍的光模块龙头，还能赚下一轮的钱吗？", "chars": 1999, "read": true, "has_note": true, "themes": ["300502", "300394", "688498", "300308", "COHR"], "source": "https://longbridge.cn/zh-CN/topics/41855042", "path": "library/41855042.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "把光产业链分为模块组装、激光器/光芯片、光引擎/CPO封装，认为定价权可能上移；同时指出上游已涨、现有模块龙头可能自行升级，且CPO渗透是多年过程。", "lesson": "值得深挖的框架是技术迁移—利润分配—市场已定价程度—兑现时钟。其光芯片定价权推断不能直接产生买点；营收利润、投资名单、采用率预测及股价需逐条原始核验，也要寻找相反案例。"}, {"id": "41752067", "author": "熊猫校长Ming", "date": "2026-06-12", "title": "都说 AI 要换光，英伟达却塞了 5000 根铜缆", "chars": 1221, "read": true, "has_note": true, "themes": ["NVDA", "MRVL", "COHR"], "source": "https://longbridge.cn/zh-CN/topics/41752067", "path": "library/41752067.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "解释铜与光在速度、距离、功耗、成本上的分工：机柜内短距铜仍有优势，跨柜跨机房光接手；投资机会来自适用边界随带宽变化。", "lesson": "有用的技术问题应按距离与速率拆分，避免“光全面取代铜”。需要分别核验被动铜、AEC、DSP与光方案，不能把机柜所有互联视作同一产品。"}, {"id": "41647323", "author": "AngerBird", "date": "2026-06-10", "title": "投资最大的捷径：不与人攀比，只和认知赛跑", "chars": 1483, "read": true, "has_note": true, "themes": ["认知偏差", "学习", "复盘"], "source": "https://longbridge.cn/zh-CN/topics/41647323", "path": "library/41647323.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者把攀比账户收益视为破坏原有交易节奏的来源，认为资金体量和风险承受能力不同，不能照搬别人的进度。他提倡阅读、复盘和持续学习，同时以自己账户从一万最高做到三百多万的经历支撑论述，并把盈利、亏损几乎全部归因于认知。文章没有给出期间资金流、交易序列、期末金额或风险暴露，因此既有行为建议，也有需要分开的自我归因叙事。", "lesson": "将不攀比落实成只比较计划执行率、研究假设兑现率和风险预算使用情况。读书数量并不自动等于交易优势，短期盈亏也混合了市场环境与运气。尤其不能一边反对收益比较，一边把他人自述的倍数设为自己的目标。"}, {"id": "41629003", "author": "还差3800出圣者遗物", "date": "2026-06-09", "title": "你不能等所有的消息都变成真的再来买入——英特尔近期传闻汇总", "chars": 2680, "read": true, "has_note": true, "themes": ["INTC", "传闻分层", "提前布局", "证据强度", "4335", "AAPL", "AMD", "NVDA", "TSM"], "source": "https://longbridge.cn/zh-CN/topics/41629003", "path": "library/41629003.html", "classification": "作者原创分析或复盘", "core": "将CPU合作、代工制程、先进封装及大客户传言标为官方、高、中高或中可信度，试图由供给短缺找Intel机会；承认一次押注失败，末尾主张有底仓可做波段、不能等消息全落实才买。", "lesson": "可学给事件分层，但等级主要是作者自评，很多高可信项未附原始链接；测试意向、产能可用、设计定点、量产和已收收入不能同级。越靠前参与越应缩仓并写失效条件，而不是以别人还未承认来加信心。本文不是INTC客户/工艺事实已逐项外部核验。"}, {"id": "41616167", "author": "lyhalfway", "date": "2026-06-09", "title": "BMNR 极值推演 6.09", "chars": 642, "read": true, "has_note": true, "themes": ["BMNR", "BMNRD", "BTC"], "source": "https://longbridge.cn/zh-CN/topics/41616167", "path": "library/41616167.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "有了这笔融资，管理层也可以不用顾忌现金仓位减少，在 ETH 大跌期间买入 12.6 万，是 26 年以来最高的买入量。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "41570727", "author": "股神小顾", "date": "2026-06-08", "title": "望潮渔话", "chars": 1270, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/41570727", "path": "library/41570727.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "他一生规避风浪、拒绝变数、畏惧试错，以为修补渔网就是精进，以为观望等待就是远见，殊不知： 过度的稳妥，是最致命的懒惰；极致的求安，是最无声的沉沦。", "lesson": "保留为线索；缺估值、行动或失效条件时不直接转为交易规则。"}, {"id": "41567032", "author": "京城Z先生", "date": "2026-06-07", "title": "美股实盘：鬼故事集中爆发（20260607）", "chars": 2172, "read": true, "has_note": true, "themes": ["NE", "NVDA", "SNDK", "MU", "LITE", "GLW", "BE", "SSNGY", "GOOG", "TSLA", "MRVL", "NEM"], "source": "https://longbridge.cn/zh-CN/topics/41567032", "path": "library/41567032.html", "classification": "平台长文；原创性未逐篇认证", "core": "按照惯例，我会全仓卖出的，但今年先后经历了 BE 和 LITE 两只触发卖点清仓后，公司又天降巨单再次爆拉估值的教训，我觉得这次还是折中一下吧，本金全出了，和 SNDK 一样让利润去跑，毕竟 AI 赛道发展太快了，我基于过往信息给出的估值，可能跟不上科技的更新迭代速度。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "41560688", "author": "晓风 morning_wind", "date": "2026-06-06", "title": "从 VIX 看科技股/AI 的抄底时机", "chars": 14878, "read": true, "has_note": true, "themes": ["OpenAI", "DXYZ", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/41560688", "path": "library/41560688.html", "classification": "平台长文；原创性未逐篇认证", "core": "2 2021-11-26 2021-12-01 - - 31.12 (2021-12-01) 35.32 2.93% / -7.33% / -10.73% 0.40% / -14.65% / -22.87% Omicron 变种触发全球旅行/增长担忧，美股在感恩节后流动性较薄时快速下跌，随后又叠加美联储转鹰和成长股估值压力。", "lesson": "宏观只用于情景与风险预算，不能替代公司研究或成为单一路径保证。"}, {"id": "41517669", "author": "爱妻的交易员", "date": "2026-06-05", "title": "微软从模型合作转向企业AI入口", "chars": 2024, "read": true, "has_note": true, "themes": ["MSFT", "002245", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/41517669", "path": "library/41517669.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "把微软的壁垒定位于企业工作流、身份权限、安全合规及客户关系，认为多模型共存时企业平台仍能收取价值，资本开支是在既有生态上升级。", "lesson": "框架有助于区分模型能力与分发价值；须接到付费率、续费、毛利和新增资本回报，文中尚无可复算估值或具体入场标准。"}, {"id": "41494087", "author": "股神小顾", "date": "2026-06-04", "title": "股票实盘 p211:内地身份的一些思考", "chars": 863, "read": true, "has_note": true, "themes": ["AVGO", "TSM", "NVDA", "ASML", "ALB", "ALB-A"], "source": "https://longbridge.cn/zh-CN/topics/41494087", "path": "library/41494087.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "但是美股可以做对冲，比如你可以通过卖 call，甚至布局更低位的 PUT 来赚一些权利金。", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "41361743", "author": "lyhalfway", "date": "2026-06-02", "title": "BMNR 极值推演 6.2", "chars": 608, "read": true, "has_note": true, "themes": ["MSTR", "BMNR", "BMNRD", "BTC", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/41361743", "path": "library/41361743.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "同时 MSTR 也开始卖币付息，虽然只卖了 32 个，相对总持仓可以忽略不计，但这打破了 Saylor 曾经的绝不卖币的承诺，DAT 的商业模型本质是长期持有底层资产，而不是拿资产低买高卖做做波段，这个动向对市场情绪也造成了一定影响，毕竟还愿意做 BTC 和 ETH 的买盘大户不多了。", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "41300160", "author": "京城Z先生", "date": "2026-05-31", "title": "美股实盘：依旧存为王（20260531）", "chars": 1941, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "NVDA", "MU", "GLW", "NEM", "SNDK", "MRVL", "SBSW", "LITE", "SSNGY"], "source": "https://longbridge.cn/zh-CN/topics/41300160", "path": "library/41300160.html", "classification": "平台长文；原创性未逐篇认证", "core": "5月31日清仓SBSW等额加GLW。作者认为有色与AI细分都跌，但未来反弹弹性后者较高；GLW与LITE均进入支撑与估值区间，选择已有GLW以免再添约6%新仓。SNDK34%，不追涨，保留剩余利润仓。他坦承SBSW是当年美股买错样本。", "lesson": "该文把卖错股与新选择讲明，比只说止损更有用。需要检查“反弹弹性更高”是否来自订单与盈利，而非过去走势；为了少一个名字而集中GLW是管理方便，不等于风险更低。既有弱股可卖，强股也须按当前市值管仓。"}, {"id": "41302430", "author": "老板的老板 AI Exec", "date": "2026-05-31", "title": "2228.HK（晶泰科技 / XtalPi）沽空作用研究报告", "chars": 3867, "read": true, "has_note": true, "themes": ["2432", "2228", "SDGR", "RXRX"], "source": "https://longbridge.cn/zh-CN/topics/41302430", "path": "library/41302430.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "5 镜头沽空贡献分 镜头 测的机制 复核分 A1 流量因果 日内机械打压 13 A4 微观结构 最差/最好交易日里的沽空 24 A3 因子归因 系统性 vs 特异性留出的空间 30 A5 双向 steelman 全面权衡 28 A2 持仓阶段 周度仓位（领先/滞后） 40 离散 13–40；共识 ≈ 27（均值 27、中位 28）→ 折算沽空占跌幅 ~15–20%（区间 10–25%） ，集中在 2026 第二段与压反弹/逼空风险，对 2025/10–12 初始暴跌贡献≈0。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "41296695", "author": "老板的老板 AI Exec", "date": "2026-05-30", "title": "百年美股，91 万亿财富的极端集中", "chars": 1360, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "NVDA", "AVGO", "TSLA", "XOM", "MSFT", "AMZN", "META", "WMT", "AAPL", "603020"], "source": "https://longbridge.cn/zh-CN/topics/41296695", "path": "library/41296695.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "（下列为占百年净财富总额的比例） Apple ████████████████████████████ 5.52% Nvidia █████████████████████████▌ 5.03% Microsoft ██████████████████████▌ 4.43% Alphabet ███████████████████▊ 3.93% Amazon ████████████▌ 2.49% Broadcom ████████▉ 1.76% Exxon Mobil ███████▉ 1.56% Meta ███████▊ 1.53% Tesla ███████▎ 1.43% Walmar", "lesson": "按共同因子合并风险，现金和底仓需明确职责与上限。"}, {"id": "41295905", "author": "股神小顾", "date": "2026-05-30", "title": "股票实盘 P209:股市的布鲁诺", "chars": 1517, "read": true, "has_note": true, "themes": ["000858", "603605", "9888", "89888", "BIDU", "000625", "200625", "MU", "9988", "9626", "9992", "9868"], "source": "https://longbridge.cn/zh-CN/topics/41295905", "path": "library/41295905.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我想全球应该都是缺钱的吧，不然也不至于只拉半导体和存储芯片，AI 相关的一切都在暴涨，和人相关的一切，比如消费，比如汽车，都在暴跌，曾经笑傲股市的中概那些巨头全都在跌，阿里拼多多百度京东哔哩哔哩，甚至一度被视为希望的小鹏全都在暴跌，就连曾经一骑绝尘的泡泡玛特也不行了。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "41241469", "author": "熊猫校长Ming", "date": "2026-05-29", "title": "美光不再是周期股，但可能也不再有定价权", "chars": 2300, "read": true, "has_note": true, "themes": ["MU", "SSNGY"], "source": "https://longbridge.cn/zh-CN/topics/41241469", "path": "library/41241469.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "在前文多头链条外补长鑫供给反例：消费端替代可能迫使三巨头转移产能至AI，削弱DDR5长约议价，区分短期认证限制与中长期供给冲击。", "lesson": "值得学习主动寻找打破寡头假设的新玩家；其“LTA通常季度复核价格”不能推及后续SCA，应逐份区分合同条款。尚无实际产能替代结果可判成功。"}, {"id": "41238930", "author": "老板的老板 AI Exec", "date": "2026-05-29", "title": "晶泰的 science tokens 商业模式", "chars": 977, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/41238930", "path": "library/41238930.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "2. Token 的价值等级演进 内容的逻辑将 Token 的商业价值划分为三个阶段： Token 等级 核心能力 价值密度 典型场景 基础级 聊天、信息交互 较低 日常问答、客服 进阶级 编程、逻辑推理 较高 软件开发、流程自动化 高阶科研级 (3.0) 科学研究 + 物理闭环 极高 药物发现、新材料研发 3. 商业模式变革：从 “按量计费” 到 “销售分成” 由于 3.0 Token 能够直接产出高价值的科研成果，其定价逻辑发生了本质变化： 高阶定价策略 ：不再仅仅按字数计费，而是基于其创造的科学价值进行定价。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "41187476", "author": "熊猫校长Ming", "date": "2026-05-28", "title": "美光不再是周期股，那它赌的是什么？", "chars": 1899, "read": true, "has_note": true, "themes": ["MU", "AMZN", "META", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/41187476", "path": "library/41187476.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "美光大涨后不追，沿长期订单逆推云厂资本开支、融资与终端AI付费，把存储长约的可持续性连接到最终付费人；旧仓不动，新钱持现金。", "lesson": "可学的是追查需求的资金来源；不能把所有AI基建回报只寄托于OpenAI/Anthropic订阅，也不能把单季度支出与当年模型公司收入机械比较。"}, {"id": "41146575", "author": "lyhalfway", "date": "2026-05-27", "title": "BMNR 极值推演 5.27", "chars": 844, "read": true, "has_note": true, "themes": ["BMNR", "BMNRD", "MSTR", "STRC", "STRD", "STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/41146575", "path": "library/41146575.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "过去一周 BMNR 有两个值得关注的信息，1 是 Vitalik 发布了关于 EF 定位和 ETH 愿景的长文，提到 “supporting ETH the asset has necessary aspects outside the scope of EF. This is where we need other heroes. This is where we need other heroes, some of whom hold more ETH than the EF does.” 即基金会只是生态里的普通节点之一，而对于 ETH 的市值管理和资产叙事需要基金会以外的 “other", "lesson": "同时检查币价、每股持币、稀释、债务和净资产溢价，人物号召不替代结构分析。"}, {"id": "41164271", "author": "股神小顾", "date": "2026-05-27", "title": "股票实盘 P208:扶不起的老登", "chars": 953, "read": true, "has_note": true, "themes": ["META", "MSFT", "AMZN", "000858", "TSLA", "UBER", "MU", "603605", "PDD"], "source": "https://longbridge.cn/zh-CN/topics/41164271", "path": "library/41164271.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "没有道理，在美光 300 块钱的时候，很多人都说，它已经透支了未来三年的涨幅，结果它还能冲到 900 甚至 1000 块。", "lesson": "比较业务增量、资本开支、利润率和估值，热门公司仍需买价。"}, {"id": "41112862", "author": "股神小顾", "date": "2026-05-26", "title": "股票实盘 P207:富途之战", "chars": 983, "read": true, "has_note": true, "themes": ["3588", "FUTU", "700", "9901", "1797", "80700", "TCEHY", "TCTZF", "EDU", "HTCD"], "source": "https://longbridge.cn/zh-CN/topics/41112862", "path": "library/41112862.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "选择 76 块钱加仓富途，因为我在另外一个群里面听他们说别的券商还没有停止开户，那我就推导了一下，这波影响不是很大，不然不会顶风作案。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "41077672", "author": "Ryan-", "date": "2026-05-25", "title": "跟着黄仁勋的时间线走，每一阶段的钱都在提前切换", "chars": 1608, "read": true, "has_note": true, "themes": ["ADI", "SIMO", "TXN", "NOK", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/41077672", "path": "library/41077672.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$Arista Networks(ANET.US) $迈威尔科技(MRVL.US) $Credo Tech(CRDO.US) $Astera Labs(ALAB.US) $Lumentum控股(LITE.US) ——这些 AI 数据流动收费站开始进入估值扩张阶段。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "41072580", "author": "京城Z先生", "date": "2026-05-24", "title": "美股实盘：结束是新的开始（20260524）", "chars": 2485, "read": true, "has_note": true, "themes": ["NVDA", "NEM", "SBSW", "MU", "SNDK", "GOOG", "LITE", "MRVL", "GLW", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/41072580", "path": "library/41072580.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 个股方面， 1、科技： NVDA/GOOG 英伟达公布了 Q1 财报。", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "41066920", "author": "Ryan-", "date": "2026-05-23", "title": "AI 基础设施的下一个瓶颈：数据开始传不动了（摘自 x）", "chars": 2506, "read": true, "has_note": true, "themes": ["NOK", "NOA3", "INFN"], "source": "https://longbridge.cn/zh-CN/topics/41066920", "path": "library/41066920.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "老黄其实已经把未来说得很清楚 老黄其实已经把未来的增长路径讲得很清楚：云端 AI 工厂是现在，企业与工业 AI 正在加速落地，Physical AI——自动驾驶、机器人、边缘 AI、AI-RAN——是下一个阶段。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "41055195", "author": "股神小顾", "date": "2026-05-22", "title": "股票实盘 P206:券商整顿，普通人最后的捷径也没了", "chars": 1052, "read": true, "has_note": true, "themes": ["3588", "FUTU"], "source": "https://longbridge.cn/zh-CN/topics/41055195", "path": "library/41055195.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "说实话，这么些年，见过造假财报的，见过退市的，还真没见过被定性为非法然后连锅端走的这感觉怎么说呢，就像你摆了十年的摊，向来是你好我好大家好，大家都习以为常了，结果今天突然给你寄了一张罚单，要把你这十年赚的钱全没收了，还得把摊子砸了。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "40987132", "author": "保持平和", "date": "2026-05-21", "title": "做个复盘～", "chars": 1194, "read": true, "featured": true, "featured_reason": "真实复盘｜记录正股和期权分批买入、反弹后兑现，也承认部分抄底失败，能学习仓位如何随阶段调整。", "has_note": true, "themes": ["市场阶段", "兑现", "失败复盘", "收益口径", "MSFT", "KO", "TSLA", "NFLX", "TSM", "RKLB"], "source": "https://longbridge.cn/zh-CN/topics/40987132", "path": "library/40987132.html", "classification": "作者原创分析或复盘", "core": "主动提示收益率可能受出入金影响；回顾2025亏损后提现等待，2026先分批买正股、跌深后加call。记录TSLA/MSFT/TSM/KO盈利自述，也承认BRK、NFLX、PLTR抄底失败；反弹一个半月后大减期权提现，保留部分正股与极小彩票仓。", "lesson": "不能再把他写成仅有商业指标的一篇作者。新增显示明确认识自己难在磨盘赚钱，并让仓位随机会阶段改变；同时“再差还能怎样”“快到底”推断仍有过度确定性。高收益自述不审计，重点学习承认择时局限和主动兑现，不复制恐慌必反弹的信念。"}, {"id": "40853216", "author": "京城Z先生", "date": "2026-05-17", "title": "美股实盘：牛熊分界线，整点鬼故事（20260517）", "chars": 1545, "read": true, "has_note": true, "themes": ["NVDA", "NEM", "SNDK", "MRVL", "GLW", "SBSW", "MU", "GOOG", "LITE", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/40853216", "path": "library/40853216.html", "classification": "平台长文；原创性未逐篇认证", "core": "$闪迪(SNDK.US) $英伟达(NVDA.US) $迈威尔科技(MRVL.US) $Corgi Lithography & Smcndctr Phtncs ETF(EUV.US) $康宁(GLW.US) $纽蒙特矿业(NEM.US) $3 倍做多黄金矿业 ETN - MicroSectors(GDXU.US) $Sibanye Stillwater(SBSW.US)", "lesson": "从技术叙事继续追到客户采用、收入确认、利润持续时间与供给反应。"}, {"id": "40814421", "author": "股神小顾", "date": "2026-05-15", "title": "股票实盘 P202:特朗普访华，我被套死了", "chars": 770, "read": true, "has_note": true, "themes": ["9626", "META", "MSFT", "NVDA", "9988", "9618", "BILI", "89988", "BABA", "JD", "89618", "HBBD"], "source": "https://longbridge.cn/zh-CN/topics/40814421", "path": "library/40814421.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我既然愿意在 30 块钱的时候买入哔哩哔哩，那没道理现在 19 了我割肉，唯一忧虑的只是没有钱，又融了资，现在又要到爆仓的边缘了。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "40788135", "author": "AngerBird", "date": "2026-05-14", "title": "以下如有雷同纯属虚构", "chars": 1103, "read": true, "has_note": true, "themes": ["TSLA", "NVDA", "BA", "BA-A"], "source": "https://longbridge.cn/zh-CN/topics/40788135", "path": "library/40788135.html", "classification": "平台长文；原创性未逐篇认证", "core": "波音拿到天文数字般的订单，特斯拉将彻底征服东方市场，英伟达会迎来史诗级狂欢！", "lesson": "宏观只用于情景和风险预算，不作为单一路径保证。"}, {"id": "40786872", "author": "昆仑山岩石", "date": "2026-05-14", "title": "闪迪股价目前正在调整，股价见顶了吗？", "chars": 1114, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "NVDA", "SNDK"], "source": "https://longbridge.cn/zh-CN/topics/40786872", "path": "library/40786872.htm
