照长文；原创性未逐篇认证", "core": "同样的上述问题，我再次请 Google Gemini deep research 做了分析，结果如下： 特朗普政府推动制造业回流美国政策的可行性与影响分析报告 1. 执行摘要 特朗普政府的核心目标是通过旨在促使生产回流的政策，包括关税等措施，重振美国制造业。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "28706700", "author": "老板的老板 AI Exec", "date": "2025-04-07", "title": "心里苦，但是脑子不能糊涂", "chars": 4914, "read": true, "has_note": true, "themes": ["COIN", "HOOD", "TSLA", "2228"], "source": "https://longbridge.cn/zh-CN/topics/28706700", "path": "library/28706700.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "风险资产承压： 股市等风险资产面临下行压力，尤其是在贸易紧张升级时。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "28671409", "author": "京城Z先生", "date": "2025-04-06", "title": "美股实盘-20250406：百年未有之大变局真来了？", "chars": 1984, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG", "PBR", "PBR.A", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/28671409", "path": "library/28671409.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 最后，估值表（数值均为美元计价）： --- 本周精选个股研报，已同步分享，本周共 5 篇，涉及中海油、中煤能源、老铺黄金，A 股宏观等。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "28641453", "author": "股神小顾", "date": "2025-04-04", "title": "隆中对（下）", "chars": 1565, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/28641453", "path": "library/28641453.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "加码是你加完我加 那就是有涨跌 你先分析一下 我还没看新闻 如果你赶紧有加码空间就保持那些敏感的 没有就赶紧出了 我：这个新闻是 6:04 出的，然后我看了一下 K 线图，它是 6:10 开始暴跌的，但是当时我在睡觉，没有看到关税反制的新闻，就是说我当时。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "28472820", "author": "京城Z先生", "date": "2025-03-30", "title": "美股实盘-20250330：猴市就要动起来", "chars": 2377, "read": true, "has_note": true, "themes": ["核心与交易仓", "未成交分支", "估值失效", "PBR", "GOOGL", "GOOG", "MSTR", "STRF", "STRK", "PBR.A", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/28472820", "path": "library/28472820.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "3月30日作者清MSTR，现金升至52.1%，BTC ETF约18.2%仍持有；他用布林线上轨挂单减仓，谷歌因差0.4美元未成交而继续持有，MSTR则计划约220买回。解释是短期悲观、中期震荡、长期仍乐观：用MSTR做波段，BTC ETF保留基础敞口避免完全踏空，ETF上限25%。同时认为NVDA若客户砍单使增长消失，原增长估值需要重做，不能只把回撤视为情绪。", "lesson": "保留核心敞口能减少非此即彼，但MSTR的融资与溢价风险不只是普通杠杆。挂单差一点未成交改变整个路径，提醒价位计划要有未成交分支；所谓BTC产品无损耗只能相对表达，仍有费用、跟踪和市场风险。"}, {"id": "28462817", "author": "慢慢长大的南瓜", "date": "2025-03-29", "title": "小白学美股心得记录 7", "chars": 1059, "read": true, "featured": true, "featured_reason": "分批计划｜事先划分资金、设加仓梯度并保留最后一笔；与后续亚马逊加得过快的复盘连读更有价值。", "has_note": true, "themes": ["分批建仓", "预算", "AMZN", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/28462817", "path": "library/28462817.html", "classification": "作者分析与个人方法记录", "core": "2025年3月28日提出先确定各标的资金分配，再设约5%—10%的加仓梯度；当时约五成仓，只容许再加1—3次，最后一笔预留更低位置。披露当晚加台积电165、谷歌160，并设置亚马逊190买单；坦言不会估值，买点主要由当前价格与历史交易确定。", "lesson": "与5月AMZN在218至203间投入八成预算的复盘对照，问题不是从未规划，而是后续执行未持续受剩余预算约束。5%—10%跌幅只能描述价格距离，不说明价值提高；价格下降若伴随利润预期下修，不能机械套用旧梯度。"}, {"id": "28446735", "author": "躺平de交易员", "date": "2025-03-28", "title": "关于微软、英伟达与 OpenAI 之间的特殊收入关系的分析。", "chars": 1081, "read": true, "has_note": true, "themes": ["NVDA", "OpenAI", "MSFT"], "source": "https://longbridge.cn/zh-CN/topics/28446735", "path": "library/28446735.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "此外，有观点认为，微软通过投资 OpenAI，间接影响了英伟达 GPU 在人工智能领域的市场需求，因为 OpenAI 对 GPU 的大量采购，推动了英伟达 GPU 业务的发展，进而使英伟达获得更多收入，而英伟达又可能将部分收入用于购买微软的云计算服务或其他产品，形成一种收入的循环流动。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "28368488", "author": "京城Z先生", "date": "2025-03-26", "title": "股价靠什么涨，你赚的是什么钱", "chars": 832, "read": true, "has_note": true, "themes": ["FFIE", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/28368488", "path": "library/28368488.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者区分盈利增长、估值提高、恐慌交易分歧、行情情绪及博取更高接盘价五种收益，称自己主要做前两种。他以中海油被禁投资后的抛售解释非经营性价格冲击，提醒最危险的是原本追涨投机，套住后改称价值投资。", "lesson": "先给交易写明利润增长还是估值重评驱动，再用对应指标追踪。盈利增长不保证股票上涨，若买入已透支增长仍可亏损；海外也存在情绪投机，不能把市场地域当安全性证据。"}, {"id": "28375027", "author": "躺平de交易员", "date": "2025-03-26", "title": "斗胆评论小米追求低毛利", "chars": 1002, "read": true, "has_note": true, "themes": ["81810", "XIACY", "1810", "NVDA", "HXXD"], "source": "https://longbridge.cn/zh-CN/topics/28375027", "path": "library/28375027.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "5 对小米低毛利的思考☞小米压根就没有高利润的空间，小米从来没有真正高端化过，手机起步，有华为的时候，打不过华为，华为不在了，也打不过苹果。", "lesson": "把结果、市场预期和估值分开，回到公司披露复算关键数字。"}, {"id": "28294018", "author": "京城Z先生", "date": "2025-03-23", "title": "美股实盘-20250323：预判你的预判", "chars": 2670, "read": true, "has_note": true, "themes": ["卖消息", "计划变更", "持币机会成本", "GOOG", "PBR", "NVDA", "GOOGL", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/28294018", "path": "library/28294018.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "3月23日作者卖光NVDA，现金升至27.9%。他原计划在GTC附近阶段减仓，认为大会惯常利好遇上四巫日及大盘调整，更可能卖消息；实际价格提前走强，遂提前执行并由减仓变清仓。他仍认为NVDA不贵、年内甚至上半年可能买回，但预判调整一月至半年；对BTC相关也开始认为传统周期经验受扰，需要更多波段。这是估值看多与短期仓位看空明确分离的操作。", "lesson": "用事件窗口管理敞口有可迁移性，但从部分减到全部应记录新增证据，否则容易被抢跑焦虑放大动作。未来想买回不保证有更好价格；评估清仓需同时记录退出收益、持币时间和错过涨幅，不只展示短期卖在阶段高点。"}, {"id": "28269038", "author": "老板的老板 AI Exec", "date": "2025-03-21", "title": "AI 驱动类人型工业机器人能否破解美国制造业回流难题？5～10 年展望分析", "chars": 14380, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/28269038", "path": "library/28269038.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "2023年前后这一波热潮中， 大量风险投资 涌入：如Figure AI估值达26亿美元，Agility Robotics估值12亿美元，微软、OpenAI、NVIDIA等科技巨头也参与投资 。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题叠加。"}, {"id": "28186483", "author": "lyhalfway", "date": "2025-03-19", "title": "PLTR 发布对白宫 OSTP 的 AI 行动建议", "chars": 1002, "read": true, "has_note": true, "themes": ["PLTR"], "source": "https://longbridge.cn/zh-CN/topics/28186483", "path": "library/28186483.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我们再来看 PLTR 在这份建议里重点说了什么，原文很长就不贴了，直接放结论：  Our recommendations focused on software and application aspects of AI policy, covering five mission sets:   Modernize Federal AI Acquisition and Deployment  Invest in Foundational Data Infrastructure to Support Operational Precision in AI Applications Across ", "lesson": "把技术、采用、合同、收入、利润和融资里程碑分层核验。"}, {"id": "28203726", "author": "股神小顾", "date": "2025-03-19", "title": "为什么港股一直涨", "chars": 620, "read": true, "has_note": true, "themes": ["89988", "BABA", "9988", "HBBD"], "source": "https://longbridge.cn/zh-CN/topics/28203726", "path": "library/28203726.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "因为特朗普太烂了 又是关税又得罪欧盟 美国一达堆问题 大家发现 还是中国稳定 而且中国本身就是价值洼地了 这次招安马云 其实也是一个信号 一个利好 外资愿意来了 其实每次开会之前 内资都是想砸的 也确实砸了 但最终被外资抬起来了 很多人认为这是郭嘉队人造牛市 其实还真不是 郭嘉队管你港股做什么 大 A 都没怎么涨呢 事实不就是外资能进港股不进 A 股 所以港股疯涨 A 股原地不动吗？", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "28127848", "author": "晓风 morning_wind", "date": "2025-03-17", "title": "你做初一，我做十五", "chars": 545, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/28127848", "path": "library/28127848.html", "classification": "平台长文；原创性未逐篇认证", "core": "有人提了个设想：在中国这几年一直充分应对和准备情况下，加上美国国内通胀压力之下，有没有一种可能，这会儿再拿关税硬怼东大，会不会从之前的 “杀敌一千，自损八百” 变成 “杀敌八百，自损一千，甚至两千”。", "lesson": "宏观只用于情景与风险预算，不能替代公司研究或成为单一路径保证。"}, {"id": "28132683", "author": "老板的老板 AI Exec", "date": "2025-03-17", "title": "谁亏了？", "chars": 4206, "read": true, "has_note": true, "themes": ["MSTR", "STRK", "STRF"], "source": "https://longbridge.cn/zh-CN/topics/28132683", "path": "library/28132683.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "市场结构与风险承担 整体而言，这种模式像一个 “高杠杆共舞”：专业机构获取波动套利机会，MSTR 本身通过不断融资囤币，强化了与比特币价格的捆绑度，BTC 持有者在牛市收益放大；普通股东则成为被动承受高波动和摊薄效应的群体，一旦踩错节奏或无法承受剧烈波动，就是潜在的主要 “亏损者”。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "28124601", "author": "京城Z先生", "date": "2025-03-16", "title": "美股实盘-20250316：趋势不太妙", "chars": 2667, "read": true, "has_note": true, "themes": ["GOOG", "NVDA", "GOOGL", "PBR", "GBTC", "TSLA", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/28124601", "path": "library/28124601.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 1.7% 的现金，全部买入大饼 etf 持仓： 谷歌 22.7%，英伟达 27.9%，巴西石油 8.7%，大饼 ETF 18.7%，微策略 22.2%， 其他/现金 0%。", "lesson": "将产品里程碑、监管、商业化与估值分别核验，避免用远景替代当前兑现。"}, {"id": "28121425", "author": "躺平de交易员", "date": "2025-03-15", "title": "问大模型英伟达会重走思科的老路吗（转发）", "chars": 1166, "read": true, "has_note": true, "themes": ["CSCO", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/28121425", "path": "library/28121425.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "英伟达：AMD、Intel 等竞品在软件生态（CUDA 替代成本）和制程工艺（台积电 CoWoS 产能独占）上难以突破，客户如谷歌、微软虽自研芯片但仍依赖英伟达 GPU。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "28109489", "author": "股神小顾", "date": "2025-03-14", "title": "实盘第三天：慢慢戒赌", "chars": 569, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/28109489", "path": "library/28109489.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "现在对炒股的兴趣越来越小了 以前会花十几个小时在股票上 现在就偶尔看看（当然这也不是好事 早上忘记挂单损失了接近 500 块）也越来越不参与股票的涨跌了（大盘红绿和我无关） 昨天晚上看到大盘没突破前低 认为双底 会反弹 果断买了 45 张 hood 的期权 盘中盈利一万 结果尾盘爆杀 亏一万 今天大盘高开 盈利 5000 左右跑了（还不如昨天盘中 时间磨损太严重了） 今天的操作比较少： 买入平仓了 3 张老虎的 put 清仓 300 老虎正股 获利 391 港币 清仓 200 股 tlt 买入平仓 2 张 tlt 的 put 获利 173 港币 清仓了沃尔玛的期权 获利 1634 港币 清仓小", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "27999658", "author": "輸棟樓的韭菜", "date": "2025-03-11", "title": "随笔：特朗普想制造经济衰退？", "chars": 2159, "read": true, "has_note": true, "themes": ["DJT", "DJTWW", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/27999658", "path": "library/27999658.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "市场最害怕的是对手们没能被逼迫下来和特朗普好好谈，特朗普将高关税时间持续延长，最终在这个通胀敏感的时间点，形成了滞胀的经济局面； 从鲍威尔最近的一次公开讲话来看，联储并没有过多担忧关税带来的通胀。", "lesson": "长债有久期风险；低信用风险不等于低波动，宏观方向应用多情景表达。"}, {"id": "27939711", "author": "京城Z先生", "date": "2025-03-10", "title": "在股市抄别人作业的正确姿势", "chars": 676, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/27939711", "path": "library/27939711.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者将学习他人拆为资金周期、股票仓位、投资理念、行业兴趣。资金期限决定可用策略；真实下注比公开发言更重要；策略可能只在某阶段有效；持续研究的兴趣帮助熬过行业低谷。因此学习应先检查自己能否复制完整条件，而非跟随买入。", "lesson": "可迁移为记录表：这笔钱多久不用、最坏损失预算、买卖触发规则、自己能持续跟踪哪些业务。原文段永平组合80%以上及具体持仓仍是转述，不能用于精确跟单，也不能把兴趣替代财务研究。"}, {"id": "27940701", "author": "股神小顾", "date": "2025-03-10", "title": "deepseek 对我的分析", "chars": 3019, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/27940701", "path": "library/27940701.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "\"周三的时候 大盘反弹 他回血了一点点 他还想等等 以为大盘会企稳 结果周四的暴跌让他上头了 他买了末日期权 希望幸运之神能眷顾他一下 就如赌场连输十六局一样 毫无例外的 他又输了 他简直成了活死人\" : 赌徒心态的典型表现，试图通过冒险来弥补损失，结果越陷越深。", "lesson": "把亏损拆成观点、仓位、工具、期限和执行错误，复盘必须转成下一次可检查规则。"}, {"id": "27931314", "author": "京城Z先生", "date": "2025-03-09", "title": "美股实盘-20250309：他把美股调教成 A 股的样子", "chars": 2179, "read": true, "has_note": true, "themes": ["GOOG", "PBR", "NVDA", "GOOGL", "TSLA", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/27931314", "path": "library/27931314.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 谷歌 24.1%，英伟达 26.1%，巴西石油 8.5%，大饼 ETF 17.7%，微策略 21.8%， 其他/现金 1.7%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "27927210", "author": "股神小顾", "date": "2025-03-08", "title": "这周我的精神状态", "chars": 892, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/27927210", "path": "library/27927210.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "周五已经很疲软了 他的全部筹码 都在这周输掉了 也不是没有机会 周一的时候 他已经追回了二月全部的损失 但他还想等一等 拿一拿 结果瀑布下跌 一夜之间 二十万没有了 周三的时候 大盘反弹 他回血了一点点 他还想等等 以为大盘会企稳 结果周四的暴跌让他上头了 他买了末日期权 希望幸运之神能眷顾他一下 就如赌场连输十六局一样 毫无例外的 他又输了 他简直成了活死人 他梭哈期权的时候 还在想 其实这也没什么吧 大不了亏光了 去当赌徒 混混 那些黄毛一无所有 不也是过得悠哉悠哉吗 钱又有什么用呢？", "lesson": "方向、期限、波动率和最大损失需匹配，权利金与融资都不是无成本收益。"}, {"id": "27885896", "author": "躺平de交易员", "date": "2025-03-07", "title": "通过英伟达芯片的供求关系，产能扩张计划，测算未来五年的营收，利润", "chars": 1440, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27885896", "path": "library/27885896.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "三、利润与毛利率分析 1. 短期成本压力 2026 年 Blackwell 芯片量产导致毛利率从 75% 降至 71%，但规模效应及工艺成熟度提升或推动 2027 年毛利率回升至 73%-75%。", "lesson": "把结果、市场预期和估值分开，回到公司披露复算关键数字。"}, {"id": "27855909", "author": "輸棟樓的韭菜", "date": "2025-03-06", "title": "Moderna：平台想象与财务核验缺口", "chars": 1541, "read": true, "has_note": true, "themes": ["MRNA"], "source": "https://longbridge.cn/zh-CN/topics/27855909", "path": "library/27855909.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Covid-19 让近一半人类都为 mRNA 疫苗做了测试，验证了他的可行性，让原本不可知的风险变成了可知，使未来 mRNA 的疫苗也可以成为一大主要业务。", "lesson": "合并同因子暴露并记录风险预算；单股计划可能被组合流动性和回撤迫使改变。"}, {"id": "27865930", "author": "躺平de交易员", "date": "2025-03-06", "title": "问豆包大模型，英伟达的底部在哪里。", "chars": 888, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27865930", "path": "library/27865930.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "四、综合预测区间 短期底部（1-3 个月）：100-113 美元（技术支撑 + 悲观估值） 中期底部（6-12 个月）：120-150 美元（DCF 模型 + 机构估值中枢） 长期价值底部：100 美元以下（极端情况，如 AI 需求崩溃或竞争失控） 五、风险提示 若美国对华芯片限制升级、AMD/DeepSeek 技术突破超预期，底部可能跌破 100 美元。", "lesson": "把结果、市场预期和估值分开，回到公司披露复算关键数字。"}, {"id": "27808650", "author": "輸棟樓的韭菜", "date": "2025-03-05", "title": "光伏：便宜还要等供给出清", "chars": 1316, "read": true, "has_note": true, "themes": ["968", "FSLR", "601012"], "source": "https://longbridge.cn/zh-CN/topics/27808650", "path": "library/27808650.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "美国光伏基本逻辑是：股价便宜、产能出清、利率即将进一步下调、中国涨价等多重利好作用下，除非美国决心灭亡包括特斯拉在内的一切清洁能源企业，不然 fslr 长期来看依旧大概率是值得少量配置的，并作为地缘政治转坏彻底封锁中国光伏时的同业对冲。", "lesson": "拆供需、成本、政策、资本开支与利润久期，不能把低估值当作周期风险消失。"}, {"id": "27828732", "author": "躺平de交易员", "date": "2025-03-05", "title": "通过人工大模型，测算持有英伟达股票五年，回报率是多少", "chars": 1150, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27828732", "path": "library/27828732.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "根据当前股价 119 美元及市场动态，未来五年持有英伟达股票的收益率预测需结合行业趋势、公司基本面及潜在风险，以下为核心分析： 一、乐观情景：300%-400% 收益率（目标价 476-595 美元） 1. AI 算力需求爆发 全球 AI 芯片市场规模预计从 2025 年 800 亿美元增至 2030 年 5000 亿美元，英伟达凭借 90% 的 GPU 份额持续受益。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "27781580", "author": "老板的老板 AI Exec", "date": "2025-03-04", "title": "去统计了过去 3 个月一些关键日期的 2228 在券商的数据分布：", "chars": 1814, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/27781580", "path": "library/27781580.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "sort=holddn&i=35305&sc=&d=2024-12-13 根据提供的数据，我们可以从以下几个方面分析股票的持仓转移情况，并得出一些结论： 1. 持仓总量的变化 通过观察不同日期的 “Cumul. Stake”（累计持股比例）列，可以评估整体市场的集中度和变化趋势： 2024 年 12 月 12 日 ：累计持股比例为 42.27%。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "27791872", "author": "股神小顾", "date": "2025-03-04", "title": "隆中对（中）", "chars": 891, "read": true, "has_note": true, "themes": ["GBTC"], "source": "https://longbridge.cn/zh-CN/topics/27791872", "path": "library/27791872.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我：关机币价在六万多 低于这个位置 就不会生产了 师傅：成本这个东西 不重要 不是不能跌破的理由 比特币成本本就是糊涂账 所以说我说无所谓 更别说生产比特币这些人对现在的市场影响微乎其微了 他们只利好涨价 也只跟随涨价 但他们是算力单位 比特币不划算换其他币就行了 他们只管赚钱 只是算力提供方 我：是的 我侥幸心理太重了 想反弹了再走 师傅：反弹会有 但反弹到什么程度呢 下跌 40% 后反弹 10%？", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "27732177", "author": "輸棟樓的韭菜", "date": "2025-03-02", "title": "2025年3月部署：给基本面设置可观察触发点", "chars": 683, "read": true, "featured": true, "featured_reason": "验证条件｜把芯片降本或提价、Robotaxi扩张和光伏供需写成下一步行动的具体观察点。", "has_note": true, "themes": ["NVDA", "TSLA", "FSLR", "968", "601012"], "source": "https://longbridge.cn/zh-CN/topics/27732177", "path": "library/27732177.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "疑虑Blackwell成本和良率，称看到提价或降本才视为新机会；TSLA等待robotaxi真实扩张；光伏关注FSLR/TAN、信义和隆基，计划再加，生科虽便宜也不逆短期大市。将标普潜在下20%、上15%理解为仓位约束。", "lesson": "比泛泛长期看好更可执行的是预先列提价/降本/部署等触发。可是将毛利下降推成Blackwell商业不成功偏重，可能是产品爬坡。光伏低估没有对应产能退出阈值，最终仍受组合去杠杆影响。市场上/下空间也是主观估计。"}, {"id": "27692385", "author": "股神小顾", "date": "2025-02-28", "title": "隆中对（上）", "chars": 1050, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27692385", "path": "library/27692385.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "你可以开始做空美国了 这次美国埋雷了 不要做头部 头部 41 亿美元蓄水池 你在跟 41 万亿打 我：美股是这样 头部永远涨 小票跌的快退市了 师傅：再差的消息都能稳住股价 除非经济崩盘 比如英伟达 做空中国也是瞎操作 中国股票不赚钱 但总体还是稳定股价的 常年 3000 你以为为什么 还不是大吸小稳定总量 你买空多半入耳熟的 耳熟的头部稳 3000 点多少年了 我：但现在中概是历史最高位 破了以前的高点 郭嘉队也该放手了 师傅：我感觉啊 还能再破 这才多大点泡沫 这个时间点 资产稳定性是比出来的 泡沫高 但其他的泡沫更高 那他就是稳定的 我：但是这种情况下也不适合做多 还是做空更高泡沫的最有", "lesson": "他人观点只能作为线索；跟单前独立写出估值、仓位、退出与最大损失。"}, {"id": "27660163", "author": "老板的老板 AI Exec", "date": "2025-02-27", "title": "AST SpaceMobile vs. Starlink：消费者市场竞争力深度对比", "chars": 18318, "read": true, "has_note": true, "themes": ["ASTS"], "source": "https://longbridge.cn/zh-CN/topics/27660163", "path": "library/27660163.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "AST虽然通过SPAC上市及多轮融资募集了数亿美元（仅2021年IPO及PIPE就募资4.62亿美元 ( AST SpaceMobile - Wikipedia )，2023年又获AT&T、Vodafone、Google等战略投资1.10亿美元 ( AT&T Signs Commercial Agreement With AST SpaceMobile for Satellite-to-Cell Service - Via Satellite )，以及1.15亿美元贷款 ( AST's BlueWalker Satellite Achieves 14Mbps Download, 5G Voic", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "27629680", "author": "老板的老板 AI Exec", "date": "2025-02-27", "title": "关于晶泰的持股思考：", "chars": 588, "read": true, "has_note": true, "themes": ["2228"], "source": "https://longbridge.cn/zh-CN/topics/27629680", "path": "library/27629680.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$晶泰控股(02228.HK) 这两天晶泰在剧烈波动，从高位产生了大概 20% 以上的回撤。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "27515179", "author": "京城Z先生", "date": "2025-02-25", "title": "美股大跌，中概大跌，大饼大跌，这是怎么了？", "chars": 442, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/27515179", "path": "library/27515179.html", "classification": "平台长文；原创性未逐篇认证", "core": "这波跌的并不可怕，算中级别吧，也没什么重大利空，非要让 Z 先生编个理由的话，我会说英伟达财报前避险（可能没有超预期）+ 特朗普想动美联储（上一个这么做的美国总统脑袋开花了）。", "lesson": "把方向、期限和最大损失分开记录；同向正股与衍生品需合并计算风险。"}, {"id": "27472058", "author": "京城Z先生", "date": "2025-02-24", "title": "别学巴菲特去买日本资产", "chars": 979, "read": true, "has_note": true, "themes": ["BRK.A", "BRK.B"], "source": "https://longbridge.cn/zh-CN/topics/27472058", "path": "library/27472058.html", "classification": "平台长文；原创性未逐篇认证", "core": "--- 先从新闻源头说起，巴菲特这笔交易，正确的描述是巴菲特【在日本发债】买日本的【高 roe 资产】，而不是巴菲特【用自己的现金】投资【日本股市】。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "27462489", "author": "京城Z先生", "date": "2025-02-23", "title": "美股实盘-20250223：突如其来的闪崩，迎接下周的大考", "chars": 3261, "read": true, "has_note": true, "themes": ["满仓", "估值与波动", "因子集中", "NVDA", "GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/27462489", "path": "library/27462489.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "2月23日作者自述单周-4.39%，年内转负且跑输标普；未交易，现金为零，GOOGL23.2%、NVDA29%、BTC ETF17.9%、MSTR21.1%。他认为没有足以解释普遍下跌的严重利空，持仓仍低估，踏空风险高于继续承受回撤，因此等NVDA财报再决定。文章坦承不能预测短期股价，却仍以周期信仰和政策预期支撑加密持有，组合集中于AI与币股两条主线。", "lesson": "无法预测短期不应推出必须满仓：定量风险预算并不需要先猜准下跌日期。把ETF和影子股合看，加密已约39%，与科技同时受风险偏好影响；低估值无法限制短期流动性冲击，财报等待期间也应有承受上限。"}, {"id": "27460270", "author": "老板的老板 AI Exec", "date": "2025-02-23", "title": "美国家庭债务危机可能爆发：", "chars": 1120, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/27460270", "path": "library/27460270.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$特斯拉(TSLA.US) 数据分析与解释 1. 关键数据概述 根据纽约联储的数据，当前美国的家庭债务情况呈现以下特点： 家庭总债务持续上升 ：从图表可见，美国家庭总债务已超过 17.5 万亿美元 ，且呈现长期增长趋势。", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "27463564", "author": "躺平de交易员", "date": "2025-02-23", "title": "英伟达霸主盛宴：吃掉全球 77% 的 AI 晶圆（转发自 Jacky 于）", "chars": 2294, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27463564", "path": "library/27463564.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "更讽刺的是，微软、特斯拉这些巨头，嘴上喊着自研芯片，实际晶圆消耗量几乎可以忽略不计——AI 训练还得靠英伟达的 GPU。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "27461439", "author": "躺平de交易员", "date": "2025-02-23", "title": "谈人工智能算力需求、人形机器人的奇点与英伟达的机遇", "chars": 2026, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27461439", "path": "library/27461439.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "未来两年，中国智能算力仍将保持高速增长态势，2025 年智能算力规模预计达到 1,037.3 EFLOPS，较 2024 年增长 43%；2025 年中国人工智能算力市场规模将达到 259 亿美元，较 2024 年增长 36.2%；2026 年市场规模将达到 337 亿美元，为 2024 年的 1.77 倍。", "lesson": "按采用、订单、收入、利润和供给反应拆解，防止同主题仓位叠加。"}, {"id": "27457475", "author": "躺平de交易员", "date": "2025-02-23", "title": "对英伟达及人工智能的思考", "chars": 611, "read": true, "has_note": true, "themes": ["NVDA"], "source": "https://longbridge.cn/zh-CN/topics/27457475", "path": "library/27457475.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "计算依据:3.5 万亿的生意，10% 的利润率，利润是 3500 亿，十年收回全部投资。", "lesson": "把结果、市场预期和估值分开，回到公司披露复算关键数字。"}, {"id": "27366774", "author": "股神小顾", "date": "2025-02-20", "title": "股票闲谈录", "chars": 950, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/27366774", "path": "library/27366774.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "底部为啥阴跌 没量 随便砸 买入都没有 全套死了 这也是主力的计谋 就从印花税就能看出来 啥利好都没用了 现在就是米国没了，股市也牛不了 悲观就是悲观，利好也是利空，为了解套没人信仰 大 a 骗局也该结束了，反复这么多年，都长记性了。", "lesson": "他人观点只能作为线索；跟单前独立写出估值、仓位、退出与最大损失。"}, {"id": "27320869", "author": "京城Z先生", "date": "2025-02-19", "title": "PLTR 的估值毫无意义，但为什么机构会继续购买它呢？", "chars": 2602, "read": true, "has_note": true, "themes": ["PLTR"], "source": "https://longbridge.cn/zh-CN/topics/27320869", "path": "library/27320869.html", "classification": "平台长文；原创性未逐篇认证", "core": "想必那些大机构和政客们，就是听到或看到了相关政策的后续规划，所以才在该公司的估值如此昂贵，甚至已经经过一轮暴涨后，仍然不断加仓买入，因为他们知道，这一切才刚刚开始。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "27336798", "author": "輸棟樓的韭菜", "date": "2025-02-19", "title": "概率篇：不做多不等于可以做空", "chars": 1396, "read": true, "has_note": true, "themes": ["TSLA", "NVDA", "FFIE", "FFIEW"], "source": "https://longbridge.cn/zh-CN/topics/27336798", "path": "library/27336798.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "「不做空」，代表著下行风险小，上行概率不明朗的判断，对应的行为是空仓的持币继续观察，寻找买入点；或 short put 等待期权交割并收取权利金。", "lesson": "先标明赚企业成长、估值修复、趋势或相对定价的钱；不同策略使用不同退出条件。"}, {"id": "27329650", "author": "股神小顾", "date": "2025-02-19", "title": "闲谈 A 股", "chars": 725, "read": true, "has_note": true, "themes": ["CSUAY", "601088", "1088", "601857", " 认下半年不再披露成交价或实时操作。", "lesson": "这不是低频持有自动成功，而是宏观预判、交易可达性和集中因子先后主导结果。以后研究只能采用公开周度动作，不能补造逐笔收益；12月29日记录并非完整截至12月31日年度审计。"}, {"id": "26289263", "author": "晓风 morning_wind", "date": "2024-12-26", "title": "谈谈理想汽车的 AI 战略", "chars": 1230, "read": true, "has_note": true, "themes": ["LI", "2015"], "source": "https://longbridge.cn/zh-CN/topics/26289263", "path": "library/26289263.html", "classification": "平台长文；原创性未逐篇认证", "core": "端到端 +VLM，前者弯道超车，后者让自己在技术路线上完全领先一个身段， 这次发布会，或者其间的周边访谈，应该会释放一些这方面技术信息（强化 AI 心智），如果我没猜错的话，25 年，端到端 +VLM 这 2 个大模型应该会有一个架构上的大升级，从现在的胶水双核变成有机双核， 一如当年 Intel 的胶水双核升级过程。", "lesson": "把实际结果、市场预期和估值分别记录；好财报并不自动等于好买点。"}, {"id": "26282131", "author": "京城Z先生", "date": "2024-12-25", "title": "国债新低与纳指限购的羁绊", "chars": 402, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/26282131", "path": "library/26282131.html", "classification": "平台长文；原创性未逐篇认证", "core": "国内 10 年期国债收益率已经下行至 1.69%，而国债收益率直接影响的是银行存款利率，原因很简单，市场会在（1、5、10 年）的存款和国债之间作出选择，从而最终达成平衡，所以，0 利率时代会随着国债收益率的不断下降，而迅速来临。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "26237302", "author": "老板的老板 AI Exec", "date": "2024-12-23", "title": "我认为的真正最大的宏观：", "chars": 1352, "read": true, "has_note": true, "themes": ["MSTR", "TSLA"], "source": "https://longbridge.cn/zh-CN/topics/26237302", "path": "library/26237302.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "$道琼斯指数(.DJI.US) $Strategy(MSTR.US) $特斯拉(TSLA.US) 投资抓住宏观趋势最重要，什么是宏观，看到 x 上一文，深表认同，转载如下： https://x.com/Wilsonchen1101/status/1870724651292492194?", "lesson": "宏观只用于情景和预算，不构成必然价格路径。"}, {"id": "26236535", "author": "京城Z先生", "date": "2024-12-22", "title": "美股实盘-20241222：下跌时的操作，决定上涨时的心态", "chars": 2438, "read": true, "has_note": true, "themes": ["GOOGL", "NVDA", "MSFT", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/26236535", "path": "library/26236535.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 微软 11.1%，谷歌 23.8%，英伟达 14.9%，巴西石油 7.7%，大饼 ETF 17.6%，mstr 24.8%， 其他/现金 0%。", "lesson": "从技术叙事继续追到客户采用、 STRF", "STRK"], "source": "https://longbridge.cn/zh-CN/topics/25932745", "path": "library/25932745.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "12月8日作者未交易，自述年内收益33.94%；期末BTC ETF18.2%、MSTR18.1%，两者合计36.3%，另有GOOGL21.3%、NVDA15.4%等。他看好政策、资金流及潜在纳指纳入对加密主题的推动，认为错过可能等下一周期；对NVDA则开始讨论向应用层投资能否打开增长天花板。文章呈现从公司经营估值扩展到资金催化的阶段，具体买卖点并未新增。", "lesson": "MSTR与BTC ETF不是两份独立分散，指数纳入预期也可能早被价格消化。错过等四年的说法容易将周期假设变成FOMO；须跟踪资产溢价、融资与实际权重。文中以太坊ETF时间等转述未逐项核验，不作为事件年表依据。"}, {"id": "25814620", "author": "老板的老板 AI Exec", "date": "2024-11-30", "title": "转载：Rocket Lab 火箭实验室 RKLB 还能投资吗？RKLB 对比 Space X", "chars": 3474, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/25814620", "path": "library/25814620.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "我们需要冷静地知道投资太空风险非常大，以下有三点和大家阐述： 火箭研发的高风险（内部风险） 虽然目前中子研发顺利，但是未来的路还很长 二级火箭一开始发射前三次都失败了 SpaceX 一度陷入破产恐慌 所以火箭实验室也不可能一直一帆风顺 外部因素： 投资者过高的期望会对火箭实验室产生更大的压力 如果中子火箭的研发出现问题，股价将直接跳水 太空探索热情是否会持续高涨，还是会有退却的一天 从示意图我们可以看到，中子火箭距离升空还有很多重要的步骤要走： 二级火箭、一级火箭都需要成功通过点火静态测试 最后是组装和预演 这其中任何一步出差错，都会影响股价，更不用说发射之后的问题 估值分析 在了解了以上基本", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "25791423", "author": "老板的老板 AI Exec", "date": "2024-11-28", "title": "关于 mstr 的一个有趣观点：", "chars": 880, "read": true, "has_note": true, "themes": ["MSTR"], "source": "https://longbridge.cn/zh-CN/topics/25791423", "path": "library/25791423.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "如果要玩这个游戏，需要选对进入时间点，然后及时撤出 Michael Saylor 有一件事说了实话，微策略实际在出售的产品就是\"波动性\" 让 ClaudeAI 做一个简单的分析：你怎么看待这个观点的 “正确性” 和 “正确概率” 我对这个观点的评估： 高度可信部分（90%+ 正确） 可转债的基础机制描述 对冲基金参与者的角色 对散户风险的提示 Gamma 交易策略的存在 部分可信但需要补充（70-80% 正确） 对冲基金的套利行为描述 高波动性与套利机会的关系 MSTR 股价与 BTC 价格的关联 存疑部分（50-60% 正确） \"只为制造波动性\"的动机推测 对 Saylor 策略意图的解读 ", "lesson": "复盘应转成下次可执行规则，亏损后不以加杠杆或改目标逃避失效。"}, {"id": "25730309", "author": "京城Z先生", "date": "2024-11-25", "title": "想赚钱，先忘掉成本价", "chars": 1815, "read": true, "featured": true, "featured_reason": "机会成本｜卖掉仍亏的资产、以更高价格买回MSTR，具体说明今天该比较的是未来收益与风险，而非自己的成本价。", "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/25730309", "path": "library/25730309.html", "classification": "平台长文；原创性未逐篇认证", "core": "从确定性例子推进到概率例子，作者主张卖出由现价到未来的收益风险决定，也要与现金和其他股票比较，与自己是否回本无关。实例是卖掉部分仍亏的两倍黄金和爱马仕，以高于上次卖价的价格重新买MSTR，说明亏损卖出与更高价买回可以同时符合前瞻比较。", "lesson": "真正难点不是忘掉历史，而是估计收益分布是否可靠。文中80%、90%、70%属于假设数字，没有给实际MSTR估值过程；应写下更换资产的证据、估值区间、风险和成本，不能用“机会更大”合理化追涨。"}, {"id": "25723982", "author": "京城Z先生", "date": "2024-11-24", "title": "美股实盘-20241124：肾上腺素飙升，千亿美金的天地板", "chars": 2841, "read": true, "has_note": true, "themes": ["MSFT", "AAPL", "GOOGL", "NVDA", "GOOG", "MSTR"], "source": "https://longbridge.cn/zh-CN/topics/25723982", "path": "library/25723982.html", "classification": "平台长文；原创性未逐篇认证", "core": "持仓： 苹果 7.7%，微软 10.5%，谷歌 20.2%，英伟达 7.7%，巴西石油 8.5%，大饼 ETF 17.9%，mstr 19.4%， 其他/现金 8.1%。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "25719600", "author": "老板的老板 AI Exec", "date": "2024-11-23", "title": "Rocket LAB CEO 在 TED 的演讲文字稿：", "chars": 1657, "read": true, "has_note": true, "themes": ["RKLB"], "source": "https://longbridge.cn/zh-CN/topics/25719600", "path": "library/25719600.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "Small Rockets Are the Next Space Revolution | Peter Beck 开场：关于火箭的梦想 “今天这是一场关于火箭的强力分享。", "lesson": "把结果、预期与估值分开，回到公司披露复算关键数字。"}, {"id": "25717903", "author": "老板的老板 AI Exec", "date": "2024-11-23", "title": "转载：格林布拉特：关于指数投资、七巨头和多空策略", "chars": 1594, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/25717903", "path": "library/25717903.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "他认为，用私募股权的视角评估公司，通过现金流而非传统的市净率或市销率，可以更好地发现价值。", "lesson": "按共同因子合并风险，现金和底仓需明确职责与上限。"}, {"id": "25717893", "author": "老板的老板 AI Exec", "date": "2024-11-23", "title": "转载：美股高的吓人！但这两支股票还在地上，准备起飞！", "chars": 1504, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/25717893", "path": "library/25717893.html", "classification": "补充对照长文；原创性未逐篇认证", "core": " , "date": "2024-11-11", "title": "双十一购物节的发展历程与影响", "chars": 2462, "read": true, "has_note": true, "themes": ["线上零售与平台竞争", "投资方法与认知", "估值与预期差", "9988", "BABA", "89988", "HBBD", "PDD", "JD", "89618", "9618"], "source": "https://longbridge.com/zh-CN/topics/25299349", "path": "library/25299349.html", "classification": "本人公开长文", "core": "对商家的影响 销售业绩的提升 ：双十一为商家提供了巨大的销售机会，尤其是中小商家和国货品牌。数据显示，许多中小商家在双十一期间实现了生意的确定性增长，进入 “百万俱乐部” 和 “千万俱乐部”。 库存管理的优化 ：预售制的恢复有助于商家提前锁定需求并合理备货，降低库存风险，提高经营效率。", "lesson": "把平台判断拆成供需密度、履约效率、流量/交易变现、竞争投入与股东回报；产业理解仍需经财报口径和估值桥梁验证。"}, {"id": "25263517", "author": "京城Z先生", "date": "2024-11-09", "title": "美股实盘-20241109：投资就像西天取经，路上诱惑太多", "chars": 2360, "read": true, "has_note": true, "themes": ["AAPL", "GOOGL", "MSFT", "GOOG", "MSTR"], "source": "https://longbridge.cn/zh-CN/topics/25263517", "path": "library/25263517.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 清仓 mstr，买入等额 2x 黄金 持仓： 苹果 8.9%，微软 12.4%，谷歌 15.8%，巴西石油 9.2%，大饼 ETF 16.1%，2x 黄金 34.3%， 爱马仕 3.3%，其他/现金 0%。", "lesson": "把作者的数字拆成收入、利润率、估值倍数与兑现期限，并回到公司披露复算。"}, {"id": "25025697", "author": "京城Z先生", "date": "2024-11-03", "title": "美股实盘-20241103：不是不好，只是不够好", "chars": 2038, "read": true, "has_note": true, "themes": ["AAPL", "GOOGL", "GOOG", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/25025697", "path": "library/25025697.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 8.8%，微软 12.2%，谷歌 15.4%，巴西石油 8.9%，大饼 ETF 14.8%，MSTR 13.7%，2x 黄金 22.9%， 爱马仕 3.3%，其他/现金 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "24884320", "author": "京城Z先生", "date": "2024-10-30", "title": "中国海洋石油 2024Q3 业绩电话会（含投资者提问）", "chars": 16408, "read": true, "has_note": true, "themes": ["80883", "600938", "883"], "source": "https://longbridge.cn/zh-CN/topics/24884320", "path": "library/24884320.html", "classification": "平台长文；原创性未逐篇认证", "core": "$中国海洋石油(00883.HK) 会议要点 1、财务表现与成本管理 公司2024年三季度净利润同比增长19.5%，主要得益于净产量的增加和有效的成本管控。", "lesson": "低倍数可能对应周期高点；供需、资本开支和利润持续时间要一起估。"}, {"id": "24790058", "author": "京城Z先生", "date": "2024-10-27", "title": "美股实盘-20241027：科技财报季与美国大选，上策求稳", "chars": 2489, "read": true, "has_note": true, "themes": ["调仓风险", "工具杠杆", "退出预案", "AAPL", "GOOGL", "GOOG"], "source": "https://longbridge.cn/zh-CN/topics/24790058", "path": "library/24790058.html", "classification": "作者分析/复盘，含外部报道或他人观点转述", "core": "10月27日作者卖出苹果持仓的一半买等额二倍黄金，卖巴油四分之一换MSTR；期末二倍黄金22.9%，BTC ETF14.1%、MSTR13.8%，现金为零。他解释苹果和NVDA预期已充分反映，未来盈利若升再补；MSTR属于跟随BTC的趋势工具，不能按传统估值，短期超预期可换回低估巴油。此时他还给BTC十万美元以上兑现的条件，明确这不是纯粹长期价值持有。", "lesson": "判断某科技股贵不等于换入资产风险更低。二倍黄金与加密在选举和流动性预期下可能共同波动，零现金又削弱应对空间；应比较调仓前后压力损失，而不是用求稳标题或低成本说明风险下降，未来是否兑现须另看后续记录。"}, {"id": "24585995", "author": "京城Z先生", "date": "2024-10-20", "title": "本周实盘-20241020（美股篇）：吃大饼的时间到了？", "chars": 2883, "read": true, "has_note": true, "themes": ["MSTR"], "source": "https://longbridge.cn/zh-CN/topics/24585995", "path": "library/24585995.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 卖出全部 TLT；卖出全部 YINN；卖出全部 BIL 买入等额的 MSTR 持仓： 苹果 18.6%，微软 12.4%，谷歌 14.7%，巴西石油 12.8%，大饼 ETF 14.3%，MSTR 11.8%，2x 黄金 11.6%， 爱马仕 3.4%，其他/现金 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "24502196", "author": "戴某 DEMO", "date": "2024-10-16", "title": "一点思考：线上零售平台的本分", "chars": 1350, "read": true, "has_note": true, "themes": ["线上零售与平台竞争", "企业治理与资本配置", "组合与风险", "PDD", "BABA", "89988", "9988"], "source": "https://longbridge.com/zh-CN/topics/24502196", "path": "library/24502196.html", "classification": "本人公开长文", "core": "偏向消费者还是偏向商家，这应该是个时空问题，不同时空下，谁的机会成本更高，就偏向谁，这是个基本商业逻辑，它不是固定靶；平台追求平衡看上去是政治正确，但会损失一定的平台竞争力，让自己不够锐利，不恰当的举例：就像近代中国抗战结束后国共对峙，在推行土改时，如果追求平衡农民和地主的利益，就会影响自身的竞争力，当然这个例子不够恰当，理解下意思即可。 电商卷服务，是因为购买力稀缺，供给过剩，早年间 PC 互联网，供给稀缺的年代，能有货卖就行，也没人卷服务；退后门槛降低 + 退货率上升的客观现象是消费坍塌 + 平台竞争 + 供给过剩的大背景共同作用的结果，商家的经营成本上升是自身供给竞争力不足导致的主因，如果认为退货率攀升等成本提升就导致商家可以把负反馈继续转嫁给消费者，这是计划经济下，垄断供给才会有的情况，实际情况可能就是平台提升能力，识别出经营成本居高不下，产品设计和品控不足的商家，汰换掉。如果商家因为自身利润不足，就转嫁给消费者，然后平台还识别不出，那就是平台失责了。", "lesson": "把平台判断拆成供需密度、履约效率、流量/交易变现、竞争投入与股东回报；产业理解仍需经财报口径和估值桥梁验证。"}, {"id": "24439162", "author": "京城Z先生", "date": "2024-10-12", "title": "本周实盘-202401012（美股篇）：到处都在画饼，吃不消了", "chars": 2795, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/24439162", "path": "library/24439162.html", "classification": "平台长文；原创性未逐篇认证", "core": "持仓： 苹果 18.7%，微软 12.8%，谷歌 15.2%，巴西石油 13.7%，TLT 5.6%，大饼 ETF 14.3%，2x 黄金 11.3%， 爱马仕 3.6%，其他/现金 5.0%。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "24313551", "author": "京城Z先生", "date": "2024-10-07", "title": "牛市谨慎关注我，很容易耽误你赚钱的", "chars": 650, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/24313551", "path": "library/24313551.html", "classification": "平台长文；原创性未逐篇认证", "core": "考虑到港股国庆暴涨，而我的两只港股标的都是用港股通买的，所以周二开盘后，中海油 H+ 中煤 H 大概率会飙至近 70%，严格意义上的 A 股股票仓位，只有 2.7% 的中远海控。", "lesson": "低估值需与治理、现金分配及需求恢复一并检查。"}, {"id": "24207220", "author": "老板的老板 AI Exec", "date": "2024-10-01", "title": "金融市场的 “反身性”", "chars": 1310, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/24207220", "path": "library/24207220.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "比如，当股票价格上涨时，公司可以更容易获得融资，增强其扩展业务的能力，这反过来改善了公司的基本面。", "lesson": "记录总预算、分批规则、新证据与失效条件，合并同主题风险。"}, {"id": "24174813", "author": "京城Z先生", "date": "2024-09-29", "title": "本周实盘-20240929（美股篇）：软着陆，降息，与美元贬值", "chars": 2798, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/24174813", "path": "library/24174813.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 18.3%，微软 13.0%，谷歌 15.0%，巴西石油 13.4%，TLT 10.9%，大饼 ETF 14.3%，2x 黄金 11.3%， 爱马仕 3.8%，现金 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "24149495", "author": "京城Z先生", "date": "2024-09-27", "title": "什么叫战术性投资中国股票？", "chars": 679, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL", "700", "80700", "TCEHY", "TCTZF", "600519"], "source": "https://longbridge.cn/zh-CN/topics/24149495", "path": "library/24149495.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者解读高盛的战术配置建议，认为政策可触发反弹，但房地产等问题未解，因此只构成阶段机会。他以茅台PE23.87与GOOG23.53对照，认为同样倍数下应比较增长与确定性，而非因为下跌多年就断言中国资产便宜。", "lesson": "可学明确催化剂交易的有效期与退出条件，再比较全球机会成本；不同会计口径、增长、汇率和资本限制使单一PE不能直接定优劣。原文“战术性投资是新词”不应沿用；机构推荐也不是可验证的资金流预测。"}, {"id": "24012544", "author": "京城Z先生", "date": "2024-09-22", "title": "本周实盘-20240922（美股篇）：终于降息了，接下来买什么？", "chars": 3051, "read": true, "has_note": true, "themes": ["GOOG", "GOOGL"], "source": "https://longbridge.cn/zh-CN/topics/24012544", "path": "library/24012544.html", "classification": "平台长文；原创性未逐篇认证", "core": "持仓： 苹果 18.7%，微软 13.4%，谷歌 15.2%，UGL 11.2%，巴西石油 13.4%，TLT 11.1%，大饼 ETF 13.8%，爱马仕 3.3%，现金 0%。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "23879730", "author": "京城Z先生", "date": "2024-09-15", "title": "本周实盘-20240915（美股篇）：押注激进降息预期，标普 500 迫近历史新高", "chars": 3528, "read": true, "has_note": true, "themes": ["GOOGL", "MSFT", "GOOG", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/23879730", "path": "library/23879730.html", "classification": "平台长文；原创性未逐篇认证", "core": "持仓： 苹果 18.7%，微软 13.5%，谷歌 14.9%，英伟达 10.6%，巴西石油 13.8%，TLT 11.6%，大饼 ETF 13.5%，爱马仕 3.3%，现金 0%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "23815121", "author": "京城Z先生", "date": "2024-09-12", "title": "中国海洋石油（00883）的行情结束了吗？", "chars": 1084, "read": true, "has_note": true, "themes": ["600938", "80883", "883"], "source": "https://longbridge.cn/zh-CN/topics/23815121", "path": "library/23815121.html", "classification": "平台长文；原创性未逐篇认证", "core": "全球通胀，原油再不涨就很难了，毕竟过去几十年都维持在 100 美元/桶以内，，基本没怎么涨，而同期全球物价却一直在上涨，这也是巴菲特买石油股的原因之一，他看的是 5 年以后。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "23729008", "author": "京城Z先生", "date": "2024-09-08", "title": "本周实盘-20240908（美股篇）：非农数据不行，避险资金抢跑", "chars": 2046, "read": true, "has_note": true, "themes": ["TSLA", "AAPL"], "source": "https://longbridge.cn/zh-CN/topics/23729008", "path": "library/23729008.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 19.3%，微软 17.6%，谷歌 10.8%，英伟达 9.6%，巴西石油 14.7%，TLT 12.0%，大饼 ETF 12.6%，爱马仕 3.6%，现金 0.8%。", "lesson": "将产品里程碑、监管、商业化与估值分别核验，避免用远景替代当前兑现。"}, {"id": "23669569", "author": "京城Z先生", "date": "2024-09-05", "title": "价值投资，比其他投资策略更高级吗？", "chars": 1525, "read": true, "has_note": true, "themes": ["BRK.B", "BRK.A"], "source": "https://longbridge.cn/zh-CN/topics/23669569", "path": "library/23669569.html", "classification": "平台长文；原创性未逐篇认证", "core": "作者认为价值投资并不更高尚，只是普通人无需内幕或控制权即可通过研究基本面、计算估值、忽略看不懂的公司参与。他特别指出烟蒂策略若不能进入管理层改变资源分配，很容易困在便宜资产中；强调年化5—15%与长期复利、耐心的匹配。", "lesson": "可学习先检验策略要求是否具备，而不是争风格优劣。其“长期正收益基本都是价值投资”“严格遵守想亏都难”等没有统计支撑；烟蒂投资也并非全部必须控制公司。保留适配性思想，去掉绝对胜率宣传。"}, {"id": "23658128", "author": "輸棟樓的韭菜", "date": "2024-09-04", "title": "升能崩盘交易：先定义参与机制，再限定退出", "chars": 2595, "read": true, "featured": true, "featured_reason": "交易复盘｜完整交代升能的买入、仓位和退出，展示参与机制；对手身份等解释仍须视为猜想。", "has_note": true, "themes": ["2459", "1252"], "source": "https://longbridge.cn/zh-CN/topics/23658128", "path": "library/23658128.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "自述2024-09-03以0.179买升能，9月5日0.90清仓。按成交股数而非金额分析从小量下跌、放量、强抛到天量不再创新低的四阶段；只投入娱乐性小资金，认知停牌锁仓风险，认为回原先20元不合理，并按不同潜在买家设退出区间。", "lesson": "量价信号和仓位预算有信息量，但他据此认定空头狙击、股东爆仓、战略投资人接盘价格，只是故事推断，不能从成交图识别交易对手身份。盈利不能验证整套归因；无强制止损/停牌损失上限，不能复制为低风险策略。"}, {"id": "23622747", "author": "京城Z先生", "date": "2024-09-02", "title": "为什么大部分人注定在股市亏钱？", "chars": 872, "read": true, "has_note": true, "themes": [], "source": "https://longbridge.cn/zh-CN/topics/23622747", "path": "library/23622747.html", "classification": "平台长文；原创性未逐篇认证", "core": "第二，认为股市就是庞氏骗局 他们买入一只股票的原因，从来不是认为这家企业值这个价，未来还会更好（哪怕满嘴价值投资），真实原因只有一个：坚信未来会有个大傻子，出比自己买入价高得多的价格接自己的盘，如果没有，那自己就是本次旁氏骗局的最后一棒。", "lesson": "区分长期判断和当次交易规则；加减仓应记录新证据、失效条件和组合占比。"}, {"id": "23604301", "author": "京城Z先生", "date": "2024-09-01", "title": "本周实盘-20240901（美股篇）：99 分的财报也不满意？我选择加仓", "chars": 3234, "read": true, "has_note": true, "themes": ["GOOGL", "GOOG", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/23604301", "path": "library/23604301.html", "classification": "平台长文；原创性未逐篇认证", "core": "持 ，年中中海油A/H合计53.3%、中煤15.4%、茅台15.6%。核心重估在于国内需求变弱，换向油价美元定价与煤炭政策定价。中煤质地不如陕煤，但买价低于估算买点10%以上，只作阶段配置。", "lesson": "值得学把宏观判断传导到收入定价与备选估值，而非只喊看空消费。ETF溢价低于5%换入、超过15%换出是明确工具规则。但能源已高度集中，中海油A/H不是两个独立风险；53.3%的集中不能包装成分散。"}, {"id": "22045429", "author": "京城Z先生", "date": "2024-06-25", "title": "为什么巴菲特看好石油股？", "chars": 792, "read": true, "has_note": true, "themes": ["OXY", "883", "80883", "600938", "PBR", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/22045429", "path": "library/22045429.html", "classification": "平台长文；原创性未逐篇认证", "core": "一、首先，在过去 20 年间，石油价格受战争和政治因素影响，波动剧烈，但价格基本保持在 40-100 美元/桶之间，而同期美国消费者价格指数（CPI）上涨了约 60%。", "lesson": "低倍数可能对应周期高点；供需、资本开支和利润持续时间要一起估。"}, {"id": "22014431", "author": "京城Z先生", "date": "2024-06-23", "title": "本周实盘-20240623（美股篇）：黄总舵主也忍不住套现了？", "chars": 2214, "read": true, "has_note": true, "themes": ["GOOG", "PBR", "GOOGL", "NVDA", "PBR.A"], "source": "https://longbridge.cn/zh-CN/topics/22014431", "path": "library/22014431.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 17.7%，微软 16.8%，巴西石油 14.3%，谷歌 6.7%，TLT 21.5%，大饼 ETF 14.7%，爱马仕 1.2%，现金/其他 7.1%。", "lesson": "宏观判断只能转成情景概率，不能把利率或政策方向当作单一路径保证。"}, {"id": "21861872", "author": "京城Z先生", "date": "2024-06-16", "title": "本周实盘-20240616（美股篇）：AI 三巨头，3.2 万亿元的新起点", "chars": 2850, "read": true, "has_note": true, "themes": ["AAPL", "GOOGL", "GOOG", "MSFT", "HESAY", "NVDA"], "source": "https://longbridge.cn/zh-CN/topics/21861872", "path": "library/21861872.html", "classification": "平台长文；原创性未逐篇认证", "core": "交易： 无 持仓： 苹果 18.1%，微软 16.5%，巴西石油 13.7%，谷歌 6.6%，TLT 21.6%，大饼 ETF 15.0%，爱马仕 1.2%，现金/其他 6.3%。", "lesson": "比较业务增量相对原有体量、资本开支和估值，避免只凭公司质量决定买价。"}, {"id": "21824507", "author": "SpaceM", "date": "2024-06-14", "title": "特斯拉股东大会核心要点", "chars": 819, "read": true, "has_note": true, "themes": ["TSLA"], "source": "https://longbridge.cn/zh-CN/topics/21824507", "path": "library/21824507.html", "classification": "补充对照长文；原创性未逐篇认证", "core": "【投票】 5 个董事会提议都通过了，包括 马斯克 560 亿美元的薪酬方案及更改特斯拉的注册地。 【车 + 电池 + 超冲】 Cybertruck
